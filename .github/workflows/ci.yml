name: CI

on:
  push:
    branches: [main, redesign, "refactor/**", "feature/**", "perf/**"]
  pull_request:
    branches: [main, redesign]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Report results
        if: always()
        run: python3 .github/scripts/report-build.py build.log

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
