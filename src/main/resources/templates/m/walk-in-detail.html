<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant-TW">
<head th:replace="~{m/fragments/app :: head('現場單 · 慕沐村')}"></head>
<body class="has-actionbar">
<svg th:replace="~{m/fragments/app :: icons}"></svg>
<th:block th:replace="~{m/fragments/app :: toasts}"></th:block>

<header class="topbar">
  <a href="/m/walk-in" class="icon-btn" aria-label="回現場單列表"><svg class="i"><use href="#i-back"/></svg></a>
  <div style="flex:1">
    <div style="font-size:18px" th:text="'現場單 #' + ${o.id}">現場單 #12</div>
    <div class="sub" th:text="${row.createdAt} + ' 開單，' + ${o.createdBy}">9/25 10:12 開單</div>
  </div>
  <span class="stage" th:classappend="${stage}" th:text="${row.stageLabel}">服務中</span>
</header>

<main class="wrap">
  <section class="pet-hero">
    <div class="row1">
      <span class="av lg" th:classappend="${petSpecies}" th:text="${row.initial}">豆</span>
      <div style="flex:1;min-width:0">
        <div class="nm" th:text="${row.title}">豆豆</div>
        <div class="meta" th:text="${o.memberName != null} ? ${o.memberName} : '非會員'">陳小姐</div>
      </div>
    </div>
    <div class="steps" th:if="${o.requiresServiceFlow}" aria-label="流程進度">
      <th:block th:with="idx=${stage == 'serving' ? 0 : (stage == 'check' ? 1 : (stage == 'pay' or stage == 'wire' ? 2 : 3))}">
        <div class="st" th:each="label, it : ${ {'服務','核對','結帳'} }"
             th:classappend="${it.index < idx} ? 'done' : (${it.index == idx} ? 'cur' : '')">
          <i></i><span th:text="${label}">服務</span>
        </div>
      </th:block>
    </div>
  </section>

  <div class="section-h"><h2>項目</h2><small th:unless="${o.requiresServiceFlow}">純零售，直接結帳</small></div>
  <section class="panel">
    <div class="line col" th:each="it : ${lines}">
      <div class="top">
        <span class="nm">
          <span th:text="${it.name}">中型犬-中長毛-精緻洗</span>
          <small th:if="${it.retail}">零售商品</small>
          <small th:if="${!it.retail and it.operatorFilled}" class="op" th:text="'經手人：' + ${it.operator}">經手人：小芸</small>
          <small th:if="${!it.retail and !it.operatorFilled}" class="op missing">還沒填經手人</small>
        </span>
        <span class="pr" th:text="${#numbers.formatInteger(it.price, 1, 'COMMA')}">900</span>
      </div>
      <form th:if="${!it.retail and !it.operatorFilled and it.id != null}" class="op-fill" method="post"
            th:action="@{/m/walk-in/{id}/items/{itemId}/operator(id=${o.id},itemId=${it.id})}">
        <select name="staffId" required aria-label="經手人">
          <option value="">選擇經手人</option>
          <option th:each="s : ${staffOptions}" th:value="${s.id}" th:text="${s.name}">小芸</option>
        </select>
        <button type="submit">補填</button>
      </form>
    </div>
    <div class="line sum">
      <span class="nm" th:text="${o.paid} ? '實收' : '原價合計'">原價合計</span>
      <span class="pr" th:text="'NT$ ' + ${#numbers.formatInteger(row.amount, 1, 'COMMA')}">NT$ 1,050</span>
    </div>
  </section>

  <section class="panel" th:if="${o.paid or (o.note != null and !o.note.isEmpty())}">
    <div class="kv" th:if="${o.paid}"><span class="k">付款方式</span><span class="v" th:text="${o.paymentMethodLabel}">現金</span></div>
    <th:block th:if="${o.note != null and !o.note.isEmpty()}">
      <div class="panel-title">備注</div><p th:text="${o.note}"></p>
    </th:block>
  </section>
</main>

<div class="actionbar">
  <form th:if="${stage == 'serving'}" method="post" th:action="@{/m/walk-in/{id}/end-service(id=${o.id})}" class="btn-row js-once"
        data-confirm="確定結束服務嗎？有綁會員的話會通知家長來店接毛孩。">
    <button type="submit" class="btn pri"><svg class="i"><use href="#i-flag"/></svg>結束服務</button>
  </form>
  <div th:if="${stage == 'check'}" class="btn-row">
    <a th:href="@{/m/walk-in/{id}/final-check(id=${o.id})}" class="btn pri">跟家長核對、簽名</a>
  </div>
  <div th:if="${stage == 'pay'}" class="btn-row">
    <a th:href="@{/m/walk-in/{id}/checkout(id=${o.id})}" class="btn wood">前往結帳</a>
  </div>
  <form th:if="${stage == 'wire'}" method="post" th:action="@{/m/walk-in/{id}/confirm-wire(id=${o.id})}" class="btn-row js-once"
        data-confirm="確認已收到這筆匯款嗎？確認後現場單轉為已完成。">
    <button type="submit" class="btn pri"><svg class="i"><use href="#i-check"/></svg>確認已收到匯款</button>
  </form>
  <form th:if="${stage == 'done'}" method="post" th:action="@{/m/walk-in/{id}/refund(id=${o.id})}" class="btn-row js-once"
        data-confirm="確定要退款嗎？退款後這張現場單會直接刪除，需要重新開單。">
    <button type="submit" class="btn ghost-danger">退款</button>
  </form>
</div>

<th:block th:replace="~{m/fragments/app :: weightReminder}"></th:block>

<script>
  document.querySelectorAll("form.js-once").forEach(function (form) {
    form.addEventListener("submit", function (e) {
      if (form.dataset.confirm && !window.confirm(form.dataset.confirm)) { e.preventDefault(); return; }
      var b = form.querySelector("button[type=submit]");
      if (b) b.disabled = true;
    });
  });
</script>
<script th:replace="~{m/fragments/app :: pwa}"></script>
</body>
</html>
