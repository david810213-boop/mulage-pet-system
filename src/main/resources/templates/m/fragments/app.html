<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant-TW">
<!--
  員工手機版共用片段（需求，2026-09-24）
  head(title)：共用 head（字體、樣式、PWA 設定）
  icons：SVG 圖示庫，頁面用 use 標籤引用
  toasts：操作結果提示（toast / toastError，以及從網頁版轉過來的 successMsg / errorMsg）
  tabs(active)：底部分頁列，active 傳 today / appointments / pets / more
  sheets：底部抽屜開關（data-open-sheet / data-close-sheet）
  weightReminder：狗狗結帳後的體重更新提醒抽屜（有 weightReminderPetId 才顯示）
  pwa：註冊 service worker
-->
<head th:fragment="head(title)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3a30" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="慕沐村" />
  <title th:text="${title}">慕沐村 員工</title>
  <link rel="manifest" href="/pwa/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/staff-app.css?v=7" />
</head>
<body>

  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="2"/><rect x="14" y="4" width="6" height="6" rx="2"/><rect x="4" y="14" width="6" height="6" rx="2"/><rect x="14" y="14" width="6" height="6" rx="2"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3zM12 10v4M12 17.5v.5"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/></symbol>

  <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>

<th:block th:fragment="toasts">
  <div class="toast" th:if="${toast != null or successMsg != null}" role="status"><svg class="i"><use href="#i-check"/></svg><span th:text="${toast != null ? toast : successMsg}"></span></div>
  <div class="toast err" th:if="${toastError != null or errorMsg != null}" role="alert"><span th:text="${toastError != null ? toastError : errorMsg}"></span></div>
</th:block>

<nav th:fragment="tabs(active)" class="tabs" aria-label="主選單">
  <a href="/m/" class="t" th:classappend="${active == 'today'} ? 'on'"><svg class="i"><use href="#i-home"/></svg>今日</a>
  <a href="/m/appointments" class="t" th:classappend="${active == 'appointments'} ? 'on'"><svg class="i"><use href="#i-cal"/></svg>預約</a>
  <a href="/m/walk-in/new" class="fab" aria-label="現場開單"><svg class="i"><use href="#i-plus"/></svg></a>
  <a href="/m/pets" class="t" th:classappend="${active == 'pets'} ? 'on'"><svg class="i"><use href="#i-paw"/></svg>毛孩</a>
  <a href="/m/more" class="t" th:classappend="${active == 'more'} ? 'on'"><svg class="i"><use href="#i-grid"/></svg>更多</a>
</nav>

<script th:fragment="sheets">
  // 底部抽屜共用：按鈕加 data-open-sheet="抽屜 id" 開啟，點遮罩、按 Esc 或
  // data-close-sheet 按鈕關閉。頁面上需要有一個 id="sheetDim" 的遮罩。
  (function () {
    function closeAll() {
      document.querySelectorAll(".sheet.open").forEach(function (s) { s.classList.remove("open"); });
      document.body.classList.remove("sheet-open");
    }
    function open(id) {
      var el = document.getElementById(id);
      if (!el) return;
      closeAll();
      el.classList.add("open");
      document.body.classList.add("sheet-open");
      var first = el.querySelector("input:not([type=hidden]), select, textarea");
      if (first) setTimeout(function () { first.focus(); }, 260);
    }
    document.querySelectorAll("[data-open-sheet]").forEach(function (b) {
      b.addEventListener("click", function () { open(b.dataset.openSheet); });
    });
    document.querySelectorAll("[data-close-sheet]").forEach(function (b) {
      b.addEventListener("click", closeAll);
    });
    var dim = document.getElementById("sheetDim");
    if (dim) dim.addEventListener("click", closeAll);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAll(); });
    window.mSheet = { open: open, close: closeAll };
  })();
</script>

<!-- 狗狗結帳後的體重更新提醒（跟網頁版結帳後的彈窗同一套 API） -->
<th:block th:fragment="weightReminder" th:if="${weightReminderPetId != null}">
  <div class="sheet-dim" id="sheetDim"></div>
  <section class="sheet" id="sheetWeight" role="dialog" aria-modal="true" aria-labelledby="hWeight"
           th:attr="data-pet-id=${weightReminderPetId}">
    <div class="grab"></div>
    <h3 id="hWeight">記得更新體重</h3>
    <p style="margin:0 0 14px;font-size:14px;color:var(--mute)">
      <span th:text="${weightReminderPetName}">豆豆</span>的體重是下次開單自動篩選套餐的依據，跟家長確認一下最新體重。
    </p>
    <div class="field">
      <label for="wInput">體重（kg）</label>
      <input type="number" id="wInput" step="0.1" min="0.1" inputmode="decimal" th:value="${weightReminderCurrentWeight}" />
    </div>
    <div class="form-err" id="wErr" hidden></div>
    <div class="btn-row">
      <button type="button" class="btn sec" data-close-sheet>稍後再說</button>
      <button type="button" class="btn pri" id="wSave">儲存體重</button>
    </div>
  </section>
  <script th:replace="~{m/fragments/app :: sheets}"></script>
  <script>
    (function () {
      var sheet = document.getElementById("sheetWeight");
      window.mSheet.open("sheetWeight");
      document.getElementById("wSave").addEventListener("click", function () {
        var btn = this, err = document.getElementById("wErr");
        var w = parseFloat(document.getElementById("wInput").value);
        if (!w || w <= 0) { err.textContent = "請輸入有效的體重"; err.hidden = false; return; }
        btn.disabled = true;
        fetch("/api/admin/pets/" + encodeURIComponent(sheet.dataset.petId) + "/weight", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ weight: w })
        }).then(function (res) {
          if (!res.ok) throw new Error("更新失敗，請再試一次");
          window.mSheet.close();
        }).catch(function (e) { btn.disabled = false; err.textContent = e.message; err.hidden = false; });
      });
    })();
  </script>
</th:block>

<script th:fragment="pwa">
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/pwa/sw.js", { scope: "/m/" }).catch(function () {});
    });
  }
</script>

</body>
</html>
