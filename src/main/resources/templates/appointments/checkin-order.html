<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('現場開單 | 慕沐村 Mulage pet')}"
  ></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content" style="max-width: 640px">
        <div
          class="alert alert-error"
          th:if="${errorMsg}"
          th:text="${errorMsg}"
        ></div>

        <div th:if="${appointment == null}" class="card" style="text-align: center; padding: 3rem 2rem">
          <p style="color: var(--brown-light)">找不到這筆預約，或此預約目前不是「已確認」狀態。</p>
          <a href="/appointments?status=CONFIRMED" class="btn" style="margin-top: 1rem; display: inline-block;">返回預約列表</a>
        </div>

        <div th:if="${appointment != null}">
          <h2 style="margin-bottom: 4px">現場加單</h2>
          <p style="font-size: 13px; color: var(--brown-light); margin-bottom: 1.25rem">
            依現場實際情況確認/調整本次服務項目，確認後才能開始服務
          </p>

          <div class="card" style="margin-bottom: 1.25rem">
            <table style="box-shadow: none; border: none;">
              <tr>
                <td style="color: var(--brown-light); width: 100px; white-space: nowrap; border: none;">預約編號</td>
                <td style="border: none;" th:text="'AP' + ${#numbers.formatInteger(appointment.id, 3)}"></td>
              </tr>
              <tr>
                <td style="color: var(--brown-light); white-space: nowrap; border: none;">飼主 / 寵物</td>
                <td style="border: none;" th:text="${appointment.ownerName} + ' / ' + ${appointment.petName} + '（' + ${appointment.petType} + '）'"></td>
              </tr>
              <tr>
                <td style="color: var(--brown-light); white-space: nowrap; border: none;">原預約項目</td>
                <td style="border: none;">
                  <span th:each="item, iter : ${appointment.selectedItems}">
                    <span th:text="${item.name}"></span><span th:if="${!iter.last}">、</span>
                  </span>
                </td>
              </tr>
            </table>
          </div>

          <!-- 需求（追加，2026-08-29）：店家反饋現場加單遇到已鎖定套餐的狗，
               要跳去會員信息才能解鎖太繁瑣，直接在這裡加解鎖按鈕（沿用既有 API）。 -->
          <div
            class="card"
            th:if="${pet != null and pet.lockedGroomingItemId != null}"
            style="margin-bottom: 1.25rem; background:#fff8e6; border:1px solid #e6c366;"
          >
            <p style="margin: 0; font-size: 13px;">
              🔒 這隻狗已經有固定套餐：<strong th:text="${pet.lockedItemName}"></strong>
              （$<span th:text="${pet.lockedItemPrice}"></span>），上方菜單只會顯示這一項。
            </p>
            <button
              type="button"
              th:onclick="'unlockPet(' + ${pet.id} + ')'"
              class="btn btn-outline"
              style="padding:4px 10px; font-size:12px; margin-top: 8px;"
            >
              🔓 解鎖，重新報價
            </button>
          </div>

          <form method="post" th:action="@{/appointments/{id}/checkin-order(id=${appointment.id})}">
            <div class="card" style="margin-bottom: 1rem">
              <h3 style="font-size: 15px; color: var(--brown-dark); margin-bottom: 12px">
                本次實際服務項目 *（依現場情況勾選，可與原預約項目不同）
              </h3>
              <div
                style="
                  display: grid;
                  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                  gap: 10px;
                  padding: 0.8rem;
                  background-color: var(--cream-100);
                  border: 1px solid var(--cream-300);
                  border-radius: 8px;
                "
              >
                <label
                  th:each="item : ${groomingItems}"
                  th:if="${item.performanceCategory != 'OTHER'}"
                  style="
                    display: flex;
                    flex-wrap: wrap;
                    align-items: center;
                    justify-content: space-between;
                    padding: 10px 14px;
                    background-color: #ffffff;
                    border: 1px solid var(--cream-200);
                    border-radius: 6px;
                    cursor: pointer;
                  "
                >
                  <span style="display:flex; align-items:center; gap:10px;">
                    <input
                      type="checkbox"
                      name="itemCodes"
                      th:value="${item.itemCode}"
                      th:class="${item.performanceCategory == 'SPECIAL'} ? 'special-trigger' : ''"
                      style="width: 16px; height: 16px; accent-color: var(--brown-dark);"
                    />
                    <span th:text="${item.name}" style="font-weight: 500; color: var(--brown-dark)"></span>
                  </span>
                  <span th:text="'$' + ${item.price != null ? #numbers.formatDecimal(item.price, 1, 0) : '0'}" style="color: #2e7d32; font-weight: 600"></span>
                  <select name="operatorStaffIds" class="op-select" disabled
                          style="flex-basis:100%; margin-top:8px; padding:5px 8px; font-size:12px; border:1px solid var(--cream-300); border-radius:6px;">
                    <option value="">經手人：稍後補填</option>
                    <option th:each="s : ${staffList}" th:value="${s.id}" th:text="'經手人：' + ${s.name}"></option>
                  </select>
                </label>
              </div>

              <!-- 需求 4：勾選「特殊項目」後才展開，其餘不計分的加購/調理項目預設收起 -->
              <div id="otherItemsSection" style="display:none; margin-top: 14px;">
                <p style="font-size: 12px; color: var(--brown-light); margin-bottom: 8px;">
                  ✨ 其他加購項目（不計入員工積分）
                </p>
                <div
                  style="
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
                    gap: 10px;
                    padding: 0.8rem;
                    background-color: var(--cream-100);
                    border: 1px dashed var(--cream-300);
                    border-radius: 8px;
                  "
                >
                  <label
                    th:each="item : ${groomingItems}"
                    th:if="${item.performanceCategory == 'OTHER'}"
                    style="
                      display: flex;
                      flex-wrap: wrap;
                      align-items: center;
                      justify-content: space-between;
                      padding: 10px 14px;
                      background-color: #ffffff;
                      border: 1px solid var(--cream-200);
                      border-radius: 6px;
                      cursor: pointer;
                    "
                  >
                    <span style="display:flex; align-items:center; gap:10px;">
                      <input
                        type="checkbox"
                        name="itemCodes"
                        th:value="${item.itemCode}"
                        style="width: 16px; height: 16px; accent-color: var(--brown-dark);"
                      />
                      <span th:text="${item.name}" style="font-weight: 500; color: var(--brown-dark)"></span>
                    </span>
                    <span th:text="'$' + ${item.price != null ? #numbers.formatDecimal(item.price, 1, 0) : '0'}" style="color: #2e7d32; font-weight: 600"></span>
                    <select name="operatorStaffIds" class="op-select" disabled
                            style="flex-basis:100%; margin-top:8px; padding:5px 8px; font-size:12px; border:1px solid var(--cream-300); border-radius:6px;">
                      <option value="">經手人：稍後補填</option>
                      <option th:each="s : ${staffList}" th:value="${s.id}" th:text="'經手人：' + ${s.name}"></option>
                    </select>
                  </label>
                </div>
              </div>
            </div>

            <script>
              // 需求 4：勾選「特殊項目」才展開其餘不計分的加購項目清單
              document.querySelectorAll('.special-trigger').forEach(function (cb) {
                cb.addEventListener('change', function () {
                  if (this.checked) {
                    document.getElementById('otherItemsSection').style.display = 'block';
                  }
                });
              });

              // 需求（追加，2026-08-29）：這頁的解鎖直接整頁 reload——跟結帳頁的
              // unlockPet() 邏輯一致，reload 後菜單會重新依體重篩選，是對的行為，
              // 且這頁進來還沒填任何表單資料，reload 不會有洗掉輸入的問題。
              async function unlockPet(petId) {
                if (!confirm('確定要解鎖嗎？解鎖後菜單會恢復成依體重重新篩選。')) return;
                try {
                  const res = await fetch('/api/admin/pets/' + petId + '/unlock-grooming-item', { method: 'PUT' });
                  if (!res.ok) {
                    alert('解鎖失敗，請重試');
                    return;
                  }
                  window.location.reload();
                } catch (e) {
                  alert('網路錯誤，請重試');
                }
              }
            </script>

            <!-- 需求（2026-10-02）：比照現場開單，勾選的項目可以直接選經手人（預設稍後補填） -->
            <div class="card" style="margin-bottom: 1rem; display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px;">
              <span>勾選的項目經手人全部設為</span>
              <select id="opAll" style="padding:6px 8px; border:1px solid var(--cream-300); border-radius:6px;">
                <option value="" selected disabled>選擇…</option>
                <option value="later">稍後補填</option>
                <option th:each="s : ${staffList}" th:value="${s.id}" th:text="${s.name}"></option>
              </select>
              <span style="color: var(--brown-light); font-size: 12px;">選了經手人的項目，開單當下就計入積分，填好後不能修改。</span>
            </div>
            <script>
              (function () {
                // 只有勾選的項目，經手人選單才啟用並送出，讓 itemCodes 跟 operatorStaffIds 順序一一對應
                var boxes = document.querySelectorAll('input[name=itemCodes]');
                function sel(cb) { return cb.closest('label').querySelector('select.op-select'); }
                boxes.forEach(function (cb) {
                  sel(cb).disabled = !cb.checked;
                  cb.addEventListener('change', function () { sel(cb).disabled = !cb.checked; });
                });
                document.getElementById('opAll').addEventListener('change', function () {
                  var v = this.value === 'later' ? '' : this.value;
                  boxes.forEach(function (cb) { if (cb.checked) sel(cb).value = v; });
                  this.selectedIndex = 0;
                });
              })();
            </script>

            <div style="display: flex; gap: 12px">
              <button type="submit" class="btn btn-primary">確認開單，可開始服務</button>
              <a href="/appointments?status=CONFIRMED" class="btn btn-outline">取消</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
