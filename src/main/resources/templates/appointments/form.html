    <script th:inline="javascript">
      /*<![CDATA[*/
      /*]]>*/

      const canvas = document.getElementById("signaturePad");
      const ctx = canvas.getContext("2d");
      const placeholder = document.getElementById("signaturePlaceholder");
      const hint = document.getElementById("signatureHint");
      const hiddenInput = document.getElementById("contractSignatureData");
      const submitBtn = document.getElementById("submitBtn");
      const agreeCheckbox = document.getElementById("contractAgreeCheckbox");
      const clearBtn = document.getElementById("clearSignatureBtn");

      let hasSigned = false;
      let drawing = false;

      // Canvas 實際繪圖解析度對齊顯示尺寸，簽名線條才不會模糊或跑位
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = rect.width * ratio;
        canvas.height = rect.height * ratio;
        ctx.scale(ratio, ratio);
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#2b2a28";
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function getPos(evt) {
        const rect = canvas.getBoundingClientRect();
        if (evt.touches && evt.touches.length > 0) {
          return {
            x: evt.touches[0].clientX - rect.left,
            y: evt.touches[0].clientY - rect.top,
          };
        }
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      }

      function startDraw(evt) {
        evt.preventDefault();
        drawing = true;
        placeholder.style.display = "none";
        const pos = getPos(evt);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function moveDraw(evt) {
        if (!drawing) return;
        evt.preventDefault();
        const pos = getPos(evt);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        hasSigned = true;
        updateSubmitState();
      }

      function endDraw() {
        drawing = false;
      }

      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", moveDraw);
      window.addEventListener("mouseup", endDraw);
      canvas.addEventListener("touchstart", startDraw, { passive: false });
      canvas.addEventListener("touchmove", moveDraw, { passive: false });
      canvas.addEventListener("touchend", endDraw);

      clearBtn.addEventListener("click", function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        placeholder.style.display = "block";
        hasSigned = false;
        hiddenInput.value = "";
        updateSubmitState();
      });

      function updateSubmitState() {
        const agreed = agreeCheckbox.checked;

        if (!hasSigned) {
          hint.style.color = "var(--brown-light)";
          hint.textContent = "簽名須為親筆手寫，系統才會受理此預約";
        } else {
          hint.style.color = "#2e7d32";
          hint.textContent = "✓ 已完成簽名";
        }

        submitBtn.disabled = !(agreed && hasSigned);
      }

      agreeCheckbox.addEventListener("change", updateSubmitState);

      // 送出表單前，把簽名畫布內容轉成圖片資料寫入隱藏欄位；並確認已選擇時段
      document.querySelector("form").addEventListener("submit", function (e) {
        if (!document.getElementById("startTimeHidden").value) {
          e.preventDefault();
          alert("請先選擇預約時段");
          return;
        }
        if (!hasSigned) {
          e.preventDefault();
          return;
        }
        hiddenInput.value = canvas.toDataURL("image/png");
      });
    </script>
    <script>
      let selectedSlotEl = null;

      async function loadSlots() {
        const dateInput = document.getElementById("dateInput");
        const date = dateInput.value;
        const slotsField = document.getElementById("slotsField");
        const container = document.getElementById("slotsContainer");

        document.getElementById("dateHidden").value = date;
        document.getElementById("startTimeHidden").value = "";
        document.getElementById("endTimeHidden").value = "";
        selectedSlotEl = null;

        if (!date) {
          slotsField.style.display = "none";
          return;
        }

        slotsField.style.display = "block";
        container.innerHTML = '<div class="slots-loading">載入時段中...</div>';

        try {
          const res = await fetch("/api/appointments/slots?date=" + date, {
            credentials: "same-origin",
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const slots = await res.json();

          if (!slots.length) {
            container.innerHTML = '<div class="slots-empty">當天無可預約時段</div>';
            return;
          }

          container.innerHTML =
            '<div class="slots-grid">' +
            slots
              .map(function (s) {
                var cls = "slot-btn" + (s.available ? "" : " unavailable");
                var label = s.startTime.substring(0, 5) + " - " + s.endTime.substring(0, 5);
                return (
                  '<div class="' + cls + '" data-start="' + s.startTime + '" data-end="' + s.endTime + '">' +
                  label +
                  "</div>"
                );
              })
              .join("") +
            "</div>";

          container.querySelectorAll(".slot-btn:not(.unavailable)").forEach(function (el) {
            el.addEventListener("click", function () {
              container.querySelectorAll(".slot-btn").forEach(function (b) {
                b.classList.remove("selected");
              });
              el.classList.add("selected");
              selectedSlotEl = el;
              document.getElementById("startTimeHidden").value = el.dataset.start;
              document.getElementById("endTimeHidden").value = el.dataset.end;
            });
          });
        } catch (e) {
          container.innerHTML =
            '<div class="slots-empty" style="color:#c62828">載入時段失敗：' + e.message + "</div>";
        }
      }

      function autoCheckItems() {
        const select = document.getElementById("petSelect");
        const selected = select.options[select.selectedIndex];
        const recommend = selected.dataset.recommend || "";

        // 先全部取消勾選
        document
          .querySelectorAll('input[name="selectedItems"]')
          .forEach((cb) => {
            cb.checked = false;
            cb.closest("label").style.background = "#ffffff";
            cb.closest("label").style.borderColor = "var(--cream-200)";
          });

        // 依推薦 itemCode 自動勾選
        if (recommend) {
          const codes = recommend
            .split(",")
            .map((c) => c.trim())
            .filter(Boolean);
          codes.forEach((code) => {
            const cb = document.querySelector(
              `input[name="selectedItems"][value="${code}"]`,
            );
            if (cb) {
              cb.checked = true;
              cb.closest("label").style.background = "#fff8f0";
              cb.closest("label").style.borderColor = "#c9a84c";
            }
          });
          document.getElementById("autoHint").style.display = codes.length
            ? "block"
            : "none";
        } else {
          document.getElementById("autoHint").style.display = "none";
        }
      }

      // 讓已勾選的 checkbox 視覺上高亮
      document.querySelectorAll('input[name="selectedItems"]').forEach((cb) => {
        cb.addEventListener("change", function () {
          this.closest("label").style.background = this.checked
            ? "#fff8f0"
            : "#ffffff";
          this.closest("label").style.borderColor = this.checked
            ? "#c9a84c"
            : "var(--cream-200)";
        });
      });
    </script>
  </body>
</html>
