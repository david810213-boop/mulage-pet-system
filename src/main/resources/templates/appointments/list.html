<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('預約管理 | 慕沐村 Mulage pet')}"
  ></head>
  <body>
    <style>
      /* 此頁表格覆蓋全站 100% 寬度設定，改為依內容自動撐開欄寬，避免文字被硬擠換行 */
      .appt-table {
        width: auto;
        max-width: 100%;
        table-layout: auto;
      }
      .appt-table th,
      .appt-table td {
        white-space: nowrap;
        padding: 10px 16px;
      }
      /* 「項目」欄：多個服務名稱之間換行排列，但每個名稱本身不換行，並給予足夠寬度 */
      .appt-table td.items-cell {
        white-space: normal;
        min-width: 160px;
      }
      .appt-table td.items-cell div {
        white-space: nowrap;
      }
      /* 操作欄的提示文字較長，允許獨立換行但不擠壓其他欄位 */
      .appt-table td.action-cell {
        white-space: normal;
        min-width: 140px;
      }
      /* 若表格總寬度超過畫面，允許整頁橫向捲動，而不是壓縮欄位 */
      .table-scroll {
        overflow-x: auto;
      }
    </style>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content">
        <div
          class="alert alert-success"
          th:if="${successMsg}"
          th:text="${successMsg}"
        ></div>
        <div
          class="alert alert-error"
          th:if="${errorMsg}"
          th:text="${errorMsg}"
        ></div>
        <div class="alert alert-error" th:if="${param.error}">
          您沒有權限執行此操作
        </div>
        <div class="action-bar">
          <h2>預約管理</h2>
          <a href="/appointments/new" class="btn" th:if="${user.customer}"
            >＋ 新增預約</a
          >
        </div>

        <!-- 篩選表單 -->
        <form method="get" action="/appointments"
              style="display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:1.2rem; background:#f8f9fa; padding:14px; border-radius:10px;">
          <div>
            <label style="display:block; font-size:12px; color:#666; margin-bottom:4px;">日期從</label>
            <input type="date" name="dateFrom" th:value="${dateFrom}"
                   style="padding:6px 8px; border:1px solid #ddd; border-radius:6px;" />
          </div>
          <div>
            <label style="display:block; font-size:12px; color:#666; margin-bottom:4px;">日期到</label>
            <input type="date" name="dateTo" th:value="${dateTo}"
                   style="padding:6px 8px; border:1px solid #ddd; border-radius:6px;" />
          </div>
          <div>
            <label style="display:block; font-size:12px; color:#666; margin-bottom:4px;">預約狀態</label>
            <select name="status" style="padding:6px 8px; border:1px solid #ddd; border-radius:6px;">
              <option value="" th:selected="${status == null or status == ''}">全部</option>
              <option value="CONFIRMED" th:selected="${status == 'CONFIRMED'}">已確認</option>
              <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">已取消</option>
            </select>
          </div>
          <div>
            <label style="display:block; font-size:12px; color:#666; margin-bottom:4px;">付款狀態</label>
            <select name="paidStatus" style="padding:6px 8px; border:1px solid #ddd; border-radius:6px;">
              <option value="" th:selected="${paidStatus == null or paidStatus == ''}">全部</option>
              <option value="PAID" th:selected="${paidStatus == 'PAID'}">已結帳</option>
              <option value="UNPAID" th:selected="${paidStatus == 'UNPAID'}">未結帳</option>
            </select>
          </div>
          <div style="flex:1; min-width:160px;">
            <label style="display:block; font-size:12px; color:#666; margin-bottom:4px;">關鍵字（編號/飼主/寵物）</label>
            <input type="text" name="keyword" th:value="${keyword}" placeholder="例：AP001、Hedy、王小美"
                   style="width:100%; padding:6px 8px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box;" />
          </div>
          <div style="display:flex; gap:8px;">
            <button type="submit" class="btn" style="padding:7px 16px;">篩選</button>
            <a href="/appointments" class="btn btn-outline" style="padding:7px 16px;">重置</a>
          </div>
        </form>

        <div class="table-scroll">
        <table class="appt-table">
          <thead>
            <tr>
              <th>預約編號</th>
              <th>飼主</th>
              <th>寵物</th>
              <th>日期</th>
              <th>時間</th>
              <th>項目</th>
              <th>金額</th>
              <th>狀態</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${appointments == null or appointments.isEmpty()}">
              <td
                colspan="9"
                style="text-align: center; color: #aaa; padding: 2rem"
              >
                目前沒有預約紀錄
              </td>
            </tr>
            <tr th:each="a : ${appointments}"
                th:style="${a.cancelled} ? 'opacity:0.55;' : ''">
              <td th:text="${a.appointmentCode}"></td>
              <td th:text="${a.ownerName}"></td>
              <td th:text="${a.petName + ' (' + a.petType + ')'}"></td>
              <td th:text="${a.date}"></td>
              <td th:text="${a.startTime + ' ~ ' + a.endTime}"></td>

              <td class="items-cell">
                <div
                  th:each="item : ${a.selectedItems}"
                  th:text="${item.name}"
                  style="font-size: 13px; margin-bottom: 2px"
                >
                  美容項目名稱
                </div>
              </td>

              <td th:text="${'$' + a.totalAmount}"></td>
              <td>
                <span class="badge" style="background:#eee; color:#999;" th:if="${a.cancelled}">已取消</span>
                <span class="badge" style="background:#fff3cd; color:#856404;" th:if="${!a.cancelled and a.status.name() == 'PENDING_CONFIRM'}">待確認</span>
                <span class="badge paid" th:if="${!a.cancelled and a.paid}">已結帳</span>
                <span class="badge unpaid" th:if="${!a.cancelled and !a.paid}">未結帳</span>
                <div th:if="${!a.cancelled and a.confirmedTime != null}" style="font-size:11px; color:#999; margin-top:2px;">
                  確認時間：<span th:text="${#temporals.format(a.confirmedTime, 'MM/dd HH:mm')}"></span>
                </div>
                <!-- 需求 7：會員可見備注，所有角色都能看到自己收到的備注 -->
                <div th:if="${a.memberNote != null and !a.memberNote.isEmpty()}" style="font-size:11px; color:#5c3d2e; margin-top:2px; max-width:150px;">
                  📌 <span th:text="${a.memberNote}"></span>
                </div>
              </td>
              <td class="action-cell">
                <div th:if="${!a.cancelled}" style="display:flex; flex-direction:column; gap:4px;">
                  <!-- 需求 3：店家確認預約 -->
                  <form th:if="${user.staffOrAdmin and a.status.name() == 'PENDING_CONFIRM'}"
                        th:action="@{/appointments/{id}/confirm(id=${a.id})}"
                        method="post" style="display:flex; gap:4px; align-items:center;">
                    <button type="submit" class="btn" style="padding:3px 10px; font-size:12px;">✓ 確認預約</button>
                  </form>
                  <!-- 需求 7：店家編輯雙可見性備注（只有 STAFF/ADMIN 看得到這個表單，internalNote 只會出現在這裡） -->
                  <details th:if="${user.staffOrAdmin}" style="font-size:12px;">
                    <summary style="cursor:pointer; color:#555;">✏️ 編輯備注</summary>
                    <form th:action="@{/appointments/{id}/notes(id=${a.id})}" method="post"
                          style="display:flex; flex-direction:column; gap:4px; margin-top:6px; min-width:180px;">
                      <label style="font-size:11px; color:#999;">店家內部備注（僅後台看得到）</label>
                      <textarea name="internalNote" rows="2"
                                style="font-size:12px; padding:4px; border:1px solid #ddd; border-radius:4px;"
                                th:text="${a.internalNote}"></textarea>
                      <label style="font-size:11px; color:#999;">會員可見備注</label>
                      <textarea name="memberNote" rows="2"
                                style="font-size:12px; padding:4px; border:1px solid #ddd; border-radius:4px;"
                                th:text="${a.memberNote}"></textarea>
                      <button type="submit" class="btn btn-outline" style="padding:3px 10px; font-size:12px;">儲存備注</button>
                    </form>
                  </details>
                  <a
                    th:unless="${a.paid}"
                    th:href="@{/payments/checkout/{id}(id=${a.id})}"
                    style="font-size: 12px; color: #555; text-decoration: underline;"
                    >結帳</a
                  >
                  <form th:unless="${a.paid}"
                        th:action="@{/appointments/{id}/cancel(id=${a.id})}"
                        method="post"
                        onsubmit="return confirm('確定要取消這筆預約嗎？（' + this.dataset.code + '）');"
                        th:data-code="${a.appointmentCode}">
                    <input type="hidden" name="reason" value="店家後台取消" />
                    <button type="submit"
                            style="font-size:12px; color:#c62828; background:none; border:none; text-decoration:underline; cursor:pointer; padding:0;">
                      取消預約
                    </button>
                  </form>
                  <span th:if="${a.paid}" style="font-size:11px; color:#bbb; white-space:normal; display:block; max-width:130px;">已結帳，需先退款才能取消</span>
                </div>
                <div th:if="${a.cancelled}" style="font-size:11px; color:#999;">
                  <div th:text="${a.cancelledBy}"></div>
                  <div th:if="${a.cancelReason}" th:text="'原因：' + ${a.cancelReason}"></div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
        </div>
      </div>
    </div>
  </body>
</html>
