<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('儲值管理 | 慕沐村 Mulage pet')}"
  ></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>

      <div class="content">
        <div
          class="page-header"
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
          "
        >
          <h2 style="margin: 0">儲值管理</h2>
        </div>

        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>
        <div class="alert alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

        <!-- ── 待審核儲值申請 ── -->
        <div class="section-title">待審核儲值申請</div>
        <p style="font-size: 12.5px; color: var(--brown-light); margin-bottom: 0.75rem;">
          僅顯示待核帳（PENDING）的申請。核對銀行入帳後點「確認入帳」，金額才會真正加進會員錢包；查無此筆匯款請點「駁回」。
        </p>

        <table style="margin-bottom: 2rem;">
          <thead>
            <tr>
              <th>申請時間</th>
              <th>會員</th>
              <th>帳號</th>
              <th>金額</th>
              <th>匯款後五碼</th>
              <th>備註</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(pendingTopups)}">
              <td colspan="7" class="empty">目前沒有待核帳的儲值申請</td>
            </tr>
            <tr th:each="r : ${pendingTopups}">
              <td th:text="${#temporals.format(r.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
              <td th:text="${r.name}"></td>
              <td th:text="${r.username}"></td>
              <td>
                <span
                  style="font-weight: 600; color: var(--brown-dark)"
                  th:text="'$' + ${#numbers.formatInteger(r.amount, 0, 'COMMA')}"
                ></span>
              </td>
              <td th:text="${r.lastFiveDigits} ?: '—'"></td>
              <td th:text="${r.remitNote} ?: '—'" style="font-size: 12px; color: var(--brown-light);"></td>
              <td style="white-space: nowrap;">
                <form
                  th:action="@{/admin/topup/{id}/confirm(id=${r.id})}"
                  method="post"
                  style="display: inline-block; margin-right: 6px;"
                  onsubmit="return confirm('確認已收到匯款，要幫此會員加值嗎？');"
                >
                  <button type="submit" class="btn" style="padding: 5px 12px; font-size: 13px;">
                    確認入帳
                  </button>
                </form>
                <button
                  type="button"
                  class="btn btn-outline"
                  style="padding: 5px 12px; font-size: 13px; color: #8b3a3a; border-color: #c9a3a3;"
                  th:onclick="'rejectPrompt(' + ${r.id} + ')'"
                >
                  駁回
                </button>
                <form
                  th:id="'reject-form-' + ${r.id}"
                  th:action="@{/admin/topup/{id}/reject(id=${r.id})}"
                  method="post"
                  style="display: none;"
                >
                  <input type="hidden" name="reason" />
                </form>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- ── 顧客儲值列表 ── -->
        <div class="section-title">顧客儲值列表</div>

        <form
          method="get"
          action="/admin/wallets"
          style="display: flex; gap: 8px; margin-bottom: 1.25rem"
        >
          <input
            type="text"
            name="keyword"
            th:value="${keyword}"
            placeholder="搜尋顧客姓名或帳號..."
            style="
              flex: 1;
              padding: 8px 12px;
              border: 1px solid var(--cream-300);
              border-radius: var(--radius-sm);
            "
          />
          <button type="submit" class="btn">搜尋</button>
          <a href="/admin/wallets" class="btn btn-outline">重置</a>
        </form>

        <table>
          <thead>
            <tr>
              <th>顧客姓名</th>
              <th>帳號</th>
              <th>登入方式</th>
              <th>儲值金餘額</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(customers)}">
              <td colspan="5" class="empty">尚無顧客資料</td>
            </tr>
            <tr th:each="c : ${customers}">
              <td th:text="${c.name}">姓名</td>
              <td th:text="${c.username}">帳號</td>
              <td>
                <span th:if="${c.lineUserId != null}" class="badge" style="background: #06c755; color: #fff;">LINE</span>
                <span th:if="${c.lineUserId == null}" class="badge" style="background: var(--brown-light); color: #fff;">帳密</span>
              </td>
              <td>
                <span
                  th:text="'$' + ${#numbers.formatInteger(walletsByUsername.get(c.username).balance, 0, 'COMMA')}"
                  >$0</span
                >
                <span
                  th:if="${walletsByUsername.get(c.username).balance < 2000}"
                  class="badge"
                  style="margin-left: 6px; background: #fdecec; color: #c62828;"
                >
                  餘額偏低
                </span>
              </td>
              <td>
                <a
                  th:href="@{/admin/wallets/{u}(u=${c.username})}"
                  class="btn"
                  style="padding: 4px 12px; font-size: 13px"
                >
                  查看錢包
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      function rejectPrompt(id) {
        const reason = prompt('請輸入駁回原因（選填）：');
        if (reason === null) return;
        const form = document.getElementById('reject-form-' + id);
        form.querySelector('input[name=reason]').value = reason;
        form.submit();
      }
    </script>
  </body>
</html>
