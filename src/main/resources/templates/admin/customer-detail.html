<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('會員信息 | 慕沐村 Mulage pet')}"
  ></head>
  <body>
    <style>
      .cd-layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .cd-layout {
          grid-template-columns: 1fr;
        }
      }
      .cd-avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--cream-500);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .cd-info-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        font-size: 13px;
        padding: 7px 0;
        border-top: 0.5px solid var(--cream-200);
        color: var(--brown-mid);
      }
      .cd-info-row:first-of-type {
        border-top: none;
      }
      .cd-info-row span:first-child {
        color: var(--brown-light);
        flex-shrink: 0;
      }
      .cd-info-row span:last-child {
        text-align: right;
        word-break: break-all;
        overflow-wrap: anywhere;
        min-width: 0;
      }
      .cd-tab-btn {
        padding: 8px 18px;
        font-size: 13.5px;
        border-radius: var(--radius-sm) var(--radius-sm) 0 0;
        border: 1px solid var(--cream-400);
        border-bottom: none;
        background: var(--cream-400);
        color: var(--brown-dark);
        cursor: pointer;
      }
      .cd-tab-btn.active {
        background: var(--cream-500);
        border-color: var(--cream-500);
        color: #fff;
        font-weight: 600;
      }
      .cd-tab-panel {
        display: none;
      }
      .cd-tab-panel.active {
        display: block;
      }
      .cd-stat {
        background: var(--cream-100);
        border: 0.5px solid var(--cream-300);
        border-radius: var(--radius-md);
        padding: 12px 16px;
        text-align: center;
      }
      .cd-stat .label {
        font-size: 11.5px;
        color: var(--brown-light);
        margin-bottom: 4px;
      }
      .cd-stat .value {
        font-size: 20px;
        font-weight: 600;
        color: var(--brown-dark);
      }

      /* 消費紀錄列可點擊查看明細 */
      #tab-consume tbody tr.is-clickable {
        cursor: pointer;
      }
      #tab-consume tbody tr.is-clickable:hover td {
        background: var(--cream-100);
      }

      /* 消費明細彈窗 */
      .cd-detail-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(32, 30, 29, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
      }
      .cd-detail-backdrop.show {
        display: flex;
      }
      .cd-detail-sheet {
        background: #fff;
        width: 100%;
        max-width: 520px;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: var(--radius-lg, 12px);
        padding: 22px 24px;
      }
      .cd-detail-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--cream-300);
      }
      .cd-detail-header h3 {
        font-size: 16px;
        color: var(--brown-dark);
        margin: 0;
      }
      .cd-detail-close {
        background: none;
        border: none;
        font-size: 20px;
        color: var(--brown-light);
        cursor: pointer;
        padding: 2px 6px;
      }
      .cd-detail-loading,
      .cd-detail-error {
        text-align: center;
        padding: 30px 0;
        font-size: 13.5px;
        color: var(--brown-light);
      }
      .cd-detail-error {
        color: #c62828;
      }
      .cd-detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--cream-200);
        font-size: 13.5px;
        color: var(--brown-dark);
      }
      .cd-detail-row:last-child {
        border-bottom: none;
      }
      .cd-detail-row .name {
        flex: 1;
      }
      .cd-detail-row .operator {
        font-size: 11px;
        color: var(--brown-light);
        margin-left: 6px;
      }
      .cd-detail-row .price {
        font-weight: 700;
        margin-left: 10px;
        white-space: nowrap;
      }
      .cd-detail-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 10px;
        margin-top: 6px;
        border-top: 2px solid var(--brown-dark);
        font-size: 15px;
        font-weight: 700;
        color: var(--brown-dark);
      }
      .cd-detail-section {
        margin-bottom: 14px;
      }
      .cd-detail-section .label {
        font-size: 11.5px;
        color: var(--brown-light);
        margin-bottom: 6px;
        font-weight: 600;
      }
      .cd-detail-payment {
        margin-top: 12px;
        padding: 10px 12px;
        background: var(--cream-100);
        border-radius: var(--radius-sm);
        font-size: 12.5px;
        color: var(--brown-mid);
        line-height: 1.8;
      }
    </style>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>

      <div class="content" style="max-width: 1200px">
        <a
          href="/admin/customers"
          class="btn"
          style="
            margin-bottom: 1.25rem;
            text-decoration: none;
            display: inline-block;
            background: var(--cream-500);
            color: #fff;
            border-color: var(--cream-500);
          "
          >← 返回會員清單</a
        >

        <div
          class="alert alert-success"
          th:if="${successMsg}"
          th:text="${successMsg}"
        ></div>
        <div
          class="alert alert-error"
          th:if="${errorMsg}"
          th:text="${errorMsg}"
        ></div>

        <div class="cd-layout">
          <!-- ══════════ 左側：會員資料卡 ══════════ -->
          <div class="card" style="padding: 1.4rem">
            <div
              class="cd-avatar"
              th:text="${#strings.substring(customer.name, 0, 1)}"
            >
              名
            </div>
            <h3
              style="margin: 0 0 4px; font-size: 18px"
              th:text="${customer.name}"
            >
              會員姓名
            </h3>
            <div style="margin-bottom: 10px">
              <span
                th:if="${customer.lineUserId != null}"
                class="badge"
                style="background: #06c755; color: #fff"
                >LINE 已綁定</span
              >
              <span
                th:if="${customer.lineUserId == null}"
                class="badge"
                style="background: var(--brown-light); color: #fff"
                >帳號密碼登入</span
              >
              <span
                th:if="${wallet != null}"
                class="badge"
                style="background: var(--cream-500); color: #fff"
                th:text="${wallet.cardTierLabel}"
                >等級</span
              >
            </div>

            <!-- 需求（追加，2026-09-08）：手動綁定既有匯入資料。只有匯入建立的
                 暫時帳號（username 以 imported_ 開頭）才會顯示，用在顧客的 LINE
                 帳號自己已經先填過資料、導致無法自動認領這筆匯入資料的情況 -->
            <div
              th:if="${#strings.startsWith(customer.username, 'imported_')}"
              th:attr="data-imported-username=${customer.username}"
              id="mergeSourceBox"
              </p>
              <div style="position: relative">
                <input
                  type="text"
                  id="mergeTargetSearch"
                  placeholder="輸入顧客姓名搜尋 LINE 會員帳號..."
                  autocomplete="off"
                  style="
                    width: 100%;
                    padding: 8px 10px;
                    border: 1px solid var(--cream-300);
                    border-radius: var(--radius-sm);
                    font-size: 13px;
                    box-sizing: border-box;
                  "
                />
                <div
                  id="mergeTargetSuggestions"
                  style="
                    display: none;
                    position: absolute;
                    top: 100%;
                    left: 0;
                    right: 0;
                    background: #fff;
                    border: 1px solid var(--cream-300);
                    border-radius: var(--radius-sm);
                    max-height: 220px;
                    overflow-y: auto;
                    z-index: 10;
                  "
                ></div>
              </div>
              <div
                id="mergeTargetSelected"
                style="font-size: 12px; color: #2e7d32; margin-top: 6px"
              ></div>
              <button
                type="button"
                id="mergeConfirmBtn"
                class="btn"
                disabled
                style="
                  margin-top: 10px;
                  background: #e65100;
                  color: #fff;
                  opacity: 0.5;
                  cursor: not-allowed;
                "
              >
                合併到這個帳號
              </button>
            </div>

            <div class="cd-info-row">
              <span>手機號碼</span
              ><span th:text="${customer.phone} ?: '尚未填寫'"></span>
            </div>
            <div class="cd-info-row" th:if="${customer.email != null}">
              <span>Email</span><span th:text="${customer.email}"></span>
            </div>
            <div class="cd-info-row" th:if="${customer.age != null}">
              <span>年齡</span><span th:text="${customer.age} + ' 歲'"></span>
            </div>
            <div class="cd-info-row" th:if="${customer.occupation != null}">
              <span>職業</span><span th:text="${customer.occupation}"></span>
            </div>
            <div class="cd-info-row" th:if="${customer.residenceArea != null}">
              <span>居住區域</span
              ><span th:text="${customer.residenceArea}"></span>
            </div>
            <div class="cd-info-row" th:if="${customer.source != null}">
              <span>得知來源</span
              ><span th:text="${customer.source.label}"></span>
            </div>
            <div class="cd-info-row">
              <span>加入日期</span
              ><span
                th:text="${#temporals.format(customer.createdAt, 'yyyy/MM/dd')}"
              ></span>
            </div>
            <div class="cd-info-row" th:if="${wallet != null}">
              <span>錢包餘額</span
              ><span
                th:text="'$' + ${#numbers.formatInteger(wallet.balance, 0, 'COMMA')}"
              ></span>
            </div>

            <div
              style="
                margin-top: 16px;
                padding-top: 12px;
                border-top: 1px solid var(--cream-300);
              "
            >
              <h4
                style="
                  font-size: 13px;
                  color: var(--brown-dark);
                  margin-bottom: 8px;
                "
              >
                🐾 會員備註（店家專用）
              </h4>
              <form
                th:action="@{/admin/wallets/{u}/note(u=${customer.username})}"
                method="post"
              >
                <input
                  type="hidden"
                  name="returnTo"
                  th:value="@{/admin/customers/{u}(u=${customer.username})}"
                />
                <textarea
                  name="adminNote"
                  rows="4"
                  placeholder="例如：都會自己攜帶寵物使用的用品，寵物梳下來的毛都要幫她留著"
                  style="
                    width: 100%;
                    font-size: 12.5px;
                    padding: 8px;
                    border: 1px solid var(--cream-300);
                    border-radius: var(--radius-sm);
                    box-sizing: border-box;
                    resize: vertical;
                  "
                  th:text="${customer.adminNote}"
                ></textarea>
                <button
                  type="submit"
                  class="btn"
                  style="margin-top: 8px; padding: 5px 14px; font-size: 12.5px"
                >
                  儲存備註
                </button>
              </form>
            </div>
          </div>

          <!-- ══════════ 右側：分頁內容 ══════════ -->
          <div>
            <div style="display: flex; gap: 2px">
              <button
                type="button"
                class="cd-tab-btn active"
                data-tab="tab-consume"
                onclick="switchTab(this)"
              >
                💰 消費記錄
              </button>
              <button
                type="button"
                class="cd-tab-btn"
                data-tab="tab-pets"
                onclick="switchTab(this)"
              >
                🐾 寵物資料
              </button>
              <button
                type="button"
                class="cd-tab-btn"
                data-tab="tab-appt"
                onclick="switchTab(this)"
              >
                📅 預約紀錄
              </button>
            </div>

            <div
              style="
                background: #fff;
                border: 1px solid var(--cream-300);
                border-radius: 0 var(--radius-md) var(--radius-md)
                  var(--radius-md);
                padding: 1.2rem 1.4rem;
              "
            >
              <!-- 消費記錄 -->
              <div id="tab-consume" class="cd-tab-panel active">
                <div
                  style="
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 10px;
                    margin-bottom: 1.2rem;
                  "
                >
                  <div class="cd-stat">
                    <div class="label">累積消費</div>
                    <div
                      class="value"
                      th:text="'$' + ${#numbers.formatInteger(totalSpent, 0, 'COMMA')}"
                    >
                      $0
                    </div>
                  </div>
                  <div class="cd-stat">
                    <div class="label">累積訂單數</div>
                    <div class="value" th:text="${orderCount}">0</div>
                  </div>
                  <div class="cd-stat">
                    <div class="label">近期消費時間</div>
                    <div
                      class="value"
                      style="font-size: 14px"
                      th:text="${lastPaymentTime != null ? #temporals.format(lastPaymentTime, 'yyyy/MM/dd HH:mm') : '—'}"
                    >
                      —
                    </div>
                  </div>
                </div>

                <table>
                  <thead>
                    <tr>
                      <th>來源</th>
                      <th>編號</th>
                      <th>寵物</th>
                      <th>消費時間</th>
                      <th>經手人</th>
                      <th>付款方式</th>
                      <th>金額</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                      <td colspan="7" class="empty">尚無消費紀錄</td>
                    </tr>
                    <tr
                      th:each="t : ${transactions}"
                      th:classappend="${t.recordId != null} ? 'is-clickable' : ''"
                      th:attr="data-source-type=${t.sourceType},data-record-id=${t.recordId}"
                    >
                      <td>
                        <span
                          class="badge"
                          th:style="${t.sourceLabel == '現場開單'} ? 'background:var(--cream-400); color:#4a3620;' : 'background:var(--cream-200); color:var(--brown-mid);'"
                          th:text="${t.sourceLabel}"
                        ></span>
                      </td>
                      <td th:text="${t.code}"></td>
                      <td th:text="${t.petName} ?: '—'"></td>
                      <td
                        th:text="${t.time != null ? #temporals.format(t.time, 'yyyy/MM/dd HH:mm') : '—'}"
                      ></td>
                      <td th:text="${t.handledBy} ?: '—'"></td>
                      <td th:text="${t.paymentMethodLabel}"></td>
                      <td
                        th:text="'$' + ${#numbers.formatInteger(t.amount, 0, 'COMMA')}"
                      ></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- 寵物資料 -->
              <div id="tab-pets" class="cd-tab-panel">
                <div
                  th:if="${#lists.isEmpty(pets)}"
                  class="empty"
                  style="text-align: center; padding: 2rem 0"
                >
                  此會員尚未新增寵物
                </div>
                <div
                  th:each="p : ${pets}"
                  style="
                    border: 0.5px solid var(--cream-300);
                    border-radius: var(--radius-md);
                    padding: 14px 16px;
                    margin-bottom: 12px;
                  "
                >
                  <div
                    style="
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      flex-wrap: wrap;
                      gap: 8px;
                    "
                  >
                    <div style="display: flex; align-items: center; gap: 10px">
                      <!-- 需求 17：寵物大頭照，沒有照片就顯示預設圖示 -->
                      <img
                        th:if="${p.photoUrl != null}"
                        th:src="${p.photoUrl}"
                        style="
                          width: 44px;
                          height: 44px;
                          border-radius: 50%;
                          object-fit: cover;
                          border: 1px solid var(--cream-300);
                        "
                      />
                      <div
                        th:unless="${p.photoUrl != null}"
                        style="
                          width: 44px;
                          height: 44px;
                          border-radius: 50%;
                          background: var(--cream-100);
                          display: flex;
                          align-items: center;
                          justify-content: center;
                          font-size: 20px;
                          border: 1px solid var(--cream-300);
                        "
                      >
                        🐾
                      </div>
                      <div>
                        <span
                          style="
                            font-weight: 600;
                            color: var(--brown-dark);
                            font-size: 14.5px;
                          "
                          th:text="${p.name}"
                        ></span>
                        <span
                          style="
                            font-size: 12px;
                            color: var(--brown-light);
                            margin-left: 6px;
                          "
                          th:text="${p.petTypeLabel} + '・' + ${p.breed} + '・' + ${p.weight} + 'kg・' + ${p.age} + '歲'
                                   + (${p.gender} != null ? '・' + ${p.gender} : '')
                                   + (${p.isNeutered} != null and ${p.isNeutered} ? '・已絕育' : (${p.isNeutered} != null ? '・未絕育' : ''))"
                        ></span>
                        <a
                          th:href="@{/admin/pets/{id}/edit(id=${p.id})}"
                          style="
                            font-size: 11.5px;
                            color: #8a6f3f;
                            text-decoration: underline;
                            margin-left: 8px;
                          "
                          >完整編輯</a
                        >
                        <!-- 需求（追加，2026-08-26）：店家後台刪除寵物。有預約/消費紀錄
                             會被後端擋下並顯示明確錯誤訊息。HTML 表單不支援 DELETE method，
                             改用 JS fetch 呼叫。 -->
                        <button
                          type="button"
                          th:onclick="'deletePetAdmin(' + ${p.id} + ')'"
                          style="
                            font-size: 11.5px;
                            color: #c0392b;
                            background: none;
                            border: none;
                            text-decoration: underline;
                            cursor: pointer;
                            margin-left: 8px;
                            padding: 0;
                          "
                        >
                          刪除
                        </button>
                        <form
                          th:action="@{/admin/wallets/{u}/pets/{id}/photo(u=${customer.username},id=${p.id})}"
                          method="post"
                          enctype="multipart/form-data"
                          style="margin-top: 4px"
                        >
                          <input
                            type="hidden"
                            name="returnTo"
                            th:value="@{/admin/customers/{u}(u=${customer.username})} + '#tab-pets'"
                          />
                          <input
                            type="file"
                            name="file"
                            accept="image/*"
                            style="font-size: 11px; max-width: 180px"
                            required
                          />
                          <button
                            type="submit"
                            class="btn btn-outline"
                            style="padding: 2px 8px; font-size: 11px"
                          >
                            上傳照片
                          </button>
                        </form>
                      </div>
                    </div>
                    <!-- 需求（追加）：貓咪改成編輯毛髮分類（單層毛/雙層毛/長毛/特殊貓種），
                         取代原本的「定義毛長」——貓咪的服務項目菜單依這個分類篩選，
                         比通用毛長更有實際用途。多半是新增寵物時依品種自動判斷好的，
                         這裡是給店家在自動判斷抓不到品種（SPECIAL）時手動修正用的。
                         狗狗沒有這個分類概念，維持原本的「定義毛長」表單不變。 -->
                    <form
                      th:if="${p.petType.name() == 'CAT'}"
                      th:action="@{/admin/wallets/{u}/pets/{id}/cat-coat-category(u=${customer.username},id=${p.id})}"
                      method="post"
                      style="display: flex; align-items: center; gap: 6px"
                    >
                      <input
                        type="hidden"
                        name="returnTo"
                        th:value="@{/admin/customers/{u}(u=${customer.username})} + '#tab-pets'"
                      />
                      <span
                        th:text="${p.catCoatCategoryLabel} ?: '尚未判斷'"
                        th:style="${p.catCoatCategory == null or p.catCoatCategory.name() == 'SPECIAL'} ? 'color:#e53935; font-size:11.5px;' : 'color:#43a047; font-size:11.5px;'"
                      ></span>
                      <select
                        name="catCoatCategory"
                        style="
                          padding: 4px 6px;
                          border: 1px solid var(--cream-300);
                          border-radius: var(--radius-sm);
                          font-size: 12.5px;
                        "
                      >
                        <option
                          th:each="c : ${catCoatCategories}"
                          th:value="${c}"
                          th:text="${c.label}"
                          th:selected="${c == p.catCoatCategory}"
                        ></option>
                      </select>
                      <button
                        type="submit"
                        class="btn"
                        style="padding: 4px 10px; font-size: 12px"
                      >
                        儲存
                      </button>
                    </form>
                    <form
                      th:unless="${p.petType.name() == 'CAT'}"
                      th:action="@{/admin/wallets/{u}/pets/{id}/coat-type(u=${customer.username},id=${p.id})}"
                      method="post"
                      style="display: flex; align-items: center; gap: 6px"
                    >
                      <input
                        type="hidden"
                        name="returnTo"
                        th:value="@{/admin/customers/{u}(u=${customer.username})} + '#tab-pets'"
                      />
                      <span
                        th:text="${p.coatTypeLabel}"
                        th:style="${p.coatType.name() == 'UNDEFINED'} ? 'color:#e53935; font-size:11.5px;' : 'color:#43a047; font-size:11.5px;'"
                      ></span>
                      <select
                        name="coatType"
                        style="
                          padding: 4px 6px;
                          border: 1px solid var(--cream-300);
                          border-radius: var(--radius-sm);
                          font-size: 12.5px;
                        "
                      >
                        <option
                          th:each="c : ${coatTypes}"
                          th:value="${c}"
                          th:text="${c.label}"
                          th:selected="${c == p.coatType}"
                        ></option>
                      </select>
                      <button
                        type="submit"
                        class="btn"
                        style="padding: 4px 10px; font-size: 12px"
                      >
                        儲存
                      </button>
                    </form>
                  </div>

                  <!-- 需求（追加，2026-08-28）：後台會員信息目前看不到寵物的固定套餐鎖定狀態，
                       補上顯示（沿用結帳頁/現場開單結帳頁同一套 API 跟按鈕邏輯）。
                       只有狗狗有這個機制，貓咪沒有。 -->
                  <div
                    th:if="${p.petType.name() == 'DOG' and p.lockedGroomingItemId != null}"
                    style="
                      margin-top: 10px;
                      padding: 8px 10px;
                      background: #fff8e6;
                      border: 1px solid #e6c366;
                      border-radius: var(--radius-sm);
                      font-size: 12.5px;
                    "
                  >
                    🔒 已鎖定固定套餐：<strong
                      th:text="${p.lockedItemName}"
                    ></strong>
                    （$<span th:text="${p.lockedItemPrice}"></span
                    >），預約/現場開單時只會帶出這一項
                    <button
                      type="button"
                      th:onclick="'unlockPetAdmin(' + ${p.id} + ')'"
                      class="btn btn-outline"
                      style="
                        padding: 3px 10px;
                        font-size: 11.5px;
                        margin-left: 8px;
                      "
                    >
                      🔓 解鎖，重新報價
                    </button>
                  </div>

                  <!-- 需求（追加）：編輯寵物基本資料（名字/品種/體重/年齡），
                       物種不開放修改（見 PetService.updatePet 的說明）。
                       貓咪品種改成下拉選單（跟 LIFF「我的毛孩」編輯一致，選了
                       系統會自動重新判斷毛髮分類），狗狗維持文字輸入。 -->
                  <details style="margin-top: 8px">
                    <summary
                      style="
                        cursor: pointer;
                        font-size: 12.5px;
                        color: var(--cream-600);
                      "
                    >
                      ✏️ 編輯基本資料
                    </summary>
                    <form
                      th:action="@{/admin/wallets/{u}/pets/{id}/edit(u=${customer.username},id=${p.id})}"
                      method="post"
                      style="
                        display: grid;
                        grid-template-columns: repeat(4, 1fr);
                        gap: 8px;
                        margin-top: 8px;
                        align-items: end;
                      "
                    >
                      <input
                        type="hidden"
                        name="petType"
                        th:value="${p.petType}"
                      />
                      <input
                        type="hidden"
                        name="returnTo"
                        th:value="@{/admin/customers/{u}(u=${customer.username})} + '#tab-pets'"
                      />
                      <div>
                        <label
                          style="
                            display: block;
                            font-size: 11px;
                            color: var(--brown-light);
                          "
                          >名字</label
                        >
                        <input
                          type="text"
                          name="name"
                          th:value="${p.name}"
                          required
                          style="width: 100%; padding: 4px; font-size: 12.5px"
                        />
                      </div>
                      <div>
                        <label
                          style="
                            display: block;
                            font-size: 11px;
                            color: var(--brown-light);
                          "
                          >品種</label
                        >
                        <select
                          th:if="${p.petType.name() == 'CAT'}"
                          name="breed"
                          required
                          style="width: 100%; padding: 4px; font-size: 12.5px"
                        >
                          <option value="">請選擇</option>
                          <option
                            th:each="b : ${catBreeds}"
                            th:value="${b.breedName}"
                            th:text="${b.breedName} + '（' + ${b.coatCategory.label} + '）'"
                            th:selected="${b.breedName == p.breed}"
                          ></option>
                          <!-- 這隻貓現有品種不在對照表裡（例如舊資料、特殊貓種），
                               補一個選項讓它至少能被選到、不會被下拉選單清空覆蓋掉。 -->
                          <option
                            th:if="${!catBreeds.![breedName].contains(p.breed)}"
                            th:value="${p.breed}"
                            th:text="${p.breed} + '（目前值，不在對照表）'"
                            selected
                          ></option>
                        </select>
                        <input
                          th:unless="${p.petType.name() == 'CAT'}"
                          type="text"
                          name="breed"
                          th:value="${p.breed}"
                          required
                          style="width: 100%; padding: 4px; font-size: 12.5px"
                        />
                      </div>
                      <div>
                        <label
                          style="
                            display: block;
                            font-size: 11px;
                            color: var(--brown-light);
                          "
                          >體重(kg)</label
                        >
                        <input
                          type="number"
                          step="0.1"
                          name="weight"
                          th:value="${p.weight}"
                          required
                          style="width: 100%; padding: 4px; font-size: 12.5px"
                        />
                      </div>
                      <div>
                        <label
                          style="
                            display: block;
                            font-size: 11px;
                            color: var(--brown-light);
                          "
                          >年齡</label
                        >
                        <input
                          type="number"
                          name="age"
                          th:value="${p.age}"
                          required
                          style="width: 100%; padding: 4px; font-size: 12.5px"
                        />
                      </div>
                      <button
                        type="submit"
                        class="btn btn-outline"
                        style="
                          grid-column: span 4;
                          padding: 4px 10px;
                          font-size: 12px;
                        "
                      >
                        儲存基本資料
                      </button>
                    </form>
                  </details>
                  <details
                    style="margin-top: 8px"
                    th:if="${groomingNotesByPetId != null and !#lists.isEmpty(groomingNotesByPetId.get(p.id))}"
                  >
                    <summary
                      style="
                        cursor: pointer;
                        font-size: 12.5px;
                        color: var(--cream-600);
                      "
                    >
                      美容狀況歷史（<span
                        th:text="${groomingNotesByPetId.get(p.id).size()}"
                      ></span>
                      筆）
                    </summary>
                    <div
                      th:each="n : ${groomingNotesByPetId.get(p.id)}"
                      style="
                        font-size: 12px;
                        color: var(--brown-mid);
                        border-top: 0.5px solid var(--cream-200);
                        padding: 6px 0;
                      "
                    >
                      <div style="color: var(--brown-light)">
                        <span th:text="${n.serviceDate}"></span> ·
                        <span th:text="${n.staff.name}"></span>
                      </div>
                      <div th:text="${n.note}"></div>
                      <!-- 需求 18：美容狀況歷史相簿 -->
                      <img
                        th:if="${n.photoUrl != null}"
                        th:src="${n.photoUrl}"
                        style="
                          width: 100%;
                          max-width: 220px;
                          border-radius: 8px;
                          margin-top: 6px;
                          display: block;
                        "
                      />
                      <form
                        th:action="@{/admin/wallets/{u}/grooming-notes/{id}/photo(u=${customer.username},id=${n.id})}"
                        method="post"
                        enctype="multipart/form-data"
                        style="
                          margin-top: 6px;
                          display: flex;
                          align-items: center;
                          gap: 6px;
                        "
                      >
                        <input
                          type="hidden"
                          name="returnTo"
                          th:value="@{/admin/customers/{u}(u=${customer.username})} + '#tab-pets'"
                        />
                        <input
                          type="file"
                          name="file"
                          accept="image/*"
                          style="font-size: 11px; max-width: 160px"
                          required
                        />
                        <button
                          type="submit"
                          class="btn btn-outline"
                          style="padding: 2px 8px; font-size: 11px"
                        >
                          <span th:if="${n.photoUrl == null}">加照片</span>
                          <span th:if="${n.photoUrl != null}">換照片</span>
                        </button>
                      </form>
                    </div>
                  </details>
                  <p
                    th:if="${groomingNotesByPetId == null or #lists.isEmpty(groomingNotesByPetId.get(p.id))}"
                    style="
                      font-size: 12px;
                      color: var(--brown-light);
                      margin-top: 8px;
                    "
                  >
                    尚無美容狀況紀錄
                  </p>

                  <!-- 需求 8-3：消費項目明細整合顯示在美容歷史卡片旁——直接展開列出服務項目，
                       美容師不用點進去看，一眼就能判斷寵物過往做過什麼、下次該安排什麼 -->
                  <details
                    open
                    style="margin-top: 8px"
                    th:if="${consumptionByPetId != null and !#lists.isEmpty(consumptionByPetId.get(p.id))}"
                  >
                    <summary
                      style="
                        cursor: pointer;
                        font-size: 12.5px;
                        color: var(--cream-600);
                      "
                    >
                      消費項目明細（<span
                        th:text="${consumptionByPetId.get(p.id).size()}"
                      ></span>
                      筆）
                    </summary>
                    <div
                      th:each="c : ${consumptionByPetId.get(p.id)}"
                      style="
                        border-top: 0.5px solid var(--cream-200);
                        padding: 7px 0;
                      "
                    >
                      <div
                        style="
                          display: flex;
                          justify-content: space-between;
                          gap: 8px;
                          font-size: 11.5px;
                          color: var(--brown-light);
                        "
                      >
                        <span
                          th:text="${c.sourceLabel} + ' · ' + ${c.code}"
                        ></span>
                        <span
                          th:text="${c.time != null ? #temporals.format(c.time, 'yyyy-MM-dd HH:mm') : '—'} + ' · ' + ${c.handledBy} + ' · ' + ${c.paymentMethodLabel}"
                        ></span>
                      </div>
                      <div
                        th:each="it : ${c.items}"
                        style="
                          display: flex;
                          justify-content: space-between;
                          gap: 8px;
                          font-size: 12.5px;
                          color: var(--brown-mid);
                          padding: 4px 0 4px 10px;
                        "
                      >
                        <span>
                          <span th:text="${it.name}"></span>
                          <span
                            th:if="${it.staffName != null}"
                            style="color: var(--brown-light)"
                            th:text="'・' + ${it.staffName}"
                          ></span>
                          <span
                            th:if="${it.discountLabel != null}"
                            th:style="${it.discountLabel == '原價（不打折）'} ? 'color: var(--brown-light);' : 'color:#2e7d32;'"
                            th:text="'・' + ${it.discountLabel}"
                          ></span>
                        </span>
                        <span
                          style="font-weight: 600; white-space: nowrap"
                          th:text="'$' + ${it.price}"
                        ></span>
                      </div>
                      <p
                        th:if="${c.items == null or #lists.isEmpty(c.items)}"
                        style="
                          font-size: 12px;
                          color: var(--brown-light);
                          padding-left: 10px;
                          margin: 4px 0 0;
                        "
                      >
                        （無項目資料）
                      </p>
                    </div>
                  </details>
                </div>
              </div>

              <!-- 預約紀錄 -->
              <div id="tab-appt" class="cd-tab-panel">
                <table>
                  <thead>
                    <tr>
                      <th>預約編號</th>
                      <th>寵物</th>
                      <th>日期</th>
                      <th>時間</th>
                      <th>項目</th>
                      <th>金額</th>
                      <th>狀態</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr th:if="${#lists.isEmpty(appointments)}">
                      <td colspan="7" class="empty">尚無預約紀錄</td>
                    </tr>
                    <tr th:each="a : ${appointments}">
                      <td th:text="${a.appointmentCode}"></td>
                      <td th:text="${a.petName}"></td>
                      <td th:text="${a.date}"></td>
                      <td th:text="${a.startTime} + ' ~ ' + ${a.endTime}"></td>
                      <td>
                        <span th:each="item, iter : ${a.selectedItems}">
                          <span th:text="${item.name}"></span
                          ><span th:if="${!iter.last}">、</span>
                        </span>
                      </td>
                      <td
                        th:text="'$' + ${#numbers.formatInteger(a.totalAmount, 0, 'COMMA')}"
                      ></td>
                      <td th:text="${a.statusLabel}"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 消費明細彈窗 -->
    <div
      class="cd-detail-backdrop"
      id="cdDetailBackdrop"
      onclick="closeConsumeDetailOnBackdrop(event)"
    >
      <div class="cd-detail-sheet">
        <div class="cd-detail-header">
          <h3>消費明細</h3>
          <button
            class="cd-detail-close"
            onclick="closeConsumeDetail()"
            aria-label="關閉"
          >
            ✕
          </button>
        </div>
        <div id="cdDetailBody">
          <div class="cd-detail-loading">載入中...</div>
        </div>
      </div>
    </div>

    <script>
      function switchTab(btn) {
        document.querySelectorAll(".cd-tab-btn").forEach(function (b) {
          b.classList.remove("active");
        });
        document.querySelectorAll(".cd-tab-panel").forEach(function (p) {
          p.classList.remove("active");
        });
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      }

      // 需求（追加，2026-08-26）：店家後台刪除寵物。有預約/消費紀錄的話後端
      // 會擋下並回傳明確錯誤訊息，這裡直接顯示，不用自己重複判斷邏輯。
      async function deletePetAdmin(petId) {
        if (
          !confirm(
            "確定要刪除這隻寵物嗎？刪除後不會再顯示在清單裡，但過往的預約/消費紀錄不會受影響。",
          )
        )
          return;
        try {
          const res = await fetch("/api/admin/pets/" + petId, {
            method: "DELETE",
          });
          if (!res.ok) {
            const msg = await res.text().catch(() => "");
            let parsed = msg;
            try {
              parsed = JSON.parse(msg);
            } catch (e) {
              /* 純文字錯誤訊息，直接用 */
            }
            alert(
              typeof parsed === "string"
                ? parsed
                : parsed.message || "刪除失敗",
            );
            return;
          }
          window.location.reload();
        } catch (e) {
          alert("網路錯誤，請重試");
        }
      }

      // 需求（追加，2026-08-28）：後台會員信息頁「解鎖，重新報價」——沿用
      // walk-in-order-checkout.html / payments/checkout.html 同一支既有 API，
      // 不用新增後端端點。
      async function unlockPetAdmin(petId) {
        if (
          !confirm(
            "確定要解鎖嗎？解鎖後下次預約/開單會恢復成依體重重新選套餐。",
          )
        )
          return;
        try {
          const res = await fetch(
            "/api/admin/pets/" + petId + "/unlock-grooming-item",
            { method: "PUT" },
          );
          if (!res.ok) {
            alert("解鎖失敗，請重試");
            return;
          }
          window.location.reload();
        } catch (e) {
          alert("網路錯誤，請重試");
        }
      }

      // 若網址帶 #tab-xxx（例如儲存毛長設定後導回），自動切到對應分頁
      (function () {
        const hash = window.location.hash.replace("#", "");
        if (hash) {
          const btn = document.querySelector(
            '.cd-tab-btn[data-tab="' + hash + '"]',
          );
          if (btn) switchTab(btn);
        }
      })();

      // ── 消費明細彈窗 ─────────────────────────────────────────────────
      // 用事件代理讀取 data-source-type / data-record-id，避免在 Thymeleaf
      // 樣板裡用字串拼接組出 inline onclick（SpEL 對單引號跳脫處理跟 JS 不同，容易解析失敗）
      document.addEventListener("DOMContentLoaded", function () {
        var tbody = document.querySelector("#tab-consume tbody");
        if (!tbody) return;
        tbody.addEventListener("click", function (e) {
          var row = e.target.closest("tr.is-clickable");
          if (!row) return;
          var sourceType = row.getAttribute("data-source-type");
          var recordId = row.getAttribute("data-record-id");
          if (!sourceType || !recordId) return;
          openConsumeDetail(sourceType, recordId);
        });
      });

      function petIconOf(type) {
        if (type === "DOG") return "🐶";
        if (type === "CAT") return "🐱";
        return "🐾";
      }

      async function openConsumeDetail(sourceType, recordId) {
        const backdrop = document.getElementById("cdDetailBackdrop");
        const body = document.getElementById("cdDetailBody");
        body.innerHTML = '<div class="cd-detail-loading">載入中...</div>';
        backdrop.classList.add("show");

        const url =
          sourceType === "WALKIN"
            ? "/api/admin/walk-in-orders/" + recordId
            : "/api/appointments/" + recordId + "/detail";

        try {
          const res = await fetch(url, {
            headers: { "ngrok-skip-browser-warning": "true" },
          });
          const data = await res.json().catch(() => null);
          if (!res.ok) {
            body.innerHTML =
              '<div class="cd-detail-error">載入明細失敗：' +
              (typeof data === "string"
                ? data
                : (data && data.message) || res.status) +
              "</div>";
            return;
          }
          if (sourceType === "WALKIN") {
            renderWalkInDetail(data);
          } else {
            renderAppointmentDetail(data);
          }
        } catch (e) {
          body.innerHTML =
            '<div class="cd-detail-error">網路錯誤，請重試</div>';
        }
      }

      function renderAppointmentDetail(d) {
        const body = document.getElementById("cdDetailBody");
        const itemsHtml = (d.items || [])
          .map(
            (it) => `
          <div class="cd-detail-row">
            <span class="name">${it.name}${it.operatorName ? `<span class="operator">・${it.operatorName}</span>` : ""}${it.appliedDiscountType === "REWASH" ? '<span class="operator" style="color:#2e7d32;">・回洗優惠</span>' : it.appliedDiscountType === "MEMBER" ? '<span class="operator" style="color:#2e7d32;">・會員折扣</span>' : '<span class="operator">・原價（不打折）</span>'}</span>
            <span class="price">$${it.price}</span>
          </div>`,
          )
          .join("");

        const paymentHtml = d.paymentMethodLabel
          ? `
          <div class="cd-detail-payment">
            付款方式：${d.paymentMethodLabel}<br>
            ${d.paymentTime ? `付款時間：${d.paymentTime.replace("T", " ").substring(0, 16)}<br>` : ""}
            ${d.handledBy ? `經手人：${d.handledBy}` : ""}
          </div>`
          : "";

        body.innerHTML = `
          <div class="cd-detail-section">
            <div class="label">${d.appointmentCode}　${petIconOf(d.petType)}${d.petName}（預約結帳）</div>
            <div class="cd-detail-row">
              <span class="name">預約時間</span>
              <span class="price">${d.date} ${d.startTime.substring(0, 5)}-${d.endTime.substring(0, 5)}</span>
            </div>
            <div class="cd-detail-row">
              <span class="name">狀態</span>
              <span class="price">${d.cancelled ? "已取消" : d.statusLabel}</span>
            </div>
            ${d.memberNote ? `<div class="cd-detail-row"><span class="name">備註</span><span class="price">${d.memberNote}</span></div>` : ""}
          </div>

          <div class="cd-detail-section">
            <div class="label">服務項目</div>
            ${itemsHtml || '<div class="cd-detail-row"><span class="name">（無項目資料）</span></div>'}
            <div class="cd-detail-total">
              <span>合計</span>
              <span>$${d.totalAmount}</span>
            </div>
          </div>

          ${paymentHtml}
        `;
      }

      function renderWalkInDetail(d) {
        const body = document.getElementById("cdDetailBody");
        const itemsHtml = (d.items || [])
          .map(
            (it) => `
          <div class="cd-detail-row">
            <span class="name">${it.itemName}${it.operator ? `<span class="operator">・${it.operator}</span>` : ""}${it.appliedDiscountType === "REWASH" ? '<span class="operator" style="color:#2e7d32;">・回洗優惠</span>' : it.appliedDiscountType === "MEMBER" ? '<span class="operator" style="color:#2e7d32;">・會員折扣</span>' : '<span class="operator">・原價（不打折）</span>'}</span>
            <span class="price">$${it.price}</span>
          </div>`,
          )
          .join("");

        const paymentHtml = d.paymentMethodLabel
          ? `
          <div class="cd-detail-payment">
            付款方式：${d.paymentMethodLabel}<br>
            ${d.paymentTime ? `付款時間：${d.paymentTime.replace("T", " ").substring(0, 16)}<br>` : ""}
            經手人／開單人：${d.createdBy || "—"}
          </div>`
          : "";

        const hasDiscountAmount =
          d.chargedAmount != null && d.chargedAmount !== d.totalAmount;

        body.innerHTML = `
          <div class="cd-detail-section">
            <div class="label">現場單 #${d.id}　${d.petName || ""}（現場開單）</div>
            ${d.memberName ? `<div class="cd-detail-row"><span class="name">會員</span><span class="price">${d.memberName}</span></div>` : ""}
            ${d.note ? `<div class="cd-detail-row"><span class="name">備註</span><span class="price">${d.note}</span></div>` : ""}
          </div>

          <div class="cd-detail-section">
            <div class="label">服務項目</div>
            ${itemsHtml || '<div class="cd-detail-row"><span class="name">（無項目資料）</span></div>'}
            <div class="cd-detail-total">
              <span>帳面合計</span>
              <span>$${d.totalAmount}</span>
            </div>
            ${hasDiscountAmount ? `<div class="cd-detail-total" style="border-top:none; padding-top:2px; color:#2e7d32;"><span>實際扣款（已套用折扣）</span><span>$${d.chargedAmount}</span></div>` : ""}
          </div>

          ${paymentHtml}
        `;
      }

      function closeConsumeDetail() {
        document.getElementById("cdDetailBackdrop").classList.remove("show");
      }

      function closeConsumeDetailOnBackdrop(e) {
        if (e.target.id === "cdDetailBackdrop") closeConsumeDetail();
      }

      // 需求（追加，2026-09-08）：手動綁定既有匯入資料——搜尋目標會員帳號
      (function initManualMerge() {
        const searchBox = document.getElementById("mergeTargetSearch");
        if (!searchBox) return; // 不是匯入暫時帳號，這個區塊沒有渲染，不用初始化

        const suggestionsBox = document.getElementById(
          "mergeTargetSuggestions",
        );
        const selectedBox = document.getElementById("mergeTargetSelected");
        const confirmBtn = document.getElementById("mergeConfirmBtn");
        // 需求（修正，2026-09-10）：這個 <script> 標籤原本用 Thymeleaf 內嵌表達式
        // 語法去讀伺服器端變數，但 Thymeleaf 對 script 標籤預設就會自動嘗試處理
        // 這種內嵌語法（不需要另外宣告才會生效），寫法本身格式不對，會讓樣板
        // 渲染到這裡直接拋例外中斷，後面的內容整段送不出來（包括下面搜尋框的
        // 事件監聽器，導致「打字完全沒反應」）。⚠️ 教訓：連在註解裡用文字說明
        // 這個問題時，都不能把該內嵌語法的實際符號原封不動貼出來，一貼上去
        // 一樣會被誤判成真正的表達式去解析——只能用文字描述，這裡不示範實際
        // 符號本身。改成讀 HTML 屬性（data-imported-username）避開這整個問題，
        // 這個屬性是用 th:attr 在一般 HTML 渲染階段就設好的，不受這個限制影響。
        // 需求（防呆補強，2026-09-10）：改用可選鏈，就算這個元素當下抓不到
        // （例如瀏覽器快取到混合版本的頁面）也不會噴例外中斷整段 script——
        // 這裡如果直接中斷，會連下面搜尋框的事件監聽器都沒機會註冊上去，
        // 造成「打字完全沒反應」，跟現場開單會員搜尋失效是同一種模式的坑。
        const mergeSourceEl = document.getElementById("mergeSourceBox");
        const importedUsername = mergeSourceEl?.dataset?.importedUsername || "";
        let selectedTarget = null;
        let debounceTimer = null;

        function setSelected(target) {
          selectedTarget = target;
          if (target) {
            selectedBox.textContent =
              "✓ 已選定合併目標：" +
              target.name +
              "（" +
              target.username +
              "）";
            confirmBtn.disabled = false;
            confirmBtn.style.opacity = "1";
            confirmBtn.style.cursor = "pointer";
          } else {
            selectedBox.textContent = "";
            confirmBtn.disabled = true;
            confirmBtn.style.opacity = "0.5";
            confirmBtn.style.cursor = "not-allowed";
          }
        }

        searchBox.addEventListener("input", function () {
          setSelected(null);
          const keyword = searchBox.value.trim();
          clearTimeout(debounceTimer);
          if (!keyword) {
            suggestionsBox.style.display = "none";
            return;
          }
          debounceTimer = setTimeout(function () {
            fetch(
              "/api/admin/members/search?keyword=" +
                encodeURIComponent(keyword),
            )
              .then(function (res) {
                return res.json();
              })
              .then(function (results) {
                // 排除其他匯入暫時帳號，只能合併到真正在使用的會員帳號
                const filtered = (results || []).filter(function (u) {
                  return !u.username.startsWith("imported_");
                });
                if (filtered.length === 0) {
                  suggestionsBox.innerHTML =
                    '<div style="padding:8px 10px;font-size:13px;color:var(--brown-light);">找不到符合的會員</div>';
                  suggestionsBox.style.display = "block";
                  return;
                }
                suggestionsBox.innerHTML = filtered
                  .map(function (u) {
                    return (
                      '<div class="merge-suggestion" data-username="' +
                      u.username +
                      '" data-name="' +
                      u.name +
                      '" style="padding:8px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--cream-200);">' +
                      u.name +
                      '　<span style="color:var(--brown-light);">' +
                      u.username +
                      "</span></div>"
                    );
                  })
                  .join("");
                suggestionsBox.style.display = "block";
              })
              .catch(function () {
                suggestionsBox.style.display = "none";
              });
          }, 250);
        });

        suggestionsBox.addEventListener("click", function (e) {
          const row = e.target.closest(".merge-suggestion");
          if (!row) return;
          searchBox.value = row.dataset.name;
          suggestionsBox.style.display = "none";
          setSelected({
            username: row.dataset.username,
            name: row.dataset.name,
          });
        });

        document.addEventListener("click", function (e) {
          if (
            !e.target.closest("#mergeTargetSearch") &&
            !e.target.closest("#mergeTargetSuggestions")
          ) {
            suggestionsBox.style.display = "none";
          }
        });

        confirmBtn.addEventListener("click", function () {
          if (!selectedTarget) return;
          const ok = confirm(
            "確定要把「" +
              importedUsername +
              "」的寵物／消費／儲值資料合併到「" +
              selectedTarget.name +
              "（" +
              selectedTarget.username +
              "）」嗎？\n\n" +
              "此動作無法復原，合併後這個匯入暫時帳號會被刪除。",
          );
          if (!ok) return;
          confirmBtn.disabled = true;
          confirmBtn.textContent = "合併中...";
          fetch("/api/admin/members/merge", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              importedUsername: importedUsername,
              targetUsername: selectedTarget.username,
            }),
          })
            .then(function (res) {
              return res.text().then(function (text) {
                let body;
                try {
                  body = JSON.parse(text);
                } catch (e) {
                  body = { message: text };
                }
                if (!res.ok) throw new Error(body.message || "合併失敗");
                return body;
              });
            })
            .then(function (body) {
              alert(body.message || "合併完成");
              window.location.href =
                "/admin/customers/" +
                encodeURIComponent(selectedTarget.username);
            })
            .catch(function (err) {
              alert("合併失敗：" + err.message);
              confirmBtn.disabled = false;
              confirmBtn.textContent = "合併到這個帳號";
            });
        });
      })();
    </script>
  </body>
</html>
