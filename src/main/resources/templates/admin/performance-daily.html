<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head th:replace="~{fragments/header :: common-head('績效日報 | 慕沐村 Mulage pet')}"></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content">

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2 style="margin:0">📊 員工績效日報</h2>
          <a href="/admin/performance/monthly" class="btn">月報 / 結算 →</a>
        </div>

        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>
        <div class="alert alert-danger"  th:if="${errorMsg}"   th:text="${errorMsg}"></div>

        <!-- 日期選擇 -->
        <form method="get" action="/admin/performance"
              style="display:flex; gap:8px; margin-bottom:1.5rem; align-items:center;">
          <input type="date" name="date" th:value="${date}"
                 style="padding:8px; border:1px solid var(--cream-300); border-radius:var(--radius-sm);" />
          <button type="submit" class="btn">查詢</button>
          <a th:href="@{/admin/performance}" class="btn btn-outline">今天</a>
        </form>

        <!-- 當日績效紀錄（自動從結帳產生） -->
        <div style="background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:1.5rem;">
          <h3 style="font-size:15px; margin-bottom:4px;">
            📅 <span th:text="${date}">日期</span> 績效紀錄
          </h3>
          <p style="font-size:13px; color:#999; margin-bottom:12px;">
            結帳完成後自動從服務項目計算，無需手動輸入。
          </p>
          <table>
            <thead>
              <tr>
                <th>員工</th>
                <th>預約 #</th>
                <th>大項</th>
                <th>積分</th>
                <th>備註</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(records)}">
                <td colspan="5" style="text-align:center; color:#aaa;">當日尚無績效紀錄（請先完成結帳）</td>
              </tr>
              <tr th:each="r : ${records}">
                <td th:text="${r.staff.name}">員工</td>
                <td th:text="'#' + ${r.appointmentId}">編號</td>
                <td th:text="${r.category.label}">大項</td>
                <td style="font-weight:700; color:#c9a84c;" th:text="${r.points}">分</td>
                <td th:text="${r.note}">備註</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 拆分積分（兩人共同完成同一項目時使用） -->
        <div style="background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <h3 style="font-size:15px; margin-bottom:4px;">✂️ 拆分積分（對半平分）</h3>
          <p style="font-size:13px; color:#999; margin-bottom:16px;">
            僅在兩位員工共同完成同一項目（例如各洗一半）時使用。選擇下方「原始紀錄」後，
            系統會將該筆紀錄的積分<strong>對半平分</strong>給另一位員工，<strong>積分總和不會改變</strong>。
            為避免長期累積誤差，僅支援對半拆分，不開放自訂拆分比例。
          </p>
          <form method="post" action="/admin/performance/split"
                style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:16px; align-items:start;">

            <input type="hidden" name="date" th:value="${date}" />

            <div style="grid-column:1 / -1;">
              <label style="font-size:13px; color:#666; display:block; margin-bottom:4px;">原始績效紀錄（要對半拆分的紀錄）</label>
              <select name="sourceRecordId" required id="sourceRecordSelect"
                      style="width:100%; padding:8px; border:1px solid var(--cream-300); border-radius:var(--radius-sm); box-sizing:border-box;">
                <option value="">請選擇原始紀錄</option>
                <option th:each="r : ${splittableRecords}" th:value="${r.id}"
                        th:text="'#' + ${r.id} + ' 預約#' + ${r.appointmentId} + '　' + ${r.staff.name} + '　' + ${r.category.label} + '　目前 ' + ${r.points} + ' 分（對半後各得 ' + ${r.points / 2} + ' 分）'">
                  紀錄
                </option>
              </select>
              <p th:if="${#lists.isEmpty(splittableRecords)}"
                 style="font-size:12px; color:#e53935; margin:4px 0 0; line-height:1.4;">當日尚無可拆分的績效紀錄（請先完成結帳）</p>
            </div>

            <div>
              <label style="font-size:13px; color:#666; display:block; margin-bottom:4px;">拆分給（另一位員工）</label>
              <select name="toStaffId" required
                      style="width:100%; padding:8px; border:1px solid var(--cream-300); border-radius:var(--radius-sm); box-sizing:border-box;">
                <option value="">請選擇員工</option>
                <option th:each="s : ${staffList}" th:value="${s.id}" th:text="${s.name}">員工</option>
              </select>
            </div>

            <div style="grid-column:1 / -1;">
              <label style="font-size:13px; color:#666; display:block; margin-bottom:4px;">備註（選填）</label>
              <input type="text" name="note" placeholder="例如：與小王各洗一半"
                     style="width:100%; padding:8px; border:1px solid var(--cream-300); border-radius:var(--radius-sm); box-sizing:border-box;" />
            </div>

            <div style="grid-column:1 / -1;">
              <button type="submit" class="btn"
                      style="border-color:#c9a84c; color:#c9a84c;">
                對半拆分積分
              </button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </body>
</html>
