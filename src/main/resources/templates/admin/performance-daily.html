<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head th:replace="~{fragments/header :: common-head('績效日報 | 慕沐村 Mulage pet')}"></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content">

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2 style="margin:0">📊 員工績效日報</h2>
          <a href="/admin/performance/monthly" class="btn">月報 / 結算 →</a>
        </div>

        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>
        <div class="alert alert-danger"  th:if="${errorMsg}"   th:text="${errorMsg}"></div>

        <!-- 日期選擇 -->
        <form method="get" action="/admin/performance"
              style="display:flex; gap:8px; margin-bottom:1.5rem; align-items:center;">
          <input type="date" name="date" th:value="${date}"
                 style="padding:8px; border:1px solid var(--cream-300); border-radius:var(--radius-sm);" />
          <button type="submit" class="btn">查詢</button>
          <a th:href="@{/admin/performance}" class="btn btn-outline">今天</a>
        </form>

        <!-- 當日績效紀錄（自動從結帳產生） -->
        <div style="background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:1.5rem;">
          <h3 style="font-size:15px; margin-bottom:4px;">
            📅 <span th:text="${date}">日期</span> 績效紀錄
          </h3>
          <p style="font-size:13px; color:#999; margin-bottom:12px;">
            結帳完成後自動從服務項目計算，無需手動輸入。
          </p>
          <table>
            <thead>
              <tr>
                <th>員工</th>
                <th>預約 #</th>
                <th>大項</th>
                <th>積分</th>
                <th>備註</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(records)}">
                <td colspan="5" style="text-align:center; color:#aaa;">當日尚無績效紀錄（請先完成結帳）</td>
              </tr>
              <tr th:each="r : ${records}">
                <td th:text="${r.staff.name}">員工</td>
                <td th:text="'#' + ${r.appointmentId}">編號</td>
                <td th:text="${r.category.label}">大項</td>
                <td style="font-weight:700; color:#c9a84c;" th:text="${r.points}">分</td>
                <td th:text="${r.note}">備註</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 拆分積分（兩人共同完成同一項目時使用） -->
        <div style="background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06); margin-bottom:1.5rem;">
          <h3 style="font-size:15px; margin:0 0 4px;">✂️ 拆分積分（對半平分）</h3>
          <p style="font-size:13px; color:#999; margin-bottom:16px;">
            僅在兩位員工共同完成同一項目（例如各洗一半）時使用。系統將該筆紀錄的積分<strong>對半平分</strong>給另一位員工，
            <strong>積分總和不會改變</strong>，四捨五入到小數點第一位，不開放自訂拆分比例。
          </p>
          <table>
            <thead>
              <tr>
                <th>寵物名</th>
                <th>服務項目</th>
                <th>目前經手人</th>
                <th>原始積分</th>
                <th>對半後各得</th>
                <th>拆分給</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(candidates)}">
                <td colspan="6" class="empty">當日尚無可拆分的績效紀錄（請先完成結帳）</td>
              </tr>
              <tr th:each="c : ${candidates}">
                <td th:text="${c.petName}"></td>
                <td th:text="${c.itemLabel}"></td>
                <td th:text="${c.staffName}"></td>
                <td th:text="${c.points}"></td>
                <td style="font-weight: 700; color: #c9a84c" th:text="${c.halfPoints} + ' × 2'"></td>
                <td>
                  <form method="post" action="/admin/performance/split" style="display: flex; gap: 6px; align-items: center;">
                    <input type="hidden" name="sourceRecordId" th:value="${c.id}" />
                    <input type="hidden" name="date" th:value="${date}" />
                    <input type="hidden" name="returnTo" th:value="@{/admin/performance(date=${date})}" />
                    <select name="toStaffId" required style="font-size: 12px; padding: 4px 6px;">
                      <option value="" disabled selected>選擇對象</option>
                      <option th:each="s : ${staffList}" th:if="${s.id != c.staffId}"
                              th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                    <button type="submit" class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;"
                            onclick="return confirm('確定要對半拆分這筆積分嗎？');">拆分</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 當日拆分歷史 -->
        <div style="background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
          <h3 style="font-size:15px; margin-bottom:12px;">🕘 當日拆分歷史</h3>
          <table>
            <thead>
              <tr>
                <th>寵物名</th>
                <th>服務項目</th>
                <th>原本歸屬</th>
                <th>拆分後給誰</th>
                <th>各自積分</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(splitHistory)}">
                <td colspan="5" class="empty">當日尚無拆分紀錄</td>
              </tr>
              <tr th:each="h : ${splitHistory}">
                <td th:text="${h.petName}"></td>
                <td th:text="${h.itemLabel}"></td>
                <td th:text="${h.fromStaffName}"></td>
                <td th:text="${h.toStaffName}"></td>
                <td style="font-weight: 700" th:text="${h.halfPoints}"></td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </body>
</html>
