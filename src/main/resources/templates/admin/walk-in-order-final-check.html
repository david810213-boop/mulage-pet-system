<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('現場單核對 | 慕沐村 Mulage pet')}"
  ></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content" style="max-width: 640px">
        <div
          class="alert alert-error"
          th:if="${errorMsg}"
          th:text="${errorMsg}"
        ></div>

        <div th:if="${order == null}" class="card" style="text-align: center; padding: 3rem 2rem">
          <p style="color: var(--brown-light)">找不到這張現場單。</p>
          <a href="/admin/walk-in-orders" class="btn" style="margin-top: 1rem; display: inline-block">返回列表</a>
        </div>

        <div th:if="${order != null}">
          <h2 style="margin-bottom: 4px">現場單核對</h2>
          <p style="font-size: 13px; color: var(--brown-light); margin-bottom: 1.25rem">
            請與家長當面核對本次美容狀況，填寫備注並請家長簽名確認後才能結帳
          </p>

          <div class="card" style="margin-bottom: 1.25rem">
            <table style="box-shadow: none; border: none">
              <tr>
                <td style="color: var(--brown-light); width: 100px; white-space: nowrap; border: none">單號</td>
                <td style="border: none" th:text="'現場單 #' + ${order.id}"></td>
              </tr>
              <tr>
                <td style="color: var(--brown-light); white-space: nowrap; border: none">會員 / 寵物</td>
                <td style="border: none" th:text="(${order.memberName} ?: '（非會員）') + ' / ' + ${order.petName}"></td>
              </tr>
              <tr>
                <td style="color: var(--brown-light); white-space: nowrap; border: none; vertical-align: top">服務項目</td>
                <td style="border: none">
                  <div th:each="line : ${order.items}" style="font-size: 13px; padding: 2px 0">
                    <span th:text="${line.itemName}"></span>
                    <span style="color: var(--brown-light); margin-left: 6px" th:text="'$' + ${line.price}"></span>
                  </div>
                </td>
              </tr>
            </table>
          </div>

          <!-- 需求（追加）：編輯訂單——核對過程中就能補漏開/開錯的項目，不用等核對完到結帳頁才能改 -->
          <div class="card" style="margin-bottom: 1.25rem">
            <h3 style="font-size: 15px; color: var(--brown-dark); margin-bottom: 12px">✏️ 編輯本次服務項目</h3>
            <div th:each="it : ${order.items}" style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:13px;">
              <span th:text="${it.itemName} + '　$' + ${it.price}"></span>
              <form method="post" th:action="@{/admin/walk-in-orders/{id}/remove-item(id=${order.id})}">
                <input type="hidden" name="itemId" th:value="${it.itemId}" />
                <input type="hidden" name="from" value="final-check" />
                <button type="submit" class="btn btn-outline" style="padding:2px 8px; font-size:11px; color:#c62828; border-color:#c67a5c;">移除</button>
              </form>
            </div>
            <div style="display:flex; gap:8px; align-items:end; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid var(--cream-200);">
              <!-- 需求（追加，2026-08-26）：自訂價格改從結帳頁搬到核對頁——核對才是
                   店員實際判斷這次要收多少錢的時機點。 -->
              <form th:if="${groomingItems != null and !groomingItems.isEmpty()}" method="post"
                    th:action="@{/admin/walk-in-orders/{id}/add-grooming-item(id=${order.id})}"
                    style="display:flex; gap:8px; align-items:end; flex:1; min-width:280px; flex-wrap:wrap;">
                <input type="hidden" name="from" value="final-check" />
                <div class="field" style="margin:0; flex:1; min-width:160px;">
                  <label style="font-size:12px;">新增服務項目</label>
                  <select name="groomingItemId" required>
                    <option th:each="g : ${groomingItems}" th:value="${g.id}"
                            th:text="${g.name} + '（$' + ${#numbers.formatDecimal(g.price, 0, 0)} + '）'"></option>
                  </select>
                </div>
                <div class="field" style="margin:0; width:110px;">
                  <label style="font-size:12px;">自訂價格</label>
                  <input type="number" name="customPrice" min="0" placeholder="留空＝原價" />
                </div>
                <button type="submit" class="btn btn-outline" style="padding:6px 14px; font-size:12px;">加入</button>
              </form>
            </div>
            <p style="font-size: 11px; color: var(--brown-light); margin: 6px 0 0;">
              💡 有填自訂價格時，這筆收費金額照你填的數字，但積分仍照這個項目原本設定的值計算，不受改價影響。
            </p>

            <!-- 需求（追加，2026-08-26）：自訂金額加購——處理「高階定制調理」開放式
                 報價跟各種浮動加價，不綁定任何現有服務項目，直接輸入名稱+金額。 -->
            <div style="display:flex; gap:8px; align-items:end; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid var(--cream-200);">
              <form method="post"
                    th:action="@{/admin/walk-in-orders/{id}/add-custom-item(id=${order.id})}"
                    style="display:flex; gap:8px; align-items:end; flex:1; min-width:280px; flex-wrap:wrap;">
                <input type="hidden" name="from" value="final-check" />
                <div class="field" style="margin:0; flex:1; min-width:140px;">
                  <label style="font-size:12px;">💬 自訂項目名稱</label>
                  <input type="text" name="itemName" required placeholder="例如：高階定制調理（厚毛加價）" />
                </div>
                <div class="field" style="margin:0; width:100px;">
                  <label style="font-size:12px;">金額</label>
                  <input type="number" name="price" min="0" required />
                </div>
                <div class="field" style="margin:0; width:140px;">
                  <label style="font-size:12px;">積分分類（選填）</label>
                  <select name="category">
                    <option value="">不計積分（其他）</option>
                    <option th:each="c : ${performanceCategories}" th:value="${c}" th:text="${c.label}"></option>
                  </select>
                </div>
                <button type="submit" class="btn btn-outline" style="padding:6px 14px; font-size:12px;">加入</button>
              </form>
            </div>
            <p style="font-size: 11px; color: var(--brown-light); margin: 6px 0 0;">
              ⚠️ 這種自訂項目不參與任何折扣。
            </p>
            <div style="display:flex; gap:8px; align-items:end; flex-wrap:wrap; margin-top:8px;">
              <form th:if="${retailProducts != null and !retailProducts.isEmpty()}" method="post"
                    th:action="@{/admin/walk-in-orders/{id}/add-retail-item(id=${order.id})}"
                    style="display:flex; gap:8px; align-items:end; flex:1; min-width:220px;">
                <input type="hidden" name="from" value="final-check" />
                <div class="field" style="margin:0; flex:1;">
                  <label style="font-size:12px;">加購商品</label>
                  <select name="retailProductId" required>
                    <option th:each="p : ${retailProducts}" th:value="${p.id}"
                            th:text="${p.name} + '（$' + ${p.price} + '）'"></option>
                  </select>
                </div>
                <input type="number" name="quantity" value="1" min="1" style="width:60px;" required />
                <button type="submit" class="btn btn-outline" style="padding:6px 14px; font-size:12px;">加入</button>
              </form>
            </div>
          </div>

          <form id="finalCheckForm" method="post" th:action="@{/admin/walk-in-orders/{id}/final-check(id=${order.id})}">
            <div class="card" style="margin-bottom: 1rem">
              <h3 style="font-size: 15px; color: var(--brown-dark); margin-bottom: 12px">
                本次毛孩美容狀況備注 *
              </h3>
              <textarea
                name="note"
                rows="4"
                placeholder="請輸入本次美容狀況..."
                required
              ></textarea>
            </div>

            <div class="card" style="margin-bottom: 1rem">
              <h3 style="font-size: 15px; color: var(--brown-dark); margin-bottom: 12px">
                家長現場核對簽名 *
              </h3>
              <div
                style="
                  background: #fff;
                  border: 1.5px dashed var(--cream-400);
                  border-radius: 8px;
                  position: relative;
                  touch-action: none;
                "
              >
                <canvas
                  id="signaturePad"
                  width="600"
                  height="180"
                  style="
                    width: 100%;
                    height: 180px;
                    display: block;
                    cursor: crosshair;
                    border-radius: 8px;
                  "
                ></canvas>
                <span
                  id="signaturePlaceholder"
                  style="
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    color: var(--cream-400);
                    font-size: 13px;
                    pointer-events: none;
                  "
                >
                  請家長在此處簽名
                </span>
              </div>
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  margin-top: 8px;
                "
              >
                <p
                  id="signatureHint"
                  style="font-size: 11.5px; color: var(--brown-light); margin: 0"
                >
                  簽名須為親筆手寫，系統才會受理此核對
                </p>
                <button
                  type="button"
                  id="clearSignatureBtn"
                  class="btn btn-outline"
                  style="padding: 4px 14px; font-size: 12px"
                >
                  清除重簽
                </button>
              </div>
              <input type="hidden" name="signatureData" id="signatureData" />
            </div>

            <div style="display: flex; gap: 12px">
              <button
                type="submit"
                class="btn btn-primary"
                id="submitBtn"
                disabled
              >
                送出核對，可進行結帳
              </button>
              <a href="/admin/walk-in-orders" class="btn btn-outline">取消</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("signaturePad");
      const ctx = canvas.getContext("2d");
      const placeholder = document.getElementById("signaturePlaceholder");
      const hint = document.getElementById("signatureHint");
      const hiddenInput = document.getElementById("signatureData");
      const submitBtn = document.getElementById("submitBtn");
      const clearBtn = document.getElementById("clearSignatureBtn");

      let hasSigned = false;
      let drawing = false;

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        canvas.width = rect.width * ratio;
        canvas.height = rect.height * ratio;
        ctx.scale(ratio, ratio);
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#2b2a28";
      }
      window.addEventListener("resize", resizeCanvas);
      if (canvas) resizeCanvas();

      function getPos(evt) {
        const rect = canvas.getBoundingClientRect();
        if (evt.touches && evt.touches.length > 0) {
          return {
            x: evt.touches[0].clientX - rect.left,
            y: evt.touches[0].clientY - rect.top,
          };
        }
        return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      }

      function startDraw(evt) {
        evt.preventDefault();
        drawing = true;
        placeholder.style.display = "none";
        const pos = getPos(evt);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function moveDraw(evt) {
        if (!drawing) return;
        evt.preventDefault();
        const pos = getPos(evt);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        hasSigned = true;
        updateState();
      }

      function endDraw() {
        drawing = false;
      }

      if (canvas) {
        canvas.addEventListener("mousedown", startDraw);
        canvas.addEventListener("mousemove", moveDraw);
        window.addEventListener("mouseup", endDraw);
        canvas.addEventListener("touchstart", startDraw, { passive: false });
        canvas.addEventListener("touchmove", moveDraw, { passive: false });
        canvas.addEventListener("touchend", endDraw);
      }

      if (clearBtn) {
        clearBtn.addEventListener("click", function () {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          placeholder.style.display = "block";
          hasSigned = false;
          hiddenInput.value = "";
          updateState();
        });
      }

      function updateState() {
        if (hasSigned) {
          hint.style.color = "#2e7d32";
          hint.textContent = "✓ 已完成簽名";
        } else {
          hint.style.color = "var(--brown-light)";
          hint.textContent = "簽名須為親筆手寫，系統才會受理此核對";
        }
        submitBtn.disabled = !hasSigned;
      }

      const formEl = document.getElementById("finalCheckForm");
      if (formEl) {
        formEl.addEventListener("submit", function (e) {
          if (!hasSigned) {
            e.preventDefault();
            return;
          }
          hiddenInput.value = canvas.toDataURL("image/png");
        });
      }
    </script>
  </body>
</html>
