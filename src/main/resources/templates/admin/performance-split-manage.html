<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('拆分管理 | 慕沐村 Mulage pet')}"
  ></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <h2 style="margin: 0">✂️ 積分拆分管理</h2>
          <a href="/admin/performance" class="btn">← 回日報</a>
        </div>

        <div class="alert alert-success" th:if="${successMsg}" th:text="${successMsg}"></div>
        <div class="alert alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

        <!-- 篩選條件 -->
        <div class="card" style="margin-bottom: 1.25rem">
          <form method="get" action="/admin/performance/split-manage"
                style="display: grid; grid-template-columns: repeat(4, 1fr) auto; gap: 12px; align-items: end;">
            <div class="field" style="margin: 0">
              <label>日期從</label>
              <input type="date" name="dateFrom" th:value="${dateFrom}" />
            </div>
            <div class="field" style="margin: 0">
              <label>日期到</label>
              <input type="date" name="dateTo" th:value="${dateTo}" />
            </div>
            <div class="field" style="margin: 0">
              <label>寵物名稱</label>
              <input type="text" name="petName" th:value="${petName}" placeholder="關鍵字搜尋" />
            </div>
            <div class="field" style="margin: 0">
              <label>經手人</label>
              <select name="staffId">
                <option value="">全部員工</option>
                <option th:each="s : ${staffList}" th:value="${s.id}" th:text="${s.name}"
                        th:selected="${staffId != null and staffId == s.id}"></option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary">篩選</button>
          </form>
        </div>

        <!-- 待拆分清單 -->
        <div class="card" style="margin-bottom: 1.25rem">
          <h3 style="font-size: 15px; margin-bottom: 12px">📋 待拆分積分清單</h3>
          <p style="font-size: 12px; color: var(--brown-light); margin-bottom: 10px">
            僅支援對半拆分，積分自動四捨五入到小數點第一位
          </p>
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>寵物名</th>
                <th>服務項目</th>
                <th>目前經手人</th>
                <th>原始積分</th>
                <th>對半後各得</th>
                <th>拆分給</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(candidates)}">
                <td colspan="8" class="empty">篩選範圍內沒有可拆分的積分紀錄</td>
              </tr>
              <tr th:each="c : ${candidates}">
                <td th:text="${c.serviceDate}"></td>
                <td th:text="${c.petName}"></td>
                <td th:text="${c.itemLabel}"></td>
                <td th:text="${c.staffName}"></td>
                <td th:text="${c.points}"></td>
                <td style="font-weight: 700; color: #c9a84c" th:text="${c.halfPoints} + ' × 2'"></td>
                <td colspan="2">
                  <form method="post" action="/admin/performance/split" style="display: flex; gap: 6px; align-items: center;">
                    <input type="hidden" name="sourceRecordId" th:value="${c.id}" />
                    <input type="hidden" name="returnTo"
                           th:value="@{/admin/performance/split-manage(dateFrom=${dateFrom}, dateTo=${dateTo}, petName=${petName}, staffId=${staffId})}" />
                    <select name="toStaffId" required style="font-size: 12px; padding: 4px 6px;">
                      <option value="" disabled selected>選擇對象</option>
                      <option th:each="s : ${staffList}" th:if="${s.id != c.staffId}"
                              th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                    <button type="submit" class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;"
                            onclick="return confirm('確定要對半拆分這筆積分嗎？');">拆分</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 拆分歷史 -->
        <div class="card">
          <h3 style="font-size: 15px; margin-bottom: 12px">🕘 拆分歷史</h3>
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>寵物名</th>
                <th>服務項目</th>
                <th>原本歸屬</th>
                <th>拆分後給誰</th>
                <th>各自積分</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(history)}">
                <td colspan="6" class="empty">篩選範圍內沒有拆分紀錄</td>
              </tr>
              <tr th:each="h : ${history}">
                <td th:text="${h.serviceDate}"></td>
                <td th:text="${h.petName}"></td>
                <td th:text="${h.itemLabel}"></td>
                <td th:text="${h.fromStaffName}"></td>
                <td th:text="${h.toStaffName}"></td>
                <td style="font-weight: 700" th:text="${h.halfPoints}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
