<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head th:replace="~{fragments/header :: common-head('慕馬對話紀錄 | 慕沐村 Mulage pet')}"></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content">
        <h2 style="margin-bottom: 4px">慕馬對話紀錄</h2>
        <p style="font-size: 13px; color: var(--brown-light); margin-bottom: 1.25rem">
          顧客在 LINE 會員頁問慕馬的問題與回答，顯示最近 14 天。發現回答不對時，記下來修改慕馬的知識文件。
        </p>

        <div class="card" style="display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 1rem">
          <div>
            <div style="font-size: 12px; color: var(--brown-light)">狀態</div>
            <b th:text="${usage.enabled} ? '已開啟' : '關閉中'">已開啟</b>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--brown-light)">本月花費 ／ 預算</div>
            <b th:text="'US$ ' + ${#numbers.formatDecimal(usage.monthCostUsd, 1, 2)} + ' ／ ' + ${#numbers.formatDecimal(usage.monthlyBudgetUsd, 1, 2)}">US$ 1.20 ／ 19.00</b>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--brown-light)">今天提問</div>
            <b th:text="${usage.questionsToday} + ' 題'">12 題</b>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--brown-light)">本月提問</div>
            <b th:text="${usage.questionsThisMonth} + ' 題'">340 題</b>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width: 120px">時間</th>
              <th style="width: 110px">會員</th>
              <th style="width: 60px">誰</th>
              <th>內容</th>
              <th style="width: 90px">頁面</th>
              <th style="width: 80px">花費</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(logs)}">
              <td colspan="6" class="empty">尚無對話</td>
            </tr>
            <tr th:each="l : ${logs}" th:style="${l.fromCustomer} ? 'background:#faf7f2' : ''">
              <td th:text="${#temporals.format(l.createdAt, 'MM/dd HH:mm')}"></td>
              <td th:text="${l.memberName}"></td>
              <td th:text="${l.fromCustomer} ? '顧客' : (${l.fallback} ? '慕馬（備用）' : '慕馬')"></td>
              <td th:text="${l.content}" style="white-space: pre-wrap"></td>
              <td th:text="${l.page} ?: '—'"></td>
              <td th:text="${l.fromCustomer} ? '' : '$' + ${#numbers.formatDecimal(l.costUsd, 1, 4)}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
