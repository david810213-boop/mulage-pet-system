<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head th:replace="~{fragments/header :: common-head('慕馬對話紀錄 | 慕沐村 Mulage pet')}"></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content">
        <h2 style="margin-bottom: 4px">慕馬對話紀錄</h2>
        <p style="font-size: 13px; color: var(--brown-light); margin-bottom: 1.25rem">
          顧客在 LINE 會員頁問慕馬的問題與回答，顯示最近 14 天。發現回答不對時，記下來修改慕馬的知識文件。
        </p>

        <div class="card" style="margin-bottom: 1rem">
          <h3 style="margin: 0 0 4px">試問慕馬</h3>
          <p style="font-size: 13px; color: var(--brown-light); margin: 0 0 12px">
            以指定會員的身分問一題，慕馬會查這位會員的預約、訂金、儲值金與毛孩資料來回答。不扣會員的每日題數；每題約 US$0.001～0.003，算進本月花費。
          </p>
          <form method="post" action="/admin/assistant-logs/trial" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
            <input type="text" name="keyword" th:value="${trialKeyword}" placeholder="會員姓名或電話" required style="width: 180px" />
            <input type="text" name="message" th:value="${trialMessage}" maxlength="200" placeholder="例如：我下次預約是哪天？" required style="flex: 1; min-width: 240px" />
            <button type="submit" class="btn btn-primary">送出</button>
          </form>

          <div th:if="${candidates}" style="margin-top: 12px">
            <p style="font-size: 13px; margin: 0 0 6px">找到多位會員，請選一位：</p>
            <form method="post" action="/admin/assistant-logs/trial" style="display: flex; gap: 8px; flex-wrap: wrap">
              <input type="hidden" name="keyword" th:value="${trialKeyword}" />
              <input type="hidden" name="message" th:value="${trialMessage}" />
              <button type="submit" name="memberId" th:each="c : ${candidates}" th:value="${c.id}" class="btn"
                      th:text="${c.name} + (${c.phone} != null ? '（' + ${c.phone} + '）' : '')">王小明（0912…）</button>
            </form>
          </div>

          <p th:if="${trialError}" th:text="${trialError}" style="margin: 12px 0 0; color: #b5603f"></p>

          <div th:if="${trial}" style="margin-top: 14px; padding: 12px 14px; background: #faf7f2; border-radius: 10px">
            <div style="font-size: 12px; color: var(--brown-light)" th:text="${trial.memberName} + ' 問：' + ${trial.question}"></div>
            <div style="margin: 6px 0; white-space: pre-wrap" th:text="${trial.text}">回答</div>
            <div th:if="${!#lists.isEmpty(trial.actions)}" style="font-size: 13px">
              按鈕：<span th:each="a, st : ${trial.actions}" th:text="${a.label} + '（' + ${a.url} + '）' + (${st.last} ? '' : '、')"></span>
            </div>
            <div style="font-size: 12px; color: var(--brown-light); margin-top: 6px"
                 th:text="'查詢：' + (${#lists.isEmpty(trial.toolsUsed)} ? '無' : ${#strings.listJoin(trial.toolsUsed, '、')})
                          + '｜' + (${trial.mood} == 'unsure' ? '轉真人｜' : '')
                          + '輸入 ' + ${trial.inputTokens} + ' / 輸出 ' + ${trial.outputTokens} + ' tokens｜US$ '
                          + ${#numbers.formatDecimal(trial.costUsd, 1, 4)}"></div>
          </div>
        </div>

        <div class="card" style="display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 1rem">
          <div>
            <div style="font-size: 12px; color: var(--brown-light)">狀態</div>
            <b th:text="${usage.enabled} ? '已開啟' : '關閉中'">已開啟</b>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--brown-light)">本月花費 ／ 預算</div>
            <b th:text="'US$ ' + ${#numbers.formatDecimal(usage.monthCostUsd, 1, 2)} + ' ／ ' + ${#numbers.formatDecimal(usage.monthlyBudgetUsd, 1, 2)}">US$ 1.20 ／ 19.00</b>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--brown-light)">今天提問</div>
            <b th:text="${usage.questionsToday} + ' 題'">12 題</b>
          </div>
          <div>
            <div style="font-size: 12px; color: var(--brown-light)">本月提問</div>
            <b th:text="${usage.questionsThisMonth} + ' 題'">340 題</b>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width: 120px">時間</th>
              <th style="width: 110px">會員</th>
              <th style="width: 60px">誰</th>
              <th>內容</th>
              <th style="width: 90px">頁面</th>
              <th style="width: 80px">花費</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${#lists.isEmpty(logs)}">
              <td colspan="6" class="empty">尚無對話</td>
            </tr>
            <tr th:each="l : ${logs}" th:style="${l.fromCustomer} ? 'background:#faf7f2' : ''">
              <td th:text="${#temporals.format(l.createdAt, 'MM/dd HH:mm')}"></td>
              <td th:text="${l.memberName}"></td>
              <td th:text="${l.fromCustomer} ? '顧客' : (${l.fallback} ? '慕馬（備用）' : '慕馬')"></td>
              <td th:text="${l.content}" style="white-space: pre-wrap"></td>
              <td th:text="${l.page} == 'admin-trial' ? '後台試問' : (${l.page} ?: '—')"></td>
              <td th:text="${l.fromCustomer} ? '' : '$' + ${#numbers.formatDecimal(l.costUsd, 1, 4)}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
