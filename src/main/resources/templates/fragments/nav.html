<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- 用法完全不變：<div th:replace="~{fragments/nav :: nav}"></div>
         目前頁面的高亮由下方小段 script 依網址自動判斷，模板不用改。 -->
    <nav th:fragment="nav" class="nav-side">
      <a href="/dashboard" class="nav-brand">
        <div class="name">慕沐村</div>
        <div class="latin">MULAGE PET</div>
      </a>

      <div class="nav-list">
        <a href="/appointments" class="nav-link">預約管理</a>
        <a href="/pets" class="nav-link" th:if="${user != null and user.customer}">我的寵物</a>
        <a href="/payments" class="nav-link">交易紀錄</a>

        <div class="nav-group" th:if="${user != null and user.staffOrAdmin}">店務管理</div>
        <a href="/admin/wallets" class="nav-link" th:if="${user != null and user.staffOrAdmin}">儲值管理</a>
        <a href="/admin/walk-in-orders" class="nav-link" th:if="${user != null and user.staffOrAdmin}">現場開單</a>
        <a href="/admin/performance" class="nav-link" th:if="${user != null and user.staffOrAdmin}">績效管理</a>
        <a href="/admin/customers" class="nav-link" th:if="${user != null and user.staffOrAdmin}">會員信息</a>
        <a href="/admin" class="nav-link" th:if="${user != null and user.admin}">管理後台</a>
        <a href="/admin/operation-logs" class="nav-link" th:if="${user != null and user.admin}">操作紀錄</a>
      </div>

      <div class="nav-foot" th:if="${user != null}">
        <div class="who" th:text="${user.name}">使用者</div>
        <div class="role" th:text="${user.role}">ROLE</div>
        <a href="/account/password" th:if="${user != null and user.staffOrAdmin}">修改密碼</a>
        <a href="/auth/logout">登出</a>
      </div>

      <script th:inline="none">
        (function () {
          var path = window.location.pathname;
          var links = document.querySelectorAll(".nav-side .nav-link");
          var best = null;
          for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute("href");
            if (path === href || path.indexOf(href + "/") === 0) {
              if (!best || href.length > best.getAttribute("href").length) best = links[i];
            }
          }
          if (best) best.classList.add("is-active");
        })();
      </script>
    </nav>
  </body>
</html>
