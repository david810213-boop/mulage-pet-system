<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('交易紀錄 | 慕沐村 Mulage pet')}"
  ></head>
  <style>
    /* 交易紀錄列可點擊查看明細（比照會員信息頁消費明細做法） */
    tbody tr.is-clickable {
      cursor: pointer;
    }
    tbody tr.is-clickable:hover td {
      background: var(--cream-100);
    }
    .cd-detail-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(32, 30, 29, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .cd-detail-backdrop.show {
      display: flex;
    }
    .cd-detail-sheet {
      background: #fff;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: var(--radius-lg, 12px);
      padding: 22px 24px;
    }
    .cd-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--cream-300);
    }
    .cd-detail-header h3 {
      font-size: 16px;
      color: var(--brown-dark);
      margin: 0;
    }
    .cd-detail-close {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--brown-light);
      cursor: pointer;
      padding: 2px 6px;
    }
    .cd-detail-loading,
    .cd-detail-error {
      text-align: center;
      padding: 30px 0;
      font-size: 13.5px;
      color: var(--brown-light);
    }
    .cd-detail-error {
      color: #c62828;
    }
    .cd-detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--cream-200);
      font-size: 13.5px;
      color: var(--brown-dark);
    }
    .cd-detail-row:last-child {
      border-bottom: none;
    }
    .cd-detail-row .name {
      flex: 1;
    }
    .cd-detail-row .operator {
      font-size: 11px;
      color: var(--brown-light);
      margin-left: 6px;
    }
    .cd-detail-row .price {
      font-weight: 700;
      margin-left: 10px;
      white-space: nowrap;
    }
    .cd-detail-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      margin-top: 6px;
      border-top: 2px solid var(--brown-dark);
      font-size: 15px;
      font-weight: 700;
      color: var(--brown-dark);
    }
    .cd-detail-section {
      margin-bottom: 14px;
    }
    .cd-detail-section .label {
      font-size: 11.5px;
      color: var(--brown-light);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .cd-detail-payment {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--cream-100);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      color: var(--brown-mid);
      line-height: 1.8;
    }
  </style>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content">
        <div
          class="alert-success"
          th:if="${successMsg}"
          th:text="${successMsg}"
        ></div>

        <!-- 需求（追加，2026-08-24）：狗狗定價流程簡化——結帳完成後的體重更新提醒彈窗 -->
        <div id="weightReminderModal" th:if="${weightReminderPetId != null}"
             style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center;">
          <div style="background:white; border-radius:12px; padding:24px; max-width:380px; width:90%;">
            <h3 style="margin-top:0; font-size:16px;">📏 記得更新體重</h3>
            <p style="font-size:13.5px; color:#666; line-height:1.6;">
              「<strong th:text="${weightReminderPetName}"></strong>」目前登記的體重是
              <strong th:text="${weightReminderCurrentWeight} + 'kg'"></strong>，
              這個數字是下次開單自動篩選套餐菜單的依據，記得跟顧客確認一下最新體重。
            </p>
            <div style="display:flex; gap:8px; align-items:center; margin:12px 0;">
              <input type="number" id="weightReminderInput" step="0.1"
                     th:value="${weightReminderCurrentWeight}"
                     style="flex:1; padding:8px; border:1px solid var(--cream-300); border-radius:6px;" />
              <span style="font-size:13px; color:#999;">kg</span>
            </div>
            <div style="display:flex; gap:8px;">
              <button type="button" class="btn btn-primary" style="flex:1;"
                      th:onclick="'saveWeightReminder(' + ${weightReminderPetId} + ')'">
                儲存體重
              </button>
              <button type="button" class="btn btn-outline" style="flex:1;"
                      onclick="document.getElementById('weightReminderModal').remove()">
                稍後再說
              </button>
            </div>
          </div>
        </div>
        <script th:if="${weightReminderPetId != null}">
          async function saveWeightReminder(petId) {
            const weight = parseFloat(document.getElementById('weightReminderInput').value);
            if (!weight || weight <= 0) {
              alert('請輸入有效的體重');
              return;
            }
            try {
              const res = await fetch('/api/admin/pets/' + petId + '/weight', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ weight: weight }),
              });
              if (!res.ok) {
                alert('更新失敗，請重試');
                return;
              }
              document.getElementById('weightReminderModal').remove();
            } catch (e) {
              alert('網路錯誤，請重試');
            }
          }
        </script>
        <h2>交易紀錄</h2>
        <p style="font-size: 12px; color: var(--brown-light); margin-top: -6px; margin-bottom: 12px;">
          點擊任一列可查看該筆消費明細
        </p>
        <table>
          <thead>
            <tr>
              <th>來源</th>
              <th>編號</th>
              <th>寵物</th>
              <th>付款方式</th>
              <th>金額</th>
              <th>付款時間</th>
              <th>經手人</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${transactions == null or transactions.isEmpty()}">
              <td
                colspan="7"
                style="text-align: center; color: #aaa; padding: 2rem"
              >
                目前沒有交易紀錄
              </td>
            </tr>
            <tr th:each="t : ${transactions}"
                th:classappend="${t.recordId != null} ? 'is-clickable' : ''"
                th:attr="data-source-type=${t.sourceType},data-record-id=${t.recordId}">
              <td>
                <span class="badge" th:style="${t.sourceLabel == '現場開單'} ? 'background:var(--cream-400); color:#4a3620;' : 'background:var(--cream-200); color:var(--brown-mid);'"
                      th:text="${t.sourceLabel}"></span>
              </td>
              <td th:text="${t.code}"></td>
              <td th:text="${t.petName} ?: '—'"></td>
              <td th:text="${t.paymentMethodLabel}"></td>
              <td th:text="${'$' + t.amount}"></td>
              <td th:text="${t.time != null ? #temporals.format(t.time, 'yyyy/MM/dd HH:mm') : '—'}"></td>
              <td th:text="${t.handledBy}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 消費明細彈窗 -->
    <div
      class="cd-detail-backdrop"
      id="cdDetailBackdrop"
      onclick="closeConsumeDetailOnBackdrop(event)"
    >
      <div class="cd-detail-sheet">
        <div class="cd-detail-header">
          <h3>消費明細</h3>
          <button
            class="cd-detail-close"
            onclick="closeConsumeDetail()"
            aria-label="關閉"
          >
            ✕
          </button>
        </div>
        <div id="cdDetailBody">
          <div class="cd-detail-loading">載入中...</div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var tbody = document.querySelector("tbody");
        if (!tbody) return;
        tbody.addEventListener("click", function (e) {
          var row = e.target.closest("tr.is-clickable");
          if (!row) return;
          var sourceType = row.getAttribute("data-source-type");
          var recordId = row.getAttribute("data-record-id");
          if (!sourceType || !recordId) return;
          openConsumeDetail(sourceType, recordId);
        });
      });

      function petIconOf(type) {
        if (type === "DOG") return "🐶";
        if (type === "CAT") return "🐱";
        return "🐾";
      }

      async function openConsumeDetail(sourceType, recordId) {
        const backdrop = document.getElementById("cdDetailBackdrop");
        const body = document.getElementById("cdDetailBody");
        body.innerHTML = '<div class="cd-detail-loading">載入中...</div>';
        backdrop.classList.add("show");

        const url =
          sourceType === "WALKIN"
            ? "/api/admin/walk-in-orders/" + recordId
            : "/api/appointments/" + recordId + "/detail";

        try {
          const res = await fetch(url, {
            headers: { "ngrok-skip-browser-warning": "true" },
          });
          const data = await res.json().catch(() => null);
          if (!res.ok) {
            body.innerHTML =
              '<div class="cd-detail-error">載入明細失敗：' +
              (typeof data === "string"
                ? data
                : (data && data.message) || res.status) +
              "</div>";
            return;
          }
          if (sourceType === "WALKIN") {
            renderWalkInDetail(data);
          } else {
            renderAppointmentDetail(data);
          }
        } catch (e) {
          body.innerHTML =
            '<div class="cd-detail-error">網路錯誤，請重試</div>';
        }
      }

      function renderAppointmentDetail(d) {
        const body = document.getElementById("cdDetailBody");
        const itemsHtml = (d.items || [])
          .map(
            (it) => `
          <div class="cd-detail-row">
            <span class="name">${it.name}${it.operatorName ? `<span class="operator">・${it.operatorName}</span>` : ""}${it.appliedDiscountType === "REWASH" ? '<span class="operator" style="color:#2e7d32;">・回洗優惠</span>' : it.appliedDiscountType === "MEMBER" ? '<span class="operator" style="color:#2e7d32;">・會員折扣</span>' : '<span class="operator">・原價（不打折）</span>'}</span>
            <span class="price">$${it.price}</span>
          </div>`,
          )
          .join("");

        const paymentHtml = d.paymentMethodLabel
          ? `
          <div class="cd-detail-payment">
            付款方式：${d.paymentMethodLabel}<br>
            ${d.paymentTime ? `付款時間：${d.paymentTime.replace("T", " ").substring(0, 16)}<br>` : ""}
            ${d.handledBy ? `經手人：${d.handledBy}` : ""}
          </div>`
          : "";

        const hasDiscountAmount = d.chargedAmount != null && d.chargedAmount !== d.totalAmount;

        body.innerHTML = `
          <div class="cd-detail-section">
            <div class="label">${d.appointmentCode}　${petIconOf(d.petType)}${d.petName}（預約結帳）</div>
            <div class="cd-detail-row">
              <span class="name">預約時間</span>
              <span class="price">${d.date} ${d.startTime.substring(0, 5)}-${d.endTime.substring(0, 5)}</span>
            </div>
            <div class="cd-detail-row">
              <span class="name">狀態</span>
              <span class="price">${d.cancelled ? "已取消" : d.statusLabel}</span>
            </div>
            ${d.memberNote ? `<div class="cd-detail-row"><span class="name">備註</span><span class="price">${d.memberNote}</span></div>` : ""}
          </div>

          <div class="cd-detail-section">
            <div class="label">服務項目</div>
            ${itemsHtml || '<div class="cd-detail-row"><span class="name">（無項目資料）</span></div>'}
            <div class="cd-detail-total">
              <span>帳面合計</span>
              <span>$${d.totalAmount}</span>
            </div>
            ${hasDiscountAmount ? `<div class="cd-detail-total" style="border-top:none; padding-top:2px; color:#2e7d32;"><span>實際扣款（已套用折扣）</span><span>$${d.chargedAmount}</span></div>` : ""}
          </div>

          ${paymentHtml}
        `;
      }

      function renderWalkInDetail(d) {
        const body = document.getElementById("cdDetailBody");
        const itemsHtml = (d.items || [])
          .map(
            (it) => `
          <div class="cd-detail-row">
            <span class="name">${it.itemName}${it.operator ? `<span class="operator">・${it.operator}</span>` : ""}${it.appliedDiscountType === "REWASH" ? '<span class="operator" style="color:#2e7d32;">・回洗優惠</span>' : it.appliedDiscountType === "MEMBER" ? '<span class="operator" style="color:#2e7d32;">・會員折扣</span>' : '<span class="operator">・原價（不打折）</span>'}</span>
            <span class="price">$${it.price}</span>
          </div>`,
          )
          .join("");

        const paymentHtml = d.paymentMethodLabel
          ? `
          <div class="cd-detail-payment">
            付款方式：${d.paymentMethodLabel}<br>
            ${d.paymentTime ? `付款時間：${d.paymentTime.replace("T", " ").substring(0, 16)}<br>` : ""}
            經手人／開單人：${d.createdBy || "—"}
          </div>`
          : "";

        const hasDiscountAmount = d.chargedAmount != null && d.chargedAmount !== d.totalAmount;

        body.innerHTML = `
          <div class="cd-detail-section">
            <div class="label">現場單 #${d.id}　${d.petName || ""}（現場開單）</div>
            ${d.memberName ? `<div class="cd-detail-row"><span class="name">會員</span><span class="price">${d.memberName}</span></div>` : ""}
            ${d.note ? `<div class="cd-detail-row"><span class="name">備註</span><span class="price">${d.note}</span></div>` : ""}
          </div>

          <div class="cd-detail-section">
            <div class="label">服務項目</div>
            ${itemsHtml || '<div class="cd-detail-row"><span class="name">（無項目資料）</span></div>'}
            <div class="cd-detail-total">
              <span>帳面合計</span>
              <span>$${d.totalAmount}</span>
            </div>
            ${hasDiscountAmount ? `<div class="cd-detail-total" style="border-top:none; padding-top:2px; color:#2e7d32;"><span>實際扣款（已套用折扣）</span><span>$${d.chargedAmount}</span></div>` : ""}
          </div>

          ${paymentHtml}
        `;
      }

      function closeConsumeDetail() {
        document.getElementById("cdDetailBackdrop").classList.remove("show");
      }

      function closeConsumeDetailOnBackdrop(e) {
        if (e.target.id === "cdDetailBackdrop") closeConsumeDetail();
      }
    </script>
  </body>
</html>
