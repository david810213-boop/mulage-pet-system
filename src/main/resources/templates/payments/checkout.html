<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('結帳 | 慕沐村 Mulage pet')}"
  ></head>
  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>
      <div class="content">
        <h2>結帳</h2>
        <div
          class="alert-error"
          th:if="${errorMsg}"
          th:text="${errorMsg}"
        ></div>

        <div
          class="card"
          th:if="${walletBalance != null}"
          th:style="${walletLowBalance}
               ? 'border:1px solid #e53935;background:#fdecec;margin-bottom:1rem;'
               : 'border:1px solid #e0e0e0;background:#f8f9fa;margin-bottom:1rem;'"
        >
          <p style="margin: 0; font-size: 14px">
            會員儲值金餘額：
            <strong th:text="'$' + ${walletBalance}"></strong>
          </p>
          <p
            th:if="${walletLowBalance}"
            style="
              margin: 6px 0 0;
              color: #c62828;
              font-size: 13px;
              font-weight: 600;
            "
          >
            ⚠ 餘額低於 $2,000，建議提醒會員儲值
          </p>
          <p style="margin: 8px 0 0; font-size: 13px; color: #666">
            若使用「儲值金」付款：原價 $<span th:text="${baseAmount}"></span>
            <span th:if="${walletDiscountActive}">
              → 會員折扣後 $<strong
                th:text="${walletFinalAmount}"
                style="color: #2e7d32"
              ></strong>
              <span style="color: #2e7d32"
                >（享
                <span
                  th:text="${#numbers.formatDecimal(walletDiscount * 10, 1, 1)}"
                ></span>
                折）</span
              >
            </span>
            <span th:unless="${walletDiscountActive}">（無會員折扣）</span>
          </p>
        </div>

        <div class="card">
          <form
            method="post"
            th:action="@{/payments/checkout/{id}/submit(id=${appointmentId})}"
          >
            <div class="field">
              <label>付款方式</label>
              <select name="paymentMethod" id="paymentMethodSelect" required>
                <option value="" disabled selected>請選擇付款方式</option>
                <option
                  th:each="m : ${paymentMethods}"
                  th:value="${m.name()}"
                  th:text="${m.name() == 'CASH' ? '現金' : m.name() == 'LINE_PAY' ? 'Line Pay' : m.name() == 'WIRE_TRANSFER' ? '匯款' : '儲值金（套用會員折扣）'}"
                  th:selected="${checkoutRequest?.paymentMethod?.name() == m.name()}"
                ></option>
              </select>
              <p class="method-hint">
                不同付款方式手續費不同，結帳後可於交易紀錄查看實付金額。選擇「儲值金」將依會員等級套用折扣後，直接從會員儲值餘額中扣除，餘額不足將無法結帳。
              </p>
            </div>

            <!-- 需求 10：選「匯款」時自動顯示店家帳號資訊，選其他方式則隱藏 -->
            <div
              id="wireTransferInfo"
              style="display: none; margin-top: 10px; padding: 12px 14px; background: var(--cream-100); border: 1px solid var(--cream-300); border-radius: var(--radius-sm);"
            >
              <p style="font-size: 13px; font-weight: 700; color: var(--brown-dark); margin-bottom: 6px;">
                請匯款至以下帳戶，並提醒顧客保留匯款憑證
              </p>
              <p style="font-size: 13px; margin: 2px 0;">銀行：<span th:text="${bankAccountInfo.bankName}"></span></p>
              <p style="font-size: 13px; margin: 2px 0;">帳號：<span th:text="${bankAccountInfo.accountNumber}"></span></p>
              <p style="font-size: 13px; margin: 2px 0;">戶名：<span th:text="${bankAccountInfo.accountHolder}"></span></p>
              <p style="font-size: 12px; color: var(--brown-light); margin-top: 8px;">
                送出後訂單會先進入「待對帳」狀態，需要店家在確認收到款項後另外按「確認收款」，訂單才會正式轉為已完成。
              </p>
            </div>
            <script>
              document.getElementById('paymentMethodSelect').addEventListener('change', function () {
                document.getElementById('wireTransferInfo').style.display =
                  this.value === 'WIRE_TRANSFER' ? 'block' : 'none';
              });
            </script>

            <div style="display: flex; gap: 10px; margin-top: 0.5rem">
              <button type="submit" class="btn">確認付款</button>
              <a href="/appointments" class="btn btn-outline">取消</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
