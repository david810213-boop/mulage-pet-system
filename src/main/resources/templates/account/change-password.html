<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
  <head
    th:replace="~{fragments/header :: common-head('修改密碼 | 慕沐村 Mulage pet')}"
  ></head>

  <body>
    <div class="page-wrapper">
      <div th:replace="~{fragments/nav :: nav}"></div>

      <div class="content" style="max-width: 480px">
        <a
          href="/dashboard"
          class="btn btn-outline"
          style="margin-bottom: 1.5rem; text-decoration: none"
          >← 返回首頁</a
        >

        <h2>🔒 修改密碼</h2>
        <p
          style="
            font-size: 13px;
            color: var(--brown-light);
            margin-top: -4px;
            margin-bottom: 1.5rem;
          "
        >
          帳號：<span th:text="${user.username}"></span>
        </p>

        <div
          class="alert alert-success"
          th:if="${successMsg}"
          th:text="${successMsg}"
        ></div>
        <div
          class="alert alert-danger"
          th:if="${errorMsg}"
          th:text="${errorMsg}"
        ></div>

        <div class="card" style="padding: 1.5rem">
          <form method="post" th:action="@{/account/password}">
            <div style="margin-bottom: 16px">
              <label
                style="
                  display: block;
                  font-size: 13px;
                  color: var(--brown-mid);
                  font-weight: 500;
                  margin-bottom: 6px;
                "
                >目前密碼</label
              >
              <input
                type="password"
                name="oldPassword"
                required
                style="
                  width: 100%;
                  padding: 10px 12px;
                  border: 1px solid var(--cream-300);
                  border-radius: 8px;
                  font-size: 14px;
                "
              />
            </div>

            <div style="margin-bottom: 16px">
              <label
                style="
                  display: block;
                  font-size: 13px;
                  color: var(--brown-mid);
                  font-weight: 500;
                  margin-bottom: 6px;
                "
                >新密碼 <span style="color: #999; font-weight: 400;">（至少 4 個字元）</span></label
              >
              <input
                type="password"
                name="newPassword"
                required
                minlength="4"
                style="
                  width: 100%;
                  padding: 10px 12px;
                  border: 1px solid var(--cream-300);
                  border-radius: 8px;
                  font-size: 14px;
                "
              />
            </div>

            <div style="margin-bottom: 20px">
              <label
                style="
                  display: block;
                  font-size: 13px;
                  color: var(--brown-mid);
                  font-weight: 500;
                  margin-bottom: 6px;
                "
                >確認新密碼</label
              >
              <input
                type="password"
                name="confirmPassword"
                required
                minlength="4"
                style="
                  width: 100%;
                  padding: 10px 12px;
                  border: 1px solid var(--cream-300);
                  border-radius: 8px;
                  font-size: 14px;
                "
              />
            </div>

            <button type="submit" class="btn" style="width: 100%">
              確認修改密碼
            </button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
