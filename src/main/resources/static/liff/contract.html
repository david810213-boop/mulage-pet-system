<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>犬、貓美容服務定型化契約 · 慕沐村</title>
    <!--
      需求（追加，2026-10-02）：契約公開頁。
      《應記載事項》要求有網站或社群者，應於網頁明顯處公告契約供消費者審閱；
      這頁不需要登入，可以放在官方 LINE 圖文選單、IG 簡介或店內 QR Code。
    -->
    <script src="/liff/contract-loader.js?v=1"></script>
    <style>
      :root { --ink: #26332b; --mute: #6b645c; --line: #dbd3c4; --bg: #f6f2ea; --paper: #fbf9f5; }
      body { margin: 0; background: var(--bg); color: var(--mute); font-family: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
      h1 { font-size: 20px; color: var(--ink); margin: 0 0 6px; }
      .meta { font-size: 13px; margin-bottom: 14px; }
      .box { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; font-size: 14px; line-height: 1.85; }
      .box p { margin: 0 0 10px; }
      .actions { margin-top: 14px; font-size: 13px; }
      button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); cursor: pointer; }
      @media print { .actions { display: none; } body { background: #fff; } .box { border: 0; } }
    </style>
  </head>
  <body>
    <main>
      <h1>犬、貓美容服務定型化契約</h1>
      <div class="meta">慕沐村寵物美容　·　版本 <span id="ver">—</span>　·　預約前請先詳閱，審閱期間不少於一日</div>
      <div class="box" id="contractBodyHolder"></div>
      <div class="actions"><button type="button" onclick="window.print()">列印／另存 PDF</button></div>
    </main>
    <script>
      MulageContract.load(document.getElementById("contractBodyHolder")).then(function (v) {
        document.getElementById("ver").textContent = v || "—";
      });
    </script>
  </body>
</html>
