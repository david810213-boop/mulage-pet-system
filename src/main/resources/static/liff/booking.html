    <link rel="stylesheet" href="/liff/liff-theme.css" />
    <style>
      /* ---- 這頁專屬的補充樣式（結構元件在 liff-theme.css，以下是 JS 會產生的
             .form-card / .item-row / .slot-btn 等 class 的實際外觀）---- */
      body {
        padding-bottom: 100px;
      }

      .form-card {
        margin: 0 20px 16px;
        background: #fff;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        padding: 18px 18px 16px;
        box-shadow: var(--shadow-card);
      }
      .form-card h3 {
        font-family: "Noto Serif TC", serif;
        font-size: 14px;
        font-weight: 600;
        color: var(--primary-deep);
        letter-spacing: 1px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .field {
        margin-bottom: 16px;
      }
      .field:last-child {
        margin-bottom: 0;
      }
      .field label {
        display: block;
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: var(--ink-soft);
        margin-bottom: 7px;
        text-transform: none;
      }
      .field label .req {
        color: var(--cancel-fg);
        margin-left: 2px;
      }
      .field select,
      .field input[type="date"] {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-sm);
        font-size: 14.5px;
        font-family: "Noto Sans TC", sans-serif;
        color: var(--ink);
        background: #fffefd;
        outline: none;
        transition: border-color 0.15s;
      }
      .field select:focus,
      .field input:focus {
        border-color: var(--wood);
      }

      .pet-empty-hint {
        font-size: 12.5px;
        color: var(--cancel-fg);
        background: var(--cancel-bg);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
      }
      .pet-empty-hint a {
        color: var(--cancel-fg);
        font-weight: 700;
      }

      /* 時段選擇 */
      .slots-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
      }
      .slot-btn {
        padding: 11px 8px;
        border: 1.5px solid var(--line-soft);
        border-radius: var(--radius-sm);
        text-align: center;
        font-size: 13.5px;
        font-family: "Noto Sans TC", sans-serif;
        cursor: pointer;
        transition: all 0.15s;
        color: var(--ink-soft);
        background: #fff;
      }
      .slot-btn.selected {
        border-color: var(--wood);
        background: var(--paper-2);
        color: var(--primary-deep);
        font-weight: 700;
      }
      .slot-btn.unavailable {
        background: var(--paper-2);
        color: var(--ink-faint);
        text-decoration: line-through;
        cursor: not-allowed;
        border-color: var(--line-soft);
      }
      .slots-hint {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        color: var(--ink-faint);
        margin-top: 9px;
        letter-spacing: 0.3px;
      }
      .slots-loading,
      .slots-empty {
        text-align: center;
        padding: 20px;
        color: var(--ink-faint);
        font-family: "Jost", sans-serif;
        font-size: 12px;
      }

      /* 服務項目 */
      .item-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      .item-row:last-child {
        border-bottom: none;
      }
      .item-check {
        display: flex;
        align-items: center;
        gap: 11px;
        flex: 1;
        cursor: pointer;
      }
      .item-check input[type="checkbox"] {
        width: 19px;
        height: 19px;
        accent-color: var(--wood);
        flex-shrink: 0;
      }
      .item-name {
        font-size: 13.5px;
        color: var(--ink);
        font-weight: 600;
        font-family: "Noto Serif TC", serif;
      }
      .item-desc {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        color: var(--ink-soft);
        margin-top: 3px;
      }
      .item-price {
        font-family: "Noto Serif TC", serif;
        font-size: 14px;
        color: var(--wood-deep);
        font-weight: 700;
        white-space: nowrap;
      }
      .item-recommend-tag {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 9px;
        background: var(--done-bg);
        color: var(--done-fg);
        font-size: 9.5px;
        border-radius: 999px;
        font-weight: 700;
        vertical-align: middle;
        font-family: "Jost", sans-serif;
      }

      /* 總金額固定底部 */
      .summary-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        box-shadow: 0 -6px 18px rgba(58, 77, 63, 0.1);
        padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 12px;
        border-top: 1px solid var(--line-soft);
      }
      .summary-total {
        flex-shrink: 0;
        font-family: "Jost", sans-serif;
        font-size: 9.5px;
        color: var(--ink-soft);
        letter-spacing: 0.5px;
        text-transform: lowercase;
      }
      .summary-total .amount {
        display: block;
        font-family: "Noto Serif TC", serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--primary-deep);
        margin-top: 2px;
      }
      .submit-btn {
        flex: 1;
        padding: 14px;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        color: #3a2d16;
        border: none;
        border-radius: 999px;
        font-family: "Jost", sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(198, 160, 99, 0.4);
        transition: opacity 0.2s;
      }
      .submit-btn:active {
        opacity: 0.85;
      }
      .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .toast {
        position: fixed;
        bottom: 96px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary-deep);
        color: #fff;
        padding: 12px 22px;
        border-radius: 999px;
        font-family: "Noto Sans TC", sans-serif;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        white-space: nowrap;
        max-width: 90vw;
        z-index: 999;
        box-shadow: 0 8px 20px rgba(38, 51, 43, 0.3);
      }
      .toast.show {
        opacity: 1;
      }
      .toast.success {
        background: var(--forest);
      }
      .toast.error {
        background: #8b3a3a;
      }

      .loading-page {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-faint);
        font-family: "Jost", sans-serif;
        font-size: 12px;
      }

      .fab-home {
        position: fixed;
        left: 50%;
        bottom: 92px;
        transform: translateX(-50%);
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: var(--primary-deep);
        box-shadow: 0 8px 18px rgba(38, 51, 43, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 500;
        border: 2px solid var(--gold);
      }
      .fab-home-icon {
        font-size: 18px;
        line-height: 1;
      }
      .fab-home:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="idband">
      <span><span class="dot"></span>mulage pet</span>
      <span>預約美容</span>
    </div>

    <div class="page-head">
      <a class="back" href="/liff/index.html">‹</a>
      <div class="titles">
        <div class="cn">預約美容</div>
        <div class="en">reserve a visit</div>
      </div>
    </div>

    <a href="/liff/index.html" class="fab-home" aria-label="返回首頁">
      <span class="fab-home-icon">🏠</span>
    </a>

    <div id="app"><div class="loading-page">載入中...</div></div>

    <div class="toast" id="toast"></div>

    <script>
      const LIFF_ID = "2010567973-qojKbVxl";
      let jwtToken = null;
      let myPets = [];
      let groomingItems = [];
      let selectedPetId = null;
      let selectedDate = null;
      let selectedSlot = null; // { startTime, endTime }
      let closedDatesCache = null; // 需求 16：公休日清單快取（本次頁面停留期間有效）

      // 資安修正：寵物名稱/品種是顧客自己填的，服務項目名稱/描述雖然是店家設定，
      // 一律統一跳脫，插入 innerHTML 前先過一手，避免存放型 XSS。
      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // 需求 16：抓取公休日清單（只抓一次，快取起來），回傳 Set<string> 方便查詢
      async function loadClosedDates() {
        if (closedDatesCache) return closedDatesCache;
        try {
          const res = await fetch("/api/appointments/closed-dates", {
            headers: authHeaders(),
          });
          const list = res.ok ? await res.json() : [];
          closedDatesCache = new Set(list);
        } catch (e) {
          closedDatesCache = new Set(); // 查詢失敗就當作沒有公休日，退回原本行為，不阻擋預約流程
        }
        return closedDatesCache;
      }
      let selectedItemCodes = new Set();
      let currentLockedItemCode = null; // 目前鎖定套餐對應的 itemCode（給 currentTotal() 保底用）
      let currentLockedItemPrice = 0; // 目前鎖定套餐的金額（給 currentTotal() 保底用）
      let hasSigned = false;
      let signatureCanvas = null;
      let signatureCtx = null;
      let signatureDrawing = false;

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: window.location.href });
            return;
          }

          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true",
            },
            body: JSON.stringify({ idToken: liff.getIDToken() }),
          });
          const data = await res.json().catch(() => null);
          if (!res.ok) {
            renderError("登入失敗");
            return;
          }
          jwtToken = data?.token || data?.jwtToken || data?.accessToken;
          window.currentUserName = (data && data.user && data.user.name) || "";

          // 平行載入毛孩清單 + 美容項目清單
          const [pets, items] = await Promise.all([
            fetchMyPets(),
            fetchGroomingItems(),
          ]);
          myPets = pets;
          groomingItems = items;

          renderForm();

          // 需求（追加）：簽名檔要抓的 <img>/<p> 元素是 renderForm() 動態產生的 HTML，
          // 之前跟 fetchMyPets/fetchGroomingItems 一起 Promise.all 平行呼叫，
          // renderForm() 都還沒跑、DOM 裡根本還沒有這兩個元素，抓 getElementById 一定是 null，
          // 圖片永遠貼不上去。改成表單畫出來之後才呼叫。
          loadCompanySignature();
        } catch (e) {
          renderError("初始化失敗：" + e.message);
        }
      }

      // 需求 22：抓取乙方固定電子簽名檔，顯示在契約最下方
      async function loadCompanySignature() {
        try {
          // 需求（追加）修正：這支 API 實際掛在 PaymentMvcController（class 層級是
          // @RequestMapping("/payments")），正確路徑其實是 /payments/api/company-signature，
          // 之前寫成 /api/company-signature 一直是 404，簽名檔永遠貼不上去。
          const res = await fetch("/payments/api/company-signature", {
            headers: authHeaders(),
          });
          if (!res.ok) return;
          const data = await res.json();
          const img = document.getElementById("companySignatureImg");
          const fallback = document.getElementById("companySignatureFallback");
          if (data && data.signatureImage && img) {
            img.src = data.signatureImage;
            img.style.display = "block";
            if (fallback) fallback.style.display = "none";
          }
        } catch (e) {
          // 簽名檔載入失敗不影響整體預約流程，靜默失敗即可
        }
      }

      function authHeaders(extra) {
        return Object.assign(
          {
            Authorization: "Bearer " + jwtToken,
            "ngrok-skip-browser-warning": "true",
          },
          extra || {},
        );
      }

      async function fetchMyPets() {
        const res = await fetch("/api/pets/my", { headers: authHeaders() });
        if (!res.ok) throw new Error("取得毛孩清單失敗");
        return res.json();
      }

      async function fetchGroomingItems() {
        const res = await fetch("/api/grooming-items", {
          headers: authHeaders(),
        });
        if (!res.ok) throw new Error("取得服務項目失敗");
        return res.json();
      }

      function renderError(msg) {
        document.getElementById("app").innerHTML =
          '<div class="loading-page" style="color:#8B0000">' + msg + "</div>";
      }

      // 需求（追加，2026-08-30）：不開放顧客當天自己在 LIFF 提出預約申請，
      // 日期選擇器最早只能選明天，並在下方顯示提示文字引導改用 LINE/電話聯繫。
      function tomorrowStr() {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function renderForm() {
        const app = document.getElementById("app");

        if (!myPets.length) {
          app.innerHTML = `
        <div class="form-card">
          <div class="pet-empty-hint">
            尚未新增任何毛孩，請先<a href="/liff/add-pet.html">新增毛孩</a>後再進行預約。
          </div>
        </div>`;
          return;
        }

        app.innerHTML = `
      <div class="form-card">
        <h3>𖥸 選擇毛孩</h3>
        <div class="field">
          <label>預約毛孩 <span class="req">*</span></label>
          <select id="petSelect" onchange="onPetChange()">
            <option value="">請選擇毛孩</option>
            ${myPets.map((p) => `<option value="${p.id}">${escapeHtml(p.name)}（${escapeHtml(p.breed)}）</option>`).join("")}
          </select>
        </div>
      </div>

      <div class="form-card">
        <h3>𖥸 選擇日期與時段</h3>
        <div class="field">
          <label>預約日期 <span class="req">*</span></label>
          <input type="date" id="dateInput" min="${tomorrowStr()}" onchange="onDateChange()" />
          <div style="font-size:12px; color:#8a6d3b; margin-top:6px; line-height:1.6;">
            ⚠️ 不開放當天提出預約申請，如需要預約當日，請直接聯繫官方 LINE 或致電 0902-301-820
          </div>
        </div>
        <div class="field" id="slotsField" style="display:none">
          <label>可預約時段 <span class="req">*</span></label>
          <div id="slotsContainer"><div class="slots-loading">載入時段中...</div></div>
        </div>
      </div>

      <div class="form-card">
        <h3>𖥸 選擇服務項目</h3>
        <div id="dogLockedBanner" style="display:none; background:#FDF3E3; border:1px solid #E4CFA0; border-radius:8px; padding:10px 12px; font-size:13px; margin-bottom:12px;"></div>
        <div id="itemsContainer">
          ${
            groomingItems.length
              ? groomingItems.map(itemRowHtml).join("")
              : '<div class="slots-empty">目前無可預約的服務項目</div>'
          }
        </div>
      </div>

      <div class="form-card">
        <h3>𖥸 犬、貓美容服務定型化契約書</h3>
        <div id="contractBox" style="
          background: #FBF9F5;
          border: 1px solid #DBD3C4;
          border-radius: 8px;
          padding: 14px 16px;
          max-height: 320px;
          overflow-y: auto;
          font-size: 12px;
          line-height: 1.8;
          color: #6b645c; font-family:'Noto Sans TC',sans-serif;">
          <p style="font-weight:700; color:#26332B; margin-bottom:2px;">乙方（企業經營者）基本資料</p>
          <p style="margin-top:0;">店名：慕沐村寵物美容　統一編號：92739223　負責人：洪薪茹<br />
          店內電話：0902-301-820　電子信箱：mulagepet@gmail.com<br />
          官方IG：mulage_pet　官方LINE@：@108dbaxm<br />
          營業時間：11:00–19:30　固定公休：週四、週五（採全預約制）<br />
          地址：新北市三重區三信路35號1樓</p>

          <p style="font-weight:700; color:#26332B; margin: 10px 0 2px;">乙方合作動物醫院（緊急送醫優先送往下列其一）</p>
          <p style="margin-top:0;">
          配合醫院一：台大頑皮動物醫院　電話：(02)2857-3578　地址：新北市三重區三賢街197號
          </p>

          <p style="font-weight:700; color:#26332B; margin: 12px 0 6px;">立契約書人：消費者（以下簡稱甲方）／企業經營者：慕沐村寵物美容（以下簡稱乙方）</p>
          <p>茲為犬、貓美容服務事宜，雙方同意依據農業部公告之《犬、貓美容服務定型化契約應記載及不得記載事項》及《消費者保護法》等相關規定，訂定本契約條款如下：</p>

          <p><strong>第一條（契約目的與範圍）</strong><br />
          犬、貓美容服務，指提供犬、貓外表部位清洗或清潔、吹乾梳毛、毛髮修剪及造型設計等美容服務之行為。但不得涉及動物醫療行為及宣稱醫療效能。</p>

          <p><strong>第二條（資訊揭露義務）</strong><br />
          一、乙方應至少以半開大小以上紙張或以電子方式，將本契約公告於營業櫃台或場所明顯處；有設置網站或經營社群媒體者，並應於網頁明顯處公告，供甲方審閱。<br />
          二、本契約屬單次服務型契約，甲方已獲得合理審閱期一日以上。</p>

          <p><strong>第三條（基本資料、風險詢問及聲明同意）</strong><br />
          一、本契約應記載之寵物、甲方及乙方之基本資料，包括但不限於姓名、聯絡電話、地址、寵物晶片號碼、緊急聯絡人及指定獸醫診療機構等，詳如本契約附件之「犬、貓美容服務簽約前詢問事項及基本資料表」。<br />
          二、乙方於訂約前，應依前項資料表及相關附件，向甲方詢問犬、貓之年齡、健康狀況、疾病史、個性、是否具攻擊性、過往美容經驗或其他可能影響美容服務安全之情形。<br />
          三、甲方確認，已就其所知悉之犬、貓相關資訊，向乙方為完整且真實之告知，並同意就犬、貓屬幼齡、高齡、患有疾病或具攻擊性等高風險情形，另行簽署或確認高風險美容服務風險告知暨同意聲明；該等聲明之簽署或未簽署，不影響乙方依法應負之責任。<br />
          四、前述【犬、貓美容服務簽約前詢問事項及基本資料表】、【高風險美容服務風險告知暨同意聲明】及【特殊處理項目通知暨加價同意書】等其他相關附件，均視為本契約之一部分，與本契約具有同一效力。</p>

          <p><strong>第四條（服務內容、費用揭示及加價服務之說明與確認）</strong><br />
          一、乙方應於訂約前，向甲方充分說明本契約所提供之犬、貓美容服務內容，包括服務項目、次數、期間、費用。<br />

          三、甲方知悉，犬、貓美容服務之實際費用，可能因犬、貓之實際狀況而有所調整，包括但不限於：（一）體型大小、毛長、毛量；（二）毛況（如嚴重打結、廢毛堆積）；（三）年齡、健康狀況；（四）行為表現與配合程度；（五）其他基於犬、貓安全或美容必要性之因素。<br />
          四、如因前項情形，需調整原約定費用或提供原約定服務項目以外之加價服務（包括但不限於打結處理、剃毛、除廢毛、寄生蟲處理或其他特殊處理），乙方應於服務開始前，向甲方說明調整或加價之原因、服務內容及費用金額，並經甲方明確同意後，始得提供服務並收取費用。<br />
          五、前項實際報價及甲方同意內容，得以書面、電子表單或其他可供事後查證之方式記錄，並由甲方簽名、勾選或填寫確認，作為雙方合意之依據。<br />

          <p><strong>第五條（服務判斷及照護義務）</strong><br />

      // 需求（追加，2026-08-24）：狗狗定價流程簡化——JS 端鏡射後端
      // DogWeightTier 的體重級距邊界，用來篩選菜單。跟後端同一套規則：
      // 落在整數空隙的體重就近進位到下一級距，超過 33kg 歸進最高級距。
      function computeDogWeightTier(weight) {
        const tiers = [
          { code: "SMALL", max: 5 },
          { code: "MEDIUM_SMALL", max: 10 },
          { code: "MEDIUM", max: 16 },
          { code: "MEDIUM_LARGE", max: 22 },
          { code: "LARGE", max: 27 },
          { code: "EXTRA_LARGE", max: Infinity },
        ];
        for (const tier of tiers) {
          if (weight <= tier.max) return tier.code;
        }
        return "EXTRA_LARGE";
      }

      // 需求（追加，2026-08-26）：假日限定套餐——固定週六、週日算假日（跟後端
      // AppointmentService 判斷邏輯一致）。用字串直接組 Date 物件避免時區
      // 轉換造成日期跑掉（"2026-08-30" 這種純日期字串在部分瀏覽器會被當成
      // UTC 午夜解析，跨到前一天，所以拆開年月日自己組本地時間的 Date）。
      function isHolidayDate(dateStr) {
        if (!dateStr) return false;
        const [y, m, d] = dateStr.split("-").map(Number);
        const day = new Date(y, m - 1, d).getDay(); // 0=週日, 6=週六
        return day === 0 || day === 6;
      }

          </div>
        </label>
        <div class="item-price">$${item.price}</div>
      </div>`;
      }

      function onPetChange() {
        const sel = document.getElementById("petSelect");
        selectedPetId = sel.value || null;

        // 依所選毛孩自動勾選建議服務項目
        const pet = myPets.find((p) => String(p.id) === String(selectedPetId));
        selectedItemCodes.clear();
        if (pet && pet.recommendedItemCodes) {
          pet.recommendedItemCodes.forEach((code) =>
            selectedItemCodes.add(code),
          );
        }

        // 需求（追加）：僅限既有客戶／適用物種，不符合資格的項目整列隱藏（連同勾選一起清掉）
        const isExisting = !!(pet && pet.isExistingCustomer);
        const petType =
          pet && pet.petType ? String(pet.petType).toUpperCase() : null;
        // 需求（追加，菜單簡化）：貓咪依品種自動判斷的毛髮分類（單層毛/雙層毛/長毛），
        // 只顯示對應分類的套餐項目。這隻貓的分類是 null 的話（特殊貓種、品種不在
        // 對照表裡），不篩選、顯示全部貓咪項目——讓店家人工協助這位顧客判斷，
        // 不會因為系統判斷不出來就擋住預約或漏掉選項。
        const catCoatCategory =
          pet && petType === "CAT" ? pet.catCoatCategory || null : null;

        // 需求（追加，2026-08-24）：狗狗定價流程簡化。
        // 已鎖定固定套餐：只顯示那一項套餐（自動勾選），其餘體重級距項目全部隱藏；
        // 還沒鎖定：依這隻狗目前的體重篩出對應級距，只顯示那 6 項（短毛/長毛×3等級）。
        // 不受影響：沒有標 dogWeightTier 的項目（通用加購），維持原本篩選邏輯不變。
        const isDog = petType === "DOG";
        const dogLockedItemId =
          isDog && pet ? pet.lockedGroomingItemId || null : null;
        const dogWeightTier =
          isDog && pet && !dogLockedItemId
            ? computeDogWeightTier(pet.weight)
            : null;

        // 需求（追加，2026-08-26）：假日（固定週六、週日）限定只能選完整套餐，
        // 通用單項加購（沒有副組成的項目，例如指甲修剪、貓咪基礎保養）整列隱藏，
        // 逼客人只能從套餐裡選——這條規則只影響顧客自己在 LIFF 預約，店員
        // 現場開單/核對時不受這條限制，維持原本可以自由加選單項的彈性。
        // 需求（2026-08-26 修正）：不在畫面上明講這條規則（店家不希望顧客知道
        // 假日只能選套餐是刻意的機制），單純把不符合的項目隱藏，不額外顯示提示文字。
        const isHoliday = isHolidayDate(selectedDate);

        // 已鎖定的話，畫面上方顯示固定套餐卡片，並自動把該項目勾選起來。
        // 直接從記憶體裡的 groomingItems 清單找出對應項目（用 id 比對），
        // 不依賴 DOM 列表的渲染狀態，比較不會受畫面篩選/隱藏邏輯影響。
        const lockedItem = dogLockedItemId
          ? groomingItems.find(
              (it) => String(it.id) === String(dogLockedItemId),
            )
          : null;

        const lockedBanner = document.getElementById("dogLockedBanner");
        if (dogLockedItemId && pet.lockedItemName) {
          const lockedName = lockedItem ? lockedItem.name : pet.lockedItemName;
          const lockedPrice = lockedItem
            ? lockedItem.price
            : pet.lockedItemPrice;
          if (lockedBanner) {
            lockedBanner.style.display = "block";
            lockedBanner.innerHTML = `已為毛孩安排固定套餐：<strong>${escapeHtml(lockedName)}</strong>　$${lockedPrice}`;
          }
          selectedItemCodes.clear();
          if (lockedItem) {
            selectedItemCodes.add(lockedItem.itemCode);
          }
          currentLockedItemCode = lockedItem ? lockedItem.itemCode : null;
          currentLockedItemPrice = lockedPrice || 0;
        } else {
          if (lockedBanner) lockedBanner.style.display = "none";
          currentLockedItemCode = null;
          currentLockedItemPrice = 0;
        }

        document
          .getElementById("itemsContainer")
          .querySelectorAll(".item-row")
          .forEach((row) => {
            const requiresExisting = row.dataset.requiresExisting === "true";
            const applicable = row.dataset.applicablePetType || "";
            const itemCoatCategory = row.dataset.catCoatCategory || "";
            const itemDogTier = row.dataset.dogWeightTier || "";
            const isPackage = row.dataset.isPackage === "true";
            const itemId = row.dataset.itemId;
            const cb = row.querySelector("input[type=checkbox]");
            const blockedByExisting = requiresExisting && !isExisting;
            const blockedBySpecies =
              applicable && petType && applicable !== petType;
            const blockedByCoat =
              itemCoatCategory &&
              catCoatCategory &&
              itemCoatCategory !== catCoatCategory;
            // 假日只能選套餐：非套餐項目（沒有副組成）在假日整列隱藏。
            const blockedByHoliday = isHoliday && !isPackage;
            // 只有「有標體重級距」的項目（DOG 主力套餐）才受這條規則影響，
            // 通用加購項目（itemDogTier 是空字串）不受影響。
            let blockedByDogTier = false;
            if (itemDogTier) {
              if (dogLockedItemId) {
                blockedByDogTier = String(itemId) !== String(dogLockedItemId);
              } else if (dogWeightTier) {
                blockedByDogTier = itemDogTier !== dogWeightTier;
              }
            }
            if (
              blockedByExisting ||
              blockedBySpecies ||
              blockedByCoat ||
              blockedByDogTier ||
              blockedByHoliday
            ) {
              row.style.display = "none";
              if (cb) cb.checked = false;
            } else {
              row.style.display = "";
              // 已鎖定套餐的那一項，畫面重畫後自動勾選（避免每次切換毛孩都要手動點）
              if (
                dogLockedItemId &&
                String(itemId) === String(dogLockedItemId) &&
                cb
              ) {
                cb.checked = true;
                selectedItemCodes.add(cb.value);
              }
            }
          });

        document
          .getElementById("itemsContainer")
          .querySelectorAll("input[type=checkbox]")
          .forEach((cb) => {
            cb.checked = selectedItemCodes.has(cb.value);
          });

        renderSummaryBar();
      }

      async function onDateChange() {
        const dateInput = document.getElementById("dateInput");
        selectedDate = dateInput.value;
        selectedSlot = null;

        // 需求（追加，2026-08-26）：日期改變會影響「是不是假日」，連帶影響
        // 服務項目菜單（假日只能選套餐），日期一變就要重新跑一次項目篩選邏輯，
        // 不能只在選毛孩的時候才篩選一次。
        if (selectedPetId) onPetChange();

        const slotsField = document.getElementById("slotsField");
        const container = document.getElementById("slotsContainer");
        if (!selectedDate) {
          slotsField.style.display = "none";
          return;
        }

        slotsField.style.display = "block";
        container.innerHTML = '<div class="slots-loading">載入時段中...</div>';

        // 需求（追加，2026-08-31）：不能只靠日期選擇器的 min 屬性擋今天——
        // LINE 內建瀏覽器（LIFF webview）不完全可靠，同一台測試手機實測發現
        // 還是選得到今天。這裡加一層 JS 防呆，選到今天直接明確提示，不用
        // 等送出預約後才被後端擋下來、顯示不夠明確的錯誤。
        const todayStrCheck = (() => {
          const d = new Date();
          const y = d.getFullYear();
          const m = String(d.getMonth() + 1).padStart(2, "0");
          const day = String(d.getDate()).padStart(2, "0");
          return `${y}-${m}-${day}`;
        })();
        if (selectedDate === todayStrCheck) {
          container.innerHTML =
            '<div class="slots-empty">⚠️ 不開放當天提出預約申請，如需要預約當日，請直接聯繫官方 LINE 或致電 0902-301-820</div>';
          return;
        }

        try {
          // 需求 16：先檢查是否為公休日，是的話直接提示，不用等 /slots 回傳空清單
          const closedDates = await loadClosedDates();
          if (closedDates.has(selectedDate)) {
            container.innerHTML =
              '<div class="slots-empty">🚫 當天為公休日，恕不開放預約，請選擇其他日期</div>';
            return;
          }

          const res = await fetch(
            "/api/appointments/slots?date=" + selectedDate,
            { headers: authHeaders() },
          );
          if (!res.ok) throw new Error("HTTP " + res.status);
          const slots = await res.json();

          if (!slots.length) {
            container.innerHTML =
              '<div class="slots-empty">當天無可預約時段</div>';
            return;
          }

          // 需求（追加，2026-08-26）：選的日期如果是今天，已經過去的時段自動
          // 標成不可選（用時段的「開始時間」判斷，只要開始時間已經過了現在，
          // 就不該再讓人預約——即使還沒到結束時間也一樣，因為到店的時間已經
          // 來不及了）。用瀏覽器當下的本地時間比對，這個系統本來就是給台灣
          // 店家用，時區不用額外處理。
          const isToday = (() => {
            const now = new Date();
            const todayStr =
              now.getFullYear() +
              "-" +
              String(now.getMonth() + 1).padStart(2, "0") +
              "-" +
              String(now.getDate()).padStart(2, "0");
            return selectedDate === todayStr;
          })();
          const nowMinutes = (() => {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
          })();
          const isPast = (startTime) => {
            if (!isToday) return false;
            const [h, m] = startTime.split(":").map(Number);
            return h * 60 + m <= nowMinutes;
          };

          container.innerHTML = `
        <div class="slots-grid">
          ${slots
            .map((s, i) => {
              const past = isPast(s.startTime);
              const available = s.available && !past;
              return `
            <div class="slot-btn ${available ? "" : "unavailable"}"
                 data-start="${s.startTime}" data-end="${s.endTime}"
                 onclick="${available ? `onSlotClick(this, '${s.startTime}', '${s.endTime}')` : ""}">
              ${s.startTime.substring(0, 5)}${past ? "（已過時段）" : ""}
            </div>`;
            })
            .join("")}
        </div>
        <div class="slots-hint">灰色時段已被預約或時間已過，請選擇其他時段</div>
      `;
        } catch (e) {
          container.innerHTML =
            '<div class="slots-empty" style="color:#8B0000">載入時段失敗：' +
            e.message +
            "</div>";
        }
      }

      function onSlotClick(el, start, end) {
        document
          .querySelectorAll(".slot-btn")
          .forEach((b) => b.classList.remove("selected"));
        el.classList.add("selected");
        selectedSlot = { startTime: start, endTime: end };
        renderSummaryBar();
      }

      function onItemToggle(e) {
        const code = e.target.value;
        if (e.target.checked) selectedItemCodes.add(code);
        else selectedItemCodes.delete(code);
        renderSummaryBar();
      }

      function setupSignaturePad() {
        signatureCanvas = document.getElementById("signaturePad");
        if (!signatureCanvas) return;
        signatureCtx = signatureCanvas.getContext("2d");
        hasSigned = false;

        function resize() {
          const rect = signatureCanvas.getBoundingClientRect();
          const ratio = window.devicePixelRatio || 1;
          signatureCanvas.width = rect.width * ratio;
          signatureCanvas.height = rect.height * ratio;
          signatureCtx.scale(ratio, ratio);
          signatureCtx.lineWidth = 2.2;
          signatureCtx.lineCap = "round";
          signatureCtx.lineJoin = "round";
          signatureCtx.strokeStyle = "#26332B";
        }
        resize();
        window.addEventListener("resize", resize);

        function getPos(evt) {
          const rect = signatureCanvas.getBoundingClientRect();
          if (evt.touches && evt.touches.length > 0) {
            return {
              x: evt.touches[0].clientX - rect.left,
              y: evt.touches[0].clientY - rect.top,
            };
          }
          return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
        }

        function start(evt) {
          evt.preventDefault();
          signatureDrawing = true;
          const ph = document.getElementById("signaturePlaceholder");
          if (ph) ph.style.display = "none";
          const pos = getPos(evt);
          signatureCtx.beginPath();
          signatureCtx.moveTo(pos.x, pos.y);
        }

        function move(evt) {
          if (!signatureDrawing) return;
          evt.preventDefault();
          const pos = getPos(evt);
          signatureCtx.lineTo(pos.x, pos.y);
          signatureCtx.stroke();
          hasSigned = true;
          updateSignatureHint();
        }

        function end() {
          signatureDrawing = false;
        }

        signatureCanvas.addEventListener("mousedown", start);
        signatureCanvas.addEventListener("mousemove", move);
        window.addEventListener("mouseup", end);
        signatureCanvas.addEventListener("touchstart", start, {
          passive: false,
        });
        signatureCanvas.addEventListener("touchmove", move, { passive: false });
        signatureCanvas.addEventListener("touchend", end);
      }

      function clearSignature() {
        if (!signatureCanvas || !signatureCtx) return;
        signatureCtx.clearRect(
          0,
          0,
          signatureCanvas.width,
          signatureCanvas.height,
        );
        const ph = document.getElementById("signaturePlaceholder");
        if (ph) ph.style.display = "block";
        hasSigned = false;
        updateSignatureHint();
      }

      function updateSignatureHint() {
        const hint = document.getElementById("signatureHint");
        if (!hint) return;
        if (hasSigned) {
          hint.style.color = "#2D5A27";
          hint.textContent = "✓ 已完成簽名";
        } else {
          hint.style.color = "#a29a8c";
          hint.textContent = "簽名須為親筆手寫，系統才會受理此預約";
        }
      }

      function onContractAgreeChange() {
        // 目前無額外動作，送出時會統一檢查 checkbox 狀態
      }

      function currentTotal() {
        let total = 0;
        let lockedCounted = false;
        document
          .querySelectorAll("#itemsContainer input[type=checkbox]:checked")
          .forEach((cb) => {
            total += parseFloat(cb.dataset.price) || 0;
            if (currentLockedItemCode && cb.value === currentLockedItemCode) {
              lockedCounted = true;
            }
          });
        // 保底：固定套餐項目若因故沒有對應到清單裡的 checkbox（找不到該筆項目），
        // 仍然把鎖定套餐的金額加回總金額，避免畫面顯示 $0。
        if (currentLockedItemPrice && !lockedCounted) {
          total += currentLockedItemPrice;
        }
        return total;
      }

      function renderSummaryBar() {
        let bar = document.getElementById("summaryBar");
        if (!bar) {
          bar = document.createElement("div");
          bar.className = "summary-bar";
          bar.id = "summaryBar";
          document.body.appendChild(bar);
        }
        const total = currentTotal();
        bar.innerHTML = `
      <div class="summary-total">總金額<br><span class="amount">$${total}</span></div>
      <button class="submit-btn" id="submitBtn" onclick="submitBooking()">確認預約</button>
    `;
      }

      async function submitBooking() {
        if (!selectedPetId) {
          showToast("請選擇毛孩", "error");
          return;
        }
        if (!selectedDate) {
          showToast("請選擇預約日期", "error");
          return;
        }
        if (!selectedSlot) {
          showToast("請選擇預約時段", "error");
          return;
        }
        if (!selectedItemCodes.size) {
          showToast("請至少選擇一項服務", "error");
          return;
        }

        const agreeBox = document.getElementById("contractAgree");
        if (!agreeBox || !agreeBox.checked) {
          showToast("請詳閱並同意定型化契約", "error");
          return;
        }
        if (!hasSigned) {
          showToast("請在簽名板上完成簽名", "error");
          return;
        }

        const contractSignatureData = signatureCanvas.toDataURL("image/png");

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "送出中...";

        try {
          const res = await fetch("/api/appointments", {
            method: "POST",
            headers: authHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({
              petId: selectedPetId,
              date: selectedDate,
              startTime: selectedSlot.startTime,
              endTime: selectedSlot.endTime,
              selectedItems: Array.from(selectedItemCodes),
              contractSignatureData: contractSignatureData,
            }),
          });

          // 需求（追加，2026-08-31）：後端回傳的錯誤是純文字（不是 JSON），
          // 用 res.json() 解析純文字會拋例外被 .catch() 吞掉，導致畫面只顯示
          // 寫死的 res.status（例如「400」），看不到真正的錯誤原因——這是專案
          // 疑難排解文件裡早就記過的同一個坑，這裡補上正確做法：先讀
          // res.text()，能解析成 JSON 才當 JSON 用，不然直接顯示純文字本身。
          const rawBody = await res.text();
          let data = null;
          try {
            data = JSON.parse(rawBody);
          } catch (e) {
            data = rawBody;
          }
          if (!res.ok) {
            showToast(
              "預約失敗：" +
                (typeof data === "string"
                  ? data
                  : (data && data.message) || res.status),
              "error",
            );
            return;
          }

          // 需求（2026-08-26）：每一筆預約送出成功後都要跳彈窗說明「還沒完成，
          // 等店家確認」，不能讓顧客誤以為送出=預約成功；如果是這隻毛孩第一次
          // 消費，額外加一段「線上報價僅供參考」的提醒——兩則訊息合併成同一個
          // 彈窗，不要疊兩個彈窗造成困擾。
          const bookedPet = myPets.find(
            (p) => String(p.id) === String(selectedPetId),
          );
          showBookingSubmittedModal(
            data.appointmentCode,
            bookedPet && !bookedPet.isExistingCustomer,
          );
          return;
        } catch (e) {
          showToast("網路錯誤，請重試", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "確認預約";
        }
      }

      function showToast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast show " + type;
        setTimeout(() => el.classList.remove("show"), 3000);
      }

      // 需求（追加，2026-08-26）：預約送出成功後的彈窗——一律顯示「還沒完成，
      // 等店家確認」，這隻毛孩如果是第一次消費，額外附上報價僅供參考的提醒。
      // 用彈窗（不是 toast）是因為這兩則訊息都重要、要確保顧客真的看到，
      // 點「我知道了」才會離開這頁去我的預約。
      function showBookingSubmittedModal(appointmentCode, isFirstVisit) {
        const modal = document.createElement("div");
        modal.style.cssText =
          "position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center;";
        modal.innerHTML = `
          <div style="background:white; border-radius:12px; padding:24px; max-width:340px; width:88%; text-align:center;">
            <div style="font-size:32px; margin-bottom:8px;">📋</div>
            <h3 style="margin:0 0 12px; font-size:16px;">預約已送出</h3>
            <p style="font-size:13.5px; color:#666; line-height:1.7; margin:0 0 12px;">
              預約編號 ${escapeHtml(appointmentCode)}<br />
              <strong>預約尚未完成，待店家確認中</strong>，請以收到店家確認訊息後為預訂成功。
            </p>
            ${
              isFirstVisit
                ? `<p style="font-size:13px; color:#8a6f3f; background:#FDF3E3; border-radius:8px; padding:10px; line-height:1.6; margin:0 0 20px; text-align:left;">
                    📋 初體驗線上預約報價僅供參考，實際金額以到店由專業美容師實際判斷寵物情況（毛況、體型、配合度等）後為主。
                  </p>`
                : `<div style="margin-bottom:20px;"></div>`
            }
            <button type="button" id="bookingSubmittedOkBtn" style="width:100%; padding:12px; border:none; border-radius:8px; font-size:14px; cursor:pointer; background:#c9a876; color:white; font-weight:600;">
              我知道了
            </button>
          </div>
        `;
        document.body.appendChild(modal);
        document
          .getElementById("bookingSubmittedOkBtn")
          .addEventListener("click", () => {
            window.location.href = "/liff/my-appointments.html";
          });
      }

      init();
    </script>
  </body>
