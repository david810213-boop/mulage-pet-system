<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>慕沐村Mulage pet</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        background: #f8f5f0;
        min-height: 100vh;
      }
      .header {
        background: linear-gradient(135deg, #2c1810, #5c3d2e);
        color: #f5d49a;
        padding: 24px 16px 32px;
        text-align: center;
      }
      .header .logo {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 4px;
      }
      .header .greeting {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .header .sub {
        font-size: 12px;
        opacity: 0.75;
        margin-top: 6px;
      }

      /* 錢包摘要卡片 */
      .wallet-card {
        margin: -20px 16px 0;
        background: white;
        border-radius: 16px;
        padding: 18px 20px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-decoration: none;
        cursor: pointer;
      }
      .wallet-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .wallet-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c9a84c, #f5d49a);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
      }
      .wallet-tier {
        font-size: 12px;
        font-weight: 700;
        color: #c9a84c;
        margin-bottom: 2px;
      }
      .wallet-balance {
        font-size: 22px;
        font-weight: 700;
        color: #2c1810;
      }
      .wallet-arrow {
        color: #ccc;
        font-size: 18px;
      }

      /* 功能卡片區 */
      .section-title {
        margin: 24px 16px 10px;
        font-size: 13px;
        color: #999;
        font-weight: 600;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 0 16px;
      }
      .menu-card {
        background: white;
        border-radius: 14px;
        padding: 18px 14px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        text-decoration: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: opacity 0.15s;
      }
      .menu-card:active {
        opacity: 0.7;
      }
      .menu-card .icon {
        font-size: 28px;
      }
      .menu-card .title {
        font-size: 15px;
        font-weight: 700;
        color: #2c1810;
      }
      .menu-card .desc {
        font-size: 12px;
        color: #999;
      }
      .menu-card .badge {
        align-self: flex-start;
        margin-top: 2px;
        padding: 2px 10px;
        background: #fff3e0;
        color: #e65100;
        font-size: 11px;
        font-weight: 700;
        border-radius: 20px;
      }
      .menu-card .badge.zero {
        background: #f0f0f0;
        color: #999;
      }

      /* 全寬卡片（立即預約） */
      .cta-card {
        margin: 12px 16px 0;
        background: linear-gradient(135deg, #2c1810, #5c3d2e);
        border-radius: 14px;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-decoration: none;
        box-shadow: 0 4px 12px rgba(44, 24, 16, 0.25);
      }
      .cta-left {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .cta-icon {
        font-size: 26px;
      }
      .cta-title {
        color: #f5d49a;
        font-size: 16px;
        font-weight: 700;
      }
      .cta-desc {
        color: #d9bfa0;
        font-size: 12px;
        margin-top: 2px;
      }
      .cta-arrow {
        color: #f5d49a;
        font-size: 18px;
      }

      .loading-hint {
        text-align: center;
        color: #bbb;
        font-size: 12px;
        padding: 40px 0 60px;
      }

      .footer-space {
        height: 24px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">慕沐村 Mulage pet</div>
      <div class="greeting" id="greeting">您好 👋</div>
      <div class="sub">寵物美容線上會員中心</div>
    </div>

    <a class="wallet-card" href="/liff/wallet.html" id="walletCard">
      <div class="wallet-left">
        <div class="wallet-icon">💳</div>
        <div>
          <div class="wallet-tier" id="walletTier">會員錢包</div>
          <div class="wallet-balance" id="walletBalance">載入中...</div>
        </div>
      </div>
      <div class="wallet-arrow">›</div>
    </a>

    <a class="cta-card" href="/liff/booking.html">
      <div class="cta-left">
        <div class="cta-icon">📅</div>
        <div>
          <div class="cta-title">立即預約</div>
          <div class="cta-desc">為寶貝安排下一次美容時光</div>
        </div>
      </div>
      <div class="cta-arrow">›</div>
    </a>

    <div class="section-title">我的功能</div>

    <div class="menu-grid">
      <a class="menu-card" href="/liff/my-pets.html">
        <div class="icon">🐾</div>
        <div class="title">我的毛孩寶貝</div>
        <div class="desc">管理毛孩基本資料</div>
        <div class="badge zero" id="petsBadge">載入中</div>
      </a>

      <a class="menu-card" href="/liff/my-appointments.html">
        <div class="icon">📋</div>
        <div class="title">我的預約</div>
        <div class="desc">查看預約與消費紀錄</div>
        <div class="badge zero" id="apptBadge">載入中</div>
      </a>

      <a class="menu-card" href="/liff/add-pet.html">
        <div class="icon">➕</div>
        <div class="title">新增毛孩</div>
        <div class="desc">登記新的寶貝資料</div>
      </a>

      <a class="menu-card" href="/liff/wallet.html">
        <div class="icon">💰</div>
        <div class="title">會員錢包</div>
        <div class="desc">查看餘額與等級</div>
      </a>

      <a class="menu-card" href="/liff/my-profile.html">
        <div class="icon">📝</div>
        <div class="title">編輯我的資料</div>
        <div class="desc">年齡、職業等基本資料</div>
      </a>
    </div>

    <div class="footer-space"></div>

    <script>
      const LIFF_ID = "2010567973-ygHvpq7X";
      let jwtToken = null;

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true",
            },
            body: JSON.stringify({ idToken: liff.getIDToken() }),
          });

          const data = await res.json().catch(() => null);
          if (!res.ok) {
            setWalletError("登入失敗");
            return;
          }

          jwtToken = data?.token || data?.jwtToken || data?.accessToken;

          // 顯示 LINE 顯示名稱（若有取得個人資料權限）
          try {
            const profile = await liff.getProfile();
            if (profile && profile.displayName) {
              document.getElementById("greeting").textContent =
                profile.displayName + " 您好 👋";
            }
          } catch (e) {
            /* 沒有權限就維持預設問候語，不影響其他功能 */
          }

          // 平行載入錢包 / 毛孩數 / 預約數，互不阻塞
          loadWallet();
          loadPetsCount();
          loadAppointmentsCount();
        } catch (e) {
          setWalletError("初始化失敗");
        }
      }

      function authHeaders() {
        return {
          Authorization: "Bearer " + jwtToken,
          "ngrok-skip-browser-warning": "true",
        };
      }

      function tierLabelText(wallet) {
        if (!wallet.cardActive) return "尚未開卡";
        return wallet.cardTierLabel || "會員錢包";
      }

      async function loadWallet() {
        try {
          const res = await fetch("/api/wallet", { headers: authHeaders() });
          if (!res.ok) throw new Error();
          const wallet = await res.json();
          document.getElementById("walletTier").textContent =
            tierLabelText(wallet);
          document.getElementById("walletBalance").textContent =
            "$" + (wallet.balance || 0).toLocaleString();
        } catch (e) {
          setWalletError("點擊查看錢包");
        }
      }

      function setWalletError(msg) {
        document.getElementById("walletBalance").textContent = msg;
      }

      async function loadPetsCount() {
        const badge = document.getElementById("petsBadge");
        try {
          const res = await fetch("/api/pets/my", { headers: authHeaders() });
          if (!res.ok) throw new Error();
          const pets = await res.json();
          if (pets.length) {
            badge.textContent = "共 " + pets.length + " 隻";
            badge.classList.remove("zero");
          } else {
            badge.textContent = "尚未新增";
            badge.classList.add("zero");
          }
        } catch (e) {
          badge.textContent = "－";
        }
      }

      async function loadAppointmentsCount() {
        const badge = document.getElementById("apptBadge");
        try {
          const res = await fetch("/api/appointments/my", {
            headers: authHeaders(),
          });
          if (!res.ok) throw new Error();
          const list = await res.json();

          const today = todayStr();
          const now = new Date();
          const nowStr =
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0") +
            ":00";
          const upcoming = list.filter((a) => {
            if (a.date > today) return true;
            if (a.date < today) return false;
            return a.endTime > nowStr;
          });

          if (upcoming.length) {
            badge.textContent = upcoming.length + " 筆即將到來";
            badge.classList.remove("zero");
          } else {
            badge.textContent = "尚無預約";
            badge.classList.add("zero");
          }
        } catch (e) {
          badge.textContent = "－";
        }
      }

      function todayStr() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      init();
    </script>
  </body>
</html>
