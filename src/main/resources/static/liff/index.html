<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>慕沐村Mulage pet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="/liff/liff-config.js?v=1"></script>
    <style>
      /* 色票與字級：設計定案「慕沐村會員首頁改版提案 · 定案色票與字體」 */
      :root {
        --page: #faf7f2;
        --card: #ffffff;
        --line: #e3d6bf;
        --line-gold: #c9ae7e;
        --ink: #1f2621;
        --ink-soft: #5e5a52;
        --ink-gold: #6e5229;
        --link: #7e5f33;
        --avatar: #f1e9da;
        --chip-bg: #f4efe6;
        --hero: #9c846e;
        --hero-wave: #8d7765;
        --cream-a: #f3d79e;
        --cream-b: #f2e0d2;
        --apricot: #d98a6c;
        --nav-active: #c46347;
        --pending-bg: #fdf3e3;
        --pending-fg: #b87324;
        --booked-bg: #ebf2ea;
        --booked-fg: #4e6e4b;
        --due-bg: #fcece6;
        --due-fg: #c46347;
        --serif: "Noto Serif TC", "PingFang TC", serif;
        --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--page);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      .page {
        max-width: 480px;
        margin: 0 auto;
        padding: 18px 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      /* ── 頁首 ── */
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
      }
      .brand img {
        height: 76px;
        width: auto;
        display: block;
      }
      .brand-rule {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-rule span.l {
        flex: 1;
        height: 1px;
        background: var(--line-gold);
      }
      .brand-rule span.t {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 4px;
        color: var(--ink-gold);
        white-space: nowrap;
      }
      .greet-date {
        font-size: 13px;
        color: var(--ink-soft);
      }
      .greet h1 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 24px;
        line-height: 1.4;
        margin-top: 6px;
      }

      /* ── VIP 會員卡 ── */
      .vip {
        display: block;
        border-radius: 14px;
        padding: 6px;
        color: #4a3531;
        background: linear-gradient(180deg, #f2ebdc 0%, #f0dbd0 100%);
      }
      .vip-in {
        border: 1px solid var(--line-gold);
        border-radius: 10px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .vip-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .vip-row.bottom {
        align-items: flex-end;
      }
      .vip-tier {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 3px;
        color: var(--ink-gold);
      }
      .vip-state,
      .vip-label {
        font-size: 12px;
        color: var(--ink-soft);
      }
      .vip-balance {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 30px;
        line-height: 1.2;
        color: var(--ink);
      }
      .vip-link {
        font-size: 13px;
        color: var(--ink-gold);
        border-bottom: 1px solid var(--line-gold);
        padding-bottom: 2px;
      }

      /* ── 預約主視覺卡 ── */
      .cta {
        display: block;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 22px rgba(120, 98, 78, 0.3);
        background: var(--hero);
      }
      .cta-wave {
        position: relative;
        height: 30px;
      }
      .cta-wave svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .cta-body {
        padding: 2px 16px 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: #ffffff;
      }
      .cta-title {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 19px;
        line-height: 1.4;
        letter-spacing: 1px;
      }
      .cta-desc {
        font-size: 13px;
        line-height: 1.6;
      }
      .cta-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.28);
        padding-top: 10px;
      }
      .cta-slots {
        font-size: 14px;
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .cta-btn {
        background: linear-gradient(180deg, var(--cream-a), var(--cream-b));
        color: #3a2d16;
        font-size: 14px;
        font-weight: 700;
        padding: 10px 18px;
        border-radius: 999px;
        box-shadow: 0 4px 10px rgba(58, 45, 22, 0.18);
      }

      /* ── 區塊標題 ── */
      .sec {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .sec-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line-gold);
        padding-bottom: 8px;
      }
      .sec-head h2 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 18px;
        letter-spacing: 2px;
        color: var(--ink-gold);
      }
      .sec-head h2 small {
        font-family: var(--sans);
        font-weight: 400;
        font-size: 14px;
        letter-spacing: 0;
        color: var(--ink-soft);
        margin-left: 4px;
      }
      .sec-head a {
        font-size: 13px;
      }

      /* ── 共用 ── */
      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: var(--avatar);
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 19px;
        color: var(--ink-gold);
        overflow: hidden;
        flex-shrink: 0;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .avatar-icon {
        display: none;
        width: 62%;
        height: 62%;
      }
      .avatar.no-photo .avatar-icon {
        display: block;
      }
      .avatar-icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .chip {
        font-size: 12px;
        font-weight: 700;
        border-radius: 999px;
        padding: 2px 9px;
        white-space: nowrap;
      }
      .chip.pending {
        color: var(--pending-fg);
        background: var(--pending-bg);
      }
      .chip.booked {
        color: var(--booked-fg);
        background: var(--booked-bg);
      }
      .chip.due {
        color: var(--due-fg);
        background: var(--due-bg);
      }
      .chip.plain {
        color: var(--ink-gold);
        background: var(--avatar);
        font-weight: 500;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .empty {
        padding: 18px 16px;
        font-size: 13px;
        color: var(--ink-soft);
        text-align: center;
        line-height: 1.7;
      }

      /* ── 即將到來 ── */
      .appt {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        color: var(--ink);
      }
      .appt-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .appt-main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .appt-name {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .appt-name b {
        font-size: 16px;
      }
      .appt-items {
        font-size: 13px;
        color: var(--ink-soft);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .appt-when {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .when-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px 10px;
      }
      .appt-more {
        margin-left: auto;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .appt-deposit {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-top: 1px dashed #d9c6a3;
        padding-top: 12px;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .appt-deposit b {
        color: var(--ink);
      }
      .btn-apricot {
        font-size: 14px;
        font-weight: 700;
        color: #ffffff;
        background: var(--apricot);
        border-radius: 999px;
        padding: 8px 16px;
        white-space: nowrap;
      }

      /* ── 我的毛孩（左右滑動） ── */
      .pets {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        margin: 0 -20px;
        padding: 0 20px 4px;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .pets::-webkit-scrollbar {
        display: none;
      }
      .pet {
        flex: 0 0 152px;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
      }
      .pet-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }
      .pet .avatar {
        width: 46px;
        height: 46px;
        font-size: 18px;
        border: none;
      }
      .pet-name {
        font-size: 16px;
        font-weight: 700;
      }
      .pet-meta {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 2px;
      }
      .pet-note {
        font-size: 12px;
        color: var(--ink-soft);
        border-top: 1px solid #efe6d6;
        padding-top: 8px;
      }
      .pet-btn {
        text-align: center;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink);
        background: var(--chip-bg);
        border-radius: 10px;
        padding: 9px 0;
        margin-top: auto;
      }
      .pet-btn.primary {
        color: #ffffff;
        font-weight: 700;
        background: var(--apricot);
      }
      .pet.add {
        align-items: center;
        justify-content: center;
        border-style: dashed;
        border-color: var(--line-gold);
        color: var(--ink-gold);
        font-size: 14px;
        min-height: 200px;
      }

    </style>
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <img src="/liff/mulage-logo-mark.png" alt="慕沐村" />
        <div class="brand-rule" aria-hidden="true">
          <span class="l"></span><span class="t">MULAGE PET</span><span class="l"></span>
        </div>
      </header>

      <section class="greet">
        <div class="greet-date" id="greetDate"></div>
        <h1 id="greeting">您好</h1>
      </section>

      <a class="vip" href="/liff/wallet.html">
        <div class="vip-in">
          <div class="vip-row">
            <span class="vip-tier">MULAGE VIP</span>
            <span class="vip-state" id="walletTier">載入中</span>
          </div>
          <div class="vip-row bottom">
            <div>
              <div class="vip-label">儲值金餘額</div>
              <div class="vip-balance" id="walletBalance">—</div>
            </div>
            <span class="vip-link">儲值與明細 →</span>
          </div>
        </div>
      </a>

      <a class="cta" href="/liff/booking.html">
        <div class="cta-wave">
          <svg viewBox="0 0 320 40" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0,28 C60,12 110,36 180,22 C240,11 280,32 320,19 L320,0 L0,0 Z" fill="#8D7765" />
            <circle cx="270" cy="12" r="1.1" fill="#F3D79E" />
            <circle cx="250" cy="20" r="0.8" fill="#F3D79E" />
            <circle cx="288" cy="8" r="0.6" fill="#F3D79E" />
          </svg>
        </div>
        <div class="cta-body">
          <div class="cta-title">給毛孩一段<br />被溫柔以待的時光</div>
          <div class="cta-desc">日式按摩 · 草本洗護<br />六星級沐浴儀式，零烘箱作業</div>
          <div class="cta-foot">
            <span class="cta-slots">查看可預約時段</span>
            <span class="cta-btn">立即預約 →</span>
          </div>
        </div>
      </a>

      <section class="sec">
        <div class="sec-head">
          <h2>即將到來</h2>
          <a href="/liff/my-appointments.html" id="apptCountLink">我的預約 ›</a>
        </div>
        <div id="nextAppt" class="card"><div class="empty">載入中…</div></div>
      </section>

      <section class="sec">
        <div class="sec-head">
          <h2>我的毛孩<small id="petsCount"></small></h2>
          <a href="/liff/add-pet.html">＋ 新增毛孩</a>
        </div>
        <div class="pets" id="pets"><div class="card empty" style="flex: 1">載入中…</div></div>
      </section>
    </main>

    <script>
      const LIFF_ID = window.MULAGE_LIFF.index; // LIFF ID 集中在 /liff/liff-config.js
      // 距離上次服務超過這個天數、且沒有已排定的預約，毛孩卡片顯示「該洗澡囉」
      const BATH_REMINDER_DAYS = 30;
      const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
      let jwtToken = null;

      async function init() {
        renderGreeting(null);
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: window.location.href });
            return;
          }

          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true",
            },
            body: JSON.stringify({ idToken: liff.getIDToken() }),
          });
          const data = await readJson(res);
          if (!res.ok || !data) {
            setWalletError("登入失敗");
            return;
          }
          jwtToken = data.token || data.jwtToken || data.accessToken;

          // 顯示 LINE 顯示名稱（沒有個人資料權限就維持預設問候語）
          try {
            const profile = await liff.getProfile();
            if (profile && profile.displayName) renderGreeting(profile.displayName);
          } catch (e) {
            /* 不影響其他功能 */
          }

          // 錢包與「預約＋毛孩」平行載入；毛孩卡片要用預約紀錄判斷狀態，所以兩者一起抓
          loadWallet();
          loadAppointmentsAndPets();
        } catch (e) {
          setWalletError("初始化失敗");
        }
      }

      function authHeaders() {
        return {
          Authorization: "Bearer " + jwtToken,
          "ngrok-skip-browser-warning": "true",
        };
      }

      // 後端可能回傳純文字錯誤，先讀文字再嘗試解析
      async function readJson(res) {
        const raw = await res.text();
        try {
          return JSON.parse(raw);
        } catch (e) {
          return null;
        }
      }

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderGreeting(name) {
        const now = new Date();
        const h = now.getHours();
        const hello = h < 11 ? "早安" : h < 18 ? "午安" : "晚安";
        document.getElementById("greetDate").textContent =
          now.getMonth() + 1 + " 月 " + now.getDate() + " 日 週" + WEEKDAYS[now.getDay()];
        document.getElementById("greeting").textContent = name ? name + "，" + hello : hello;
      }

      // ── 錢包 ────────────────────────────────────────────
      async function loadWallet() {
        try {
          const res = await fetch("/api/wallet", { headers: authHeaders() });
          const wallet = await readJson(res);
          if (!res.ok || !wallet) throw new Error();
          document.getElementById("walletTier").textContent = wallet.cardActive
            ? wallet.cardTierLabel || "會員"
            : "尚未開卡";
          document.getElementById("walletBalance").textContent =
            "NT$ " + (wallet.balance || 0).toLocaleString();
        } catch (e) {
          setWalletError("點擊查看錢包");
        }
      }

      function setWalletError(msg) {
        document.getElementById("walletBalance").textContent = msg;
        document.getElementById("walletTier").textContent = "";
      }

      // ── 日期工具（後端日期為 yyyy-MM-dd，時間為 HH:mm:ss，皆為台灣時間）──
      function pad(n) {
        return String(n).padStart(2, "0");
      }
      function todayStr() {
        const d = new Date();
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }
      function nowTimeStr() {
        const d = new Date();
        return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":00";
      }
      function parseDate(s) {
        const [y, m, d] = s.split("-").map(Number);
        return new Date(y, m - 1, d);
      }
      function daysBetween(fromStr, toStr) {
        return Math.round((parseDate(toStr) - parseDate(fromStr)) / 86400000);
      }
      function md(s) {
        const d = parseDate(s);
        return d.getMonth() + 1 + "/" + d.getDate();
      }
      function mdw(s) {
        return md(s) + "（" + WEEKDAYS[parseDate(s).getDay()] + "）";
      }
      function hm(t) {
        return String(t || "").substring(0, 5);
      }
      function mdhm(isoDateTime) {
        const [d, t] = String(isoDateTime).split("T");
        return md(d) + " " + hm(t);
      }

      function isUpcoming(a, today, now) {
        if (a.cancelled || a.status === "CANCELLED") return false;
        if (a.date > today) return true;
        if (a.date < today) return false;
        return a.endTime > now;
      }

      // 有服務過的紀錄：已結帳或已完成，且不晚於今天
      function isServed(a, today) {
        if (a.cancelled || a.status === "CANCELLED") return false;
        return a.date <= today && (a.paid || a.status === "COMPLETED");
      }

      // ── 預約＋毛孩 ───────────────────────────────────────
      async function loadAppointmentsAndPets() {
        const [apptRes, petRes] = await Promise.allSettled([
          fetch("/api/me/appointments", { headers: authHeaders() }).then(async (r) => {
            const d = await readJson(r);
            if (!r.ok || !Array.isArray(d)) throw new Error();
            return d;
          }),
          fetch("/api/me/pets", { headers: authHeaders() }).then(async (r) => {
            const d = await readJson(r);
            if (!r.ok || !Array.isArray(d)) throw new Error();
            return d;
          }),
        ]);
        const appts = apptRes.status === "fulfilled" ? apptRes.value : null;
        const pets = petRes.status === "fulfilled" ? petRes.value : null;

        const today = todayStr();
        const now = nowTimeStr();
        const upcoming = (appts || [])
          .filter((a) => isUpcoming(a, today, now))
          .sort((x, y) => (x.date + x.startTime).localeCompare(y.date + y.startTime));

        renderNextAppointment(appts, upcoming, pets || [], today);
        renderPets(pets, appts || [], upcoming, today);
      }

      function petByName(pets, name) {
        return pets.find((p) => p.name === name) || null;
      }

      // 沒有照片時依物種顯示線條圖示（線條色取 .avatar 的文字色）
      const PET_ICONS = {
        DOG:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M6.6 5.2C4.6 5 3 7.6 3.2 10.2c.1 1.1.9 1.6 1.7 1.1"/>' +
          '<path d="M17.4 5.2c2-.2 3.6 2.4 3.4 5-.1 1.1-.9 1.6-1.7 1.1"/>' +
          '<path d="M6.6 5.2C8 4.4 9.9 4 12 4s4 .4 5.4 1.2c1.1 1.6 1.7 3.6 1.7 5.8 0 4.7-3.2 8.5-7.1 8.5S4.9 15.7 4.9 11c0-2.2.6-4.2 1.7-5.8Z"/>' +
          '<circle cx="9.4" cy="10.6" r=".95" fill="currentColor" stroke="none"/><circle cx="14.6" cy="10.6" r=".95" fill="currentColor" stroke="none"/>' +
          '<path d="M10.7 13.6h2.6L12 15Z" fill="currentColor"/><path d="M12 15v1.1M10.6 16.8c.8.6 2 .6 2.8 0"/></svg>',
        CAT:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M5 10.2V4.3l4.2 3h5.6l4.2-3v5.9c0 4.9-3.1 9-7 9s-7-4.1-7-9Z"/>' +
          '<circle cx="9.3" cy="11.6" r=".95" fill="currentColor" stroke="none"/><circle cx="14.7" cy="11.6" r=".95" fill="currentColor" stroke="none"/>' +
          '<path d="M11 14.2h2L12 15.3Z" fill="currentColor"/><path d="M3 13.6l4 .5M3.4 16.3l3.8-.9M21 13.6l-4 .5M20.6 16.3l-3.8-.9"/></svg>',
        OTHER:
          '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none">' +
          '<ellipse cx="7" cy="9.5" rx="1.9" ry="2.4"/><ellipse cx="17" cy="9.5" rx="1.9" ry="2.4"/>' +
          '<ellipse cx="10.1" cy="5.8" rx="1.8" ry="2.3"/><ellipse cx="13.9" cy="5.8" rx="1.8" ry="2.3"/>' +
          '<path d="M12 11.2c-2.6 0-5 3.2-5 5.3 0 1.5 1.2 2.2 2.5 2.2 1 0 1.6-.5 2.5-.5s1.5.5 2.5.5c1.3 0 2.5-.7 2.5-2.2 0-2.1-2.4-5.3-5-5.3Z"/></svg>',
      };

      function petIcon(pet) {
        const type = pet && pet.petType;
        return PET_ICONS[type] || PET_ICONS.OTHER;
      }

      function avatarHtml(pet) {
        const icon = '<span class="avatar-icon">' + petIcon(pet) + "</span>";
        if (pet && pet.photoUrl) {
          // 照片載入失敗（網址失效）時退回圖示
          return (
            '<span class="avatar"><img src="' + escapeHtml(pet.photoUrl) + '" alt="" loading="lazy" ' +
            "onerror=\"this.parentNode.classList.add('no-photo');this.remove()\" />" + icon + "</span>"
          );
        }
        return '<span class="avatar no-photo">' + icon + "</span>";
      }

      function statusChip(a) {
        if (a.status === "AWAITING_DEPOSIT") return '<span class="chip pending">待付訂金</span>';
        if (a.status === "PENDING_CONFIRM") return '<span class="chip plain">待確認</span>';
        if (a.status === "IN_PROGRESS") return '<span class="chip booked">服務中</span>';
        return '<span class="chip booked">已確認</span>';
      }

      function countdownText(dateStr, today) {
        const n = daysBetween(today, dateStr);
        if (n <= 0) return "今天";
        if (n === 1) return "明天";
        return n + " 天後";
      }

      function renderNextAppointment(appts, upcoming, pets, today) {
        const box = document.getElementById("nextAppt");
        const link = document.getElementById("apptCountLink");
        if (appts === null) {
          box.innerHTML = '<div class="empty">預約載入失敗，請稍後再試</div>';
          return;
        }
        link.textContent = upcoming.length ? upcoming.length + " 筆預約 ›" : "我的預約 ›";
        if (!upcoming.length) {
          box.innerHTML =
            '<div class="empty">目前沒有即將到來的預約<br /><a href="/liff/booking.html">幫毛孩預約一次舒服的洗護 →</a></div>';
          return;
        }

        const a = upcoming[0];
        const items =
          a.displayItemNames && a.displayItemNames.length
            ? a.displayItemNames.join("、")
            : a.firstVisitAssessment
              ? "初次評估 · 現場報價"
              : "";
        let deposit = "";
        if (a.status === "AWAITING_DEPOSIT") {
          deposit =
            '<div class="appt-deposit"><span>訂金待付' +
            (a.depositDueAt ? " · " + escapeHtml(mdhm(a.depositDueAt)) + " 前付款" : "") +
            '</span><span class="btn-apricot">付訂金</span></div>';
        }
        box.innerHTML =
          '<a class="appt" href="/liff/my-appointments.html' +
          (a.status === "AWAITING_DEPOSIT" ? "?deposit=" + encodeURIComponent(a.date) : "") +
          '">' +
          '<div class="appt-top">' +
          avatarHtml(petByName(pets, a.petName)) +
          '<div class="appt-main"><div class="appt-name"><b>' +
          escapeHtml(a.petName) +
          "</b>" +
          statusChip(a) +
          '</div><div class="appt-items">' +
          escapeHtml(items) +
          "</div></div>" +
          '<span class="chip plain">' +
          countdownText(a.date, today) +
          "</span></div>" +
          '<div class="appt-when">' +
          '<span class="when-pill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7E5F33" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3" /><path d="M4 10h16M8.2 3.5v3.4M15.8 3.5v3.4" /></svg>' +
          mdw(a.date) +
          "</span>" +
          '<span class="when-pill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7E5F33" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8" /><path d="M12 8v4l3 2" /></svg>' +
          hm(a.startTime) +
          "</span>" +
          '<span class="appt-more">詳情 ›</span></div>' +
          deposit +
          "</a>";
        loadDepositAmount(a);
      }

      // 待付訂金時補上當天尚未付清的金額（同一天多隻共用一筆訂金）
      async function loadDepositAmount(a) {
        if (a.status !== "AWAITING_DEPOSIT") return;
        try {
          const res = await fetch("/api/me/deposits?date=" + encodeURIComponent(a.date), {
            headers: authHeaders(),
          });
          const d = await readJson(res);
          if (!res.ok || !d || !(d.outstanding > 0)) return;
          const label = document.querySelector("#nextAppt .appt-deposit span");
          if (label) {
            label.innerHTML =
              "訂金 <b>NT$ " +
              Number(d.outstanding).toLocaleString() +
              "</b>" +
              (d.dueAt ? " · " + escapeHtml(mdhm(d.dueAt)) + " 前付款" : "");
          }
        } catch (e) {
          /* 金額抓不到時維持「訂金待付」，點進去仍可看到完整資訊 */
        }
      }

      function petMeta(p) {
        const parts = [];
        if (p.breed) parts.push(p.breed);
        else if (p.petTypeLabel) parts.push(p.petTypeLabel);
        if (p.age != null) parts.push(p.age + " 歲");
        return parts.join(" · ");
      }

      function renderPets(pets, appts, upcoming, today) {
        const box = document.getElementById("pets");
        const count = document.getElementById("petsCount");
        if (pets === null) {
          box.innerHTML = '<div class="card empty" style="flex: 1">毛孩資料載入失敗，請稍後再試</div>';
          return;
        }
        count.textContent = pets.length ? pets.length + " 隻" : "";
        if (!pets.length) {
          box.innerHTML =
            '<a class="card pet add" href="/liff/add-pet.html" style="flex: 1">＋ 新增第一位毛孩</a>';
          return;
        }

        box.innerHTML = pets
          .map((p) => {
            const next = upcoming.find((a) => a.petName === p.name);
            const served = appts
              .filter((a) => a.petName === p.name && isServed(a, today))
              .sort((x, y) => y.date.localeCompare(x.date))[0];
            const sinceDays = served ? daysBetween(served.date, today) : null;

            let chip = "";
            let note;
            let btn;
            if (next) {
              chip = '<span class="chip booked">已預約</span>';
              note = "下次：" + md(next.date) + " " + hm(next.startTime);
              btn = '<a class="pet-btn" href="/liff/add-pet.html?editPetId=' + p.id + '">查看檔案</a>';
            } else {
              if (sinceDays != null && sinceDays >= BATH_REMINDER_DAYS) {
                chip = '<span class="chip due">該洗澡囉</span>';
              }
              note = sinceDays != null ? "距離上次 " + sinceDays + " 天" : "還沒有服務紀錄";
              btn = '<a class="pet-btn primary" href="/liff/booking.html?petId=' + p.id + '">去預約</a>';
            }
            return (
              '<div class="card pet">' +
              '<div class="pet-top">' +
              avatarHtml(p) +
              chip +
              "</div>" +
              '<div><div class="pet-name">' +
              escapeHtml(p.name) +
              '</div><div class="pet-meta">' +
              escapeHtml(petMeta(p)) +
              "</div></div>" +
              '<div class="pet-note">' +
              escapeHtml(note) +
              "</div>" +
              btn +
              "</div>"
            );
          })
          .join("");
      }

      init();
    </script>
    <script src="/liff/tabbar.js?v=1"></script>
  </body>
</html>
