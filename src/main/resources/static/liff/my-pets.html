<!doctype html>
<html lang="zh-Hant">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的毛孩 | 慕沐村Mulage pet</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <link rel="stylesheet" href="/liff/liff-theme.css" />
    <style>
      /* ---- 這頁專屬的補充樣式（元件本身在 liff-theme.css）---- */
      body {
        padding-bottom: 110px;
      }
      .add-dashed {
        display: block;
        margin: 20px 20px 18px;
        padding: 14px;
        border: none;
        border-radius: var(--radius-md);
        text-align: center;
        color: #ffffff;
        font-family: "Noto Serif TC", serif;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-decoration: none;
        background: linear-gradient(135deg, var(--wood), var(--wood-deep));
        box-shadow: 0 6px 16px rgba(138, 100, 64, 0.35);
      }

      .pet-card {
        margin: 0 20px 16px;
      }
      .pet-top {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 13px;
      }
      .pet-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--paper-2);
        border: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .pet-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pet-name {
        font-family: "Noto Serif TC", serif;
        font-size: 16.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .pet-breed {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        color: var(--ink-soft);
        margin-top: 3px;
        letter-spacing: 0.3px;
      }
      .pet-edit {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        color: var(--wood-deep);
        text-decoration: none;
        border-bottom: 1px solid var(--wood-deep);
        padding-bottom: 1px;
        white-space: nowrap;
        text-transform: lowercase;
      }

      .pet-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .ptag {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 600;
        font-family: "Noto Sans TC", sans-serif;
      }
      .ptag.size {
        background: var(--pending-bg);
        color: var(--pending-fg);
      }
      .ptag.coat {
        background: var(--done-bg);
        color: var(--done-fg);
      }
      .ptag.anxiety-yes {
        background: var(--cancel-bg);
        color: var(--cancel-fg);
      }
      .ptag.anxiety-no {
        background: var(--paper-2);
        color: var(--ink-faint);
      }

      .pet-info {
        font-size: 12.5px;
        color: var(--ink-soft);
        line-height: 2;
      }
      .pet-info b {
        color: var(--ink);
        font-weight: 600;
      }

      .photo-upload {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .photo-upload input[type="file"] {
        font-size: 11px;
        max-width: 150px;
        color: var(--ink-soft);
      }
      .photo-upload button {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        letter-spacing: 0.3px;
        text-transform: lowercase;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--primary-deep);
        cursor: pointer;
      }
      .photo-upload .status {
        font-size: 10.5px;
        color: var(--ink-faint);
      }

      .fab-home {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--primary-deep);
        box-shadow: 0 8px 20px rgba(38, 51, 43, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 500;
        border: 2px solid var(--gold);
      }
      .fab-home-icon {
        font-size: 20px;
        line-height: 1;
      }
      .fab-home:active {
        opacity: 0.85;
      }

      .loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-faint);
        font-family: "Jost", sans-serif;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="idband">
      <span><span class="dot"></span>mulage pet</span>
      <span>我的毛孩</span>
    </div>

    <div class="page-head">
      <a class="back" href="/liff/index.html">‹</a>
      <div class="titles">
        <div class="cn">毛孩檔案</div>
        <div class="en">my pets</div>
      </div>
    </div>

    <a class="add-dashed" href="/liff/add-pet.html">＋ 新增毛孩</a>

    <div id="app"><div class="loading">載入中...</div></div>

    <a href="/liff/index.html" class="fab-home" aria-label="返回首頁">
      <span class="fab-home-icon">🏠</span>
    </a>

    <div class="footer-mark">
      <div class="txt">Mulage Pet Salon</div>
    </div>

    <script>
      const LIFF_ID = "2010567973-W8pQ5ZqI";
      let jwtToken = null;

      // 資安修正：寵物名稱/品種/注意事項是顧客自己填的，直接塞進 innerHTML
      // 樣板字串會有存放型 XSS 風險（例如把寵物名字設成 <img onerror=...>）。
      // 顯示前一律先跳脫成純文字，跟後端 Thymeleaf th:text 的自動跳脫是同樣道理。
      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // --- 初始化流程 ---
      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: window.location.href });
            return;
          }

          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true", // 防止 ngrok 阻擋
            },
            body: JSON.stringify({ idToken: liff.getIDToken() }),
          });

          const data = await res.json().catch(() => null);
          if (!res.ok) {
            document.getElementById("app").innerHTML =
              '<div class="loading" style="color:#8B0000">登入失敗</div>';
            return;
          }

          // 多欄位聯集相容，完美對齊後端
          jwtToken = data?.token || data?.jwtToken || data?.accessToken;

          await loadPets();
        } catch (e) {
          // 印出具體錯誤訊息，方便 debug
          document.getElementById("app").innerHTML =
            '<div class="loading" style="color:#8B0000">初始化失敗：' +
            e.message +
            "</div>";
        }
      }

      // --- 載入毛孩資料 ---
      async function loadPets() {
        try {
          const res = await fetch("/api/pets/my", {
            headers: {
              Authorization: "Bearer " + jwtToken,
              "ngrok-skip-browser-warning": "true", // 防止 ngrok 阻擋
            },
          });

          if (!res.ok) throw new Error("HTTP " + res.status);
          const pets = await res.json();

          if (!pets || !pets.length) {
            document.getElementById("app").innerHTML =
              '<div class="empty-state"><div class="icon">🐾</div><div class="t">尚無毛孩資料</div><div class="d">點上方按鈕新增您的第一隻毛孩</div></div>';
            return;
          }

          document.getElementById("app").innerHTML = pets
            .map(
              (p) => `
        <div class="surface-card pet-card">
          <div class="pet-top">
            <div class="pet-avatar">${p.photoUrl ? `<img src="${p.photoUrl}" />` : p.petType === "DOG" ? "🐶" : p.petType === "CAT" ? "🐱" : "🐾"}</div>
            <div style="flex: 1">
              <div class="pet-name">${escapeHtml(p.name)}</div>
              <div class="pet-breed">${escapeHtml(p.breed)}</div>
            </div>
            <a href="/liff/add-pet.html?editPetId=${p.id}" class="pet-edit">✏️ 編輯</a>
            <button type="button" class="pet-delete" onclick="deletePet(${p.id}, '${escapeHtml(p.name)}')" style="background:none; border:none; color:#c0392b; font-size:12px; cursor:pointer; margin-left:6px; padding:4px;">🗑️ 刪除</button>
          </div>
          <div class="pet-tags">
            <span class="ptag size">${p.sizeCategoryLabel}</span>
            <span class="ptag coat">${p.coatTypeLabel}</span>
            <span class="ptag ${p.hasSeparationAnxiety ? "anxiety-yes" : "anxiety-no"}">
              ${p.hasSeparationAnxiety ? "⚠️ 有分離焦慮" : "分離焦慮：無"}
            </span>
          </div>
          <div class="pet-info">
            體重：<b>${p.weight} kg</b>　年齡：<b>${p.age} 歲</b>
            ${p.notes ? "<br>注意事項：<b>" + escapeHtml(p.notes) + "</b>" : ""}
          </div>
          <div class="photo-upload">
            <input type="file" accept="image/*" id="photoInput-${p.id}" />
            <button type="button" onclick="uploadPhoto(${p.id})">
              ${p.photoUrl ? "更換照片" : "上傳照片"}
            </button>
            <span class="status" id="photoStatus-${p.id}"></span>
          </div>
        </div>
      `,
            )
            .join("");
        } catch (e) {
          document.getElementById("app").innerHTML =
            '<div class="loading" style="color:#8B0000">載入毛孩失敗：' +
            e.message +
            "</div>";
        }
      }

      // --- 上傳/更換寵物照片 ---
      // 需求（追加，2026-08-26）：顧客自己刪除毛孩。有預約或消費紀錄的話，
      // 後端 PetService.deletePet() 會擋下並回傳明確的錯誤訊息，這裡直接
      // 顯示後端給的訊息，不用自己重複判斷。
      async function deletePet(petId, petName) {
        if (!confirm(`確定要刪除「${petName}」嗎？刪除後不會再顯示在毛孩清單裡，但過往的預約/消費紀錄不會受影響。`)) return;
        try {
          const res = await fetch("/api/pets/" + petId, {
            method: "DELETE",
            headers: { Authorization: "Bearer " + jwtToken },
          });
          if (!res.ok) {
            const msg = await res.text().catch(() => "");
            let parsed = msg;
            try { parsed = JSON.parse(msg); } catch (e) { /* 純文字錯誤訊息，直接用 */ }
            alert(typeof parsed === "string" ? parsed : (parsed.message || "刪除失敗"));
            return;
          }
          loadPets();
        } catch (e) {
          alert("網路錯誤，請重試");
        }
      }

      async function uploadPhoto(petId) {
        const input = document.getElementById("photoInput-" + petId);
        const status = document.getElementById("photoStatus-" + petId);
        if (!input.files || !input.files.length) {
          status.textContent = "請先選擇照片";
          status.style.color = "#8B0000";
          return;
        }

        status.textContent = "上傳中...";
        status.style.color = "#a29a8c";

        const formData = new FormData();
        formData.append("file", input.files[0]);

        try {
          const res = await fetch("/api/pets/" + petId + "/photo", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + jwtToken,
              "ngrok-skip-browser-warning": "true",
            },
            body: formData,
          });
          if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || "HTTP " + res.status);
          }
          status.textContent = "上傳成功！";
          status.style.color = "#2D5A27";
          await loadPets(); // 重新載入，讓新照片立刻顯示出來
        } catch (e) {
          status.textContent = "上傳失敗：" + e.message;
          status.style.color = "#8B0000";
        }
      }

      init();
    </script>
  </body>
</html>
