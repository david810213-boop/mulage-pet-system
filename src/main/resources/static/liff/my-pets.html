<!doctype html>
<html lang="zh-Hant">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Huninn&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的毛孩 | 慕沐村Mulage pet</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <script src="/liff/liff-config.js?v=1"></script>
    <link rel="stylesheet" href="/liff/liff-theme.css?v=2" />
    <style>
      /* ---- 這頁專屬的補充樣式（元件本身在 liff-theme.css）---- */
      body {
        padding-bottom: 110px;
      }
      .add-dashed {
        display: block;
        margin: 20px 20px 18px;
        padding: 14px;
        border: none;
        border-radius: var(--radius-md);
        text-align: center;
        color: #ffffff;
        font-family: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-decoration: none;
        background: linear-gradient(135deg, var(--wood), var(--wood-deep));
        box-shadow: 0 6px 16px rgba(138, 100, 64, 0.35);
      }

      .pet-card {
        margin: 0 20px 16px;
      }
      .pet-top {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 13px;
      }
      .pet-avatar {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--paper-2);
        border: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 23px;
        flex-shrink: 0;
        overflow: hidden;
      }
      .pet-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pet-name {
        font-family: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        font-size: 16.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .pet-breed {
        font-family: "Bricolage Grotesque", "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
        font-size: 10.5px;
        color: var(--ink-soft);
        margin-top: 3px;
        letter-spacing: 0.3px;
      }
      .pet-edit {
        font-family: "Bricolage Grotesque", "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
        font-size: 10.5px;
        color: var(--wood-deep);
        text-decoration: none;
        border-bottom: 1px solid var(--wood-deep);
        padding-bottom: 1px;
        white-space: nowrap;
        text-transform: lowercase;
      }

      .pet-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .ptag {
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 600;
        font-family: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      }
      .ptag.size {
        background: var(--pending-bg);
        color: var(--pending-fg);
      }
      .ptag.coat {
        background: var(--done-bg);
        color: var(--done-fg);
      }
      .ptag.anxiety-yes {
        background: var(--cancel-bg);
        color: var(--cancel-fg);
      }
      .ptag.anxiety-no {
        background: var(--paper-2);
        color: var(--ink-faint);
      }

      .pet-info {
        font-size: 12.5px;
        color: var(--ink-soft);
        line-height: 2;
      }
      .pet-info b {
        color: var(--ink);
        font-weight: 600;
      }

      .photo-upload {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--line-soft);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .photo-upload input[type="file"] {
        font-size: 11px;
        max-width: 150px;
        color: var(--ink-soft);
      }
      .photo-upload button {
        font-family: "Bricolage Grotesque", "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
        font-size: 10.5px;
        letter-spacing: 0.3px;
        text-transform: lowercase;
        padding: 6px 13px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--primary-deep);
        cursor: pointer;
      }
      .photo-upload .status {
        font-size: 10.5px;
        color: var(--ink-faint);
      }

      .fab-home {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--primary-deep);
        box-shadow: 0 8px 20px rgba(38, 51, 43, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 500;
        border: 2px solid var(--gold);
      }
      .fab-home-icon {
        font-size: 20px;
        line-height: 1;
      }
      .fab-home:active {
        opacity: 0.85;
      }

      .loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-faint);
        font-family: "Bricolage Grotesque", "Huninn", "PingFang TC", "Microsoft JhengHei", sans-serif;
        font-size: 11.5px;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="idband">
      <span><span class="dot"></span>mulage pet</span>
      <span>我的毛孩</span>
    </div>

    <div class="page-head">
      <a class="back" href="/liff/index.html">‹</a>
      <div class="titles">
        <div class="cn">毛孩檔案</div>
        <div class="en">my pets</div>
      </div>
    </div>

    <a class="add-dashed" href="/liff/add-pet.html">＋ 新增毛孩</a>

    <div id="app"><div class="loading">載入中...</div></div>

    <a href="/liff/index.html" class="fab-home" aria-label="返回首頁">
      <span class="fab-home-icon">🏠</span>
    </a>

    <div class="footer-mark">
      <div class="txt">Mulage Pet Salon</div>
    </div>

    <script>
      const LIFF_ID = window.MULAGE_LIFF.myPets; // LIFF ID 集中在 /liff/liff-config.js
      let jwtToken = null;

      // 資安修正：寵物名稱/品種/注意事項是顧客自己填的，直接塞進 innerHTML
      // 樣板字串會有存放型 XSS 風險（例如把寵物名字設成 <img onerror=...>）。
      // 顯示前一律先跳脫成純文字，跟後端 Thymeleaf th:text 的自動跳脫是同樣道理。
      function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // --- 初始化流程 ---
      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: window.location.href });
            return;
          }

          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true", // 防止 ngrok 阻擋
            },
            body: JSON.stringify({ idToken: liff.getIDToken() }),
          });

          const data = await res.json().catch(() => null);
          if (!res.ok) {
            document.getElementById("app").innerHTML =
              '<div class="loading" style="color:#8B0000">登入失敗</div>';
            return;
          }

          // 多欄位聯集相容，完美對齊後端
          jwtToken = data?.token || data?.jwtToken || data?.accessToken;

          await loadPets();
        } catch (e) {
          // 印出具體錯誤訊息，方便 debug
          document.getElementById("app").innerHTML =
            '<div class="loading" style="color:#8B0000">初始化失敗：' +
            e.message +
            "</div>";
        }
      }

      // --- 載入毛孩資料 ---
      async function loadPets() {
        try {
          const res = await fetch("/api/pets/my", {
            headers: {
              Authorization: "Bearer " + jwtToken,
              "ngrok-skip-browser-warning": "true", // 防止 ngrok 阻擋
            },
          });

          if (!res.ok) throw new Error("HTTP " + res.status);
          const pets = await res.json();
          petNameById = {};
          (pets || []).forEach((p) => (petNameById[p.id] = p.name));

          if (!pets || !pets.length) {
            document.getElementById("app").innerHTML =
              '<div class="empty-state"><div class="icon">🐾</div><div class="t">尚無毛孩資料</div><div class="d">點上方按鈕新增您的第一隻毛孩</div></div>';
            return;
          }

          document.getElementById("app").innerHTML = pets
            .map(
              (p) => `
        <div class="surface-card pet-card">
          <div class="pet-top">
            <div class="pet-avatar">${p.photoUrl ? `<img src="${p.photoUrl}" />` : p.petType === "DOG" ? "🐶" : p.petType === "CAT" ? "🐱" : "🐾"}</div>
            <div style="flex: 1">
              <div class="pet-name">${escapeHtml(p.name)}</div>
              <div class="pet-breed">${escapeHtml(p.breed)}</div>
            </div>
            <a href="/liff/add-pet.html?editPetId=${p.id}" class="pet-edit">✏️ 編輯</a>
            <button type="button" class="pet-delete" onclick="deletePet(${p.id}, '${escapeHtml(p.name)}')" style="background:none; border:none; color:#c0392b; font-size:12px; cursor:pointer; margin-left:6px; padding:4px;">🗑️ 刪除</button>
          </div>
          <div class="pet-tags">
            <span class="ptag size">${p.sizeCategoryLabel}</span>
            <span class="ptag coat">${p.coatTypeLabel}</span>
            <span class="ptag ${p.hasSeparationAnxiety ? "anxiety-yes" : "anxiety-no"}">
              ${p.hasSeparationAnxiety ? "⚠️ 有分離焦慮" : "分離焦慮：無"}
            </span>
          </div>
          <!-- 需求（追加，2026-09-04）：折扣資格狀態（距上次洗澡幾天/優惠期內
               或已過期/首次體驗優惠），選好毛孩清單後非同步逐一補上，避免
               拖慢整頁的初次載入速度。 -->
          <div class="pet-tags" id="discountTag-${p.id}"></div>
          <div class="pet-info">
            體重：<b>${p.weight} kg</b>　年齡：<b>${p.age} 歲</b>
            ${p.notes ? "<br>注意事項：<b>" + escapeHtml(p.notes) + "</b>" : ""}
          </div>
          <!-- 需求（2026-09-29）：每次美容的狀況備註與照片 -->
          <button type="button" class="history-btn" onclick="openHistory(${p.id})"
                  style="margin-top:10px; width:100%; padding:10px; border-radius:12px; border:1px solid #DBD3C4; background:#fff; color:#26332B; font-size:14px; font-family:inherit; cursor:pointer;">
            📖 美容紀錄
          </button>
          <div class="photo-upload">
            <input type="file" accept="image/*" id="photoInput-${p.id}" />
            <button type="button" onclick="uploadPhoto(${p.id})">
              ${p.photoUrl ? "更換照片" : "上傳照片"}
            </button>
            <span class="status" id="photoStatus-${p.id}"></span>
          </div>
        </div>
      `,
            )
            .join("");

          // 需求（追加，2026-09-04）：逐一補上每隻寵物的折扣狀態標籤，
          // 用 Promise.all 平行打，不要一隻一隻等，減少總等待時間。
          Promise.all(pets.map((p) => loadDiscountTag(p.id)));
        } catch (e) {
          document.getElementById("app").innerHTML =
            '<div class="loading" style="color:#8B0000">載入毛孩失敗：' +
            e.message +
            "</div>";
        }
      }

      // 需求（追加，2026-09-04）：抓單一寵物的折扣資格狀態，塞進對應的
      // pet-tags 區塊。抓失敗（例如網路問題）就靜默留空，不影響整頁其他功能。
      async function loadDiscountTag(petId) {
        const el = document.getElementById("discountTag-" + petId);
        if (!el) return;
        try {
          const res = await fetch("/api/pets/" + petId + "/discount-status", {
            headers: {
              Authorization: "Bearer " + jwtToken,
              "ngrok-skip-browser-warning": "true",
            },
          });
          if (!res.ok) return;
          const status = await res.json();

          if (status.specialDiscountLabel) {
            const daysText =
              typeof status.lastBathDaysAgo === "number"
                ? `距上次洗澡 ${status.lastBathDaysAgo} 天　`
                : "";
            el.innerHTML = `<span class="ptag" style="background:#eef6ec; color:#3d6b34; border:1px solid #a9d1a0;">🎉 ${daysText}${escapeHtml(status.specialDiscountLabel)}期內</span>`;
          } else if (
            typeof status.lastBathDaysAgo === "number" &&
            !status.rewashEligible
          ) {
            el.innerHTML = `<span class="ptag" style="background:#f2f0ec; color:#6b6656; border:1px solid #cfc9bb;">距上次洗澡 ${status.lastBathDaysAgo} 天，已過優惠期</span>`;
          }
          // 都不符合（例如狗狗、且不是首次消費）就不顯示任何標籤，維持畫面簡潔。
        } catch (e) {
          // 靜默失敗，不影響其他寵物卡片
        }
      }


      // --- 上傳/更換寵物照片 ---
      // 需求（追加，2026-08-26）：顧客自己刪除毛孩。有預約或消費紀錄的話，
      // 後端 PetService.deletePet() 會擋下並回傳明確的錯誤訊息，這裡直接
      // 顯示後端給的訊息，不用自己重複判斷。
      // 需求（2026-09-29）：查看毛孩每次美容的狀況備註與照片（店家核對時留下的）
      let petNameById = {};
      async function openHistory(petId) {
        const petName = escapeHtml(petNameById[petId] || "毛孩");
        let panel = document.getElementById("historyPanel");
        if (!panel) {
          panel = document.createElement("div");
          panel.id = "historyPanel";
          panel.style.cssText =
            "position:fixed; inset:0; background:rgba(20,28,24,.45); z-index:1000; display:flex; align-items:flex-end; justify-content:center;";
          panel.addEventListener("click", (e) => {
            if (e.target === panel) panel.remove();
          });
          document.body.appendChild(panel);
        }
        panel.innerHTML = `
          <div style="background:#faf8f3; width:100%; max-width:560px; max-height:85vh; overflow:auto; border-radius:20px 20px 0 0; padding:20px 18px 32px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <div style="font-size:17px; font-weight:700; color:#26332B;">${petName} 的美容紀錄</div>
              <button type="button" onclick="document.getElementById('historyPanel').remove()" style="border:0; background:none; font-size:22px; color:#8a8474; cursor:pointer;">×</button>
            </div>
            <div id="historyBody" style="font-size:14px; color:#6b6656;">載入中…</div>
          </div>`;
        const body = document.getElementById("historyBody");
        try {
          const res = await fetch("/api/pets/" + petId + "/grooming-history", {
            headers: { Authorization: "Bearer " + jwtToken },
          });
          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            data = { message: text };
          }
          if (!res.ok) throw new Error(data.message || "HTTP " + res.status);
          if (!data.length) {
            body.innerHTML = '<div style="padding:24px 0; text-align:center;">還沒有美容紀錄，下次美容完成後就會出現在這裡 ♡</div>';
            return;
          }
          body.innerHTML = data
            .map(
              (n) => `
            <div style="padding:14px 0; border-top:1px solid #e6e0d4;">
              <div style="font-size:13px; color:#a29a8c;">${escapeHtml(n.serviceDate || "")}</div>
              <div style="margin-top:4px; line-height:1.7; color:#26332B; white-space:pre-wrap;">${escapeHtml(n.note || "")}</div>
              ${
                (n.photos || []).length
                  ? `<div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;">${n.photos
                      .map(
                        (u) =>
                          `<a href="${escapeHtml(u)}" target="_blank" rel="noopener"><img src="${escapeHtml(u)}" loading="lazy" alt="美容照片" style="width:84px; height:84px; object-fit:cover; border-radius:10px; display:block;" /></a>`,
                      )
                      .join("")}</div>`
                  : ""
              }
            </div>`,
            )
            .join("");
        } catch (e) {
          body.innerHTML = '<div style="color:#8B0000;">載入失敗：' + escapeHtml(e.message) + "</div>";
        }
      }

      async function deletePet(petId, petName) {
        if (!confirm(`確定要刪除「${petName}」嗎？刪除後不會再顯示在毛孩清單裡，但過往的預約/消費紀錄不會受影響。`)) return;
        try {
          const res = await fetch("/api/pets/" + petId, {
            method: "DELETE",
            headers: { Authorization: "Bearer " + jwtToken },
          });
          if (!res.ok) {
            const msg = await res.text().catch(() => "");
            let parsed = msg;
            try { parsed = JSON.parse(msg); } catch (e) { /* 純文字錯誤訊息，直接用 */ }
            alert(typeof parsed === "string" ? parsed : (parsed.message || "刪除失敗"));
            return;
          }
          loadPets();
        } catch (e) {
          alert("網路錯誤，請重試");
        }
      }

      async function uploadPhoto(petId) {
        const input = document.getElementById("photoInput-" + petId);
        const status = document.getElementById("photoStatus-" + petId);
        if (!input.files || !input.files.length) {
          status.textContent = "請先選擇照片";
          status.style.color = "#8B0000";
          return;
        }

        status.textContent = "上傳中...";
        status.style.color = "#a29a8c";

        const formData = new FormData();
        formData.append("file", input.files[0]);

        try {
          const res = await fetch("/api/pets/" + petId + "/photo", {
            method: "POST",
            headers: {
              Authorization: "Bearer " + jwtToken,
              "ngrok-skip-browser-warning": "true",
            },
            body: formData,
          });
          if (!res.ok) {
            const msg = await res.text();
            throw new Error(msg || "HTTP " + res.status);
          }
          status.textContent = "上傳成功！";
          status.style.color = "#2D5A27";
          await loadPets(); // 重新載入，讓新照片立刻顯示出來
        } catch (e) {
          status.textContent = "上傳失敗：" + e.message;
          status.style.color = "#8B0000";
        }
      }

      init();
    </script>
  </body>
</html>
