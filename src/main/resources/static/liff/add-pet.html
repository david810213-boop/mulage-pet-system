<!doctype html>
<html lang="zh-Hant">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>慕沐村Mulage pet</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Noto Serif TC",
          -apple-system,
          BlinkMacSystemFont,
          serif;
        background: #f6f2ea;
        min-height: 100vh;
        padding-bottom: 90px;
      }
      .header {
        background: #2b2a28;
        color: #d9be8f;
        padding: 20px 16px 24px;
        text-align: center;
      }
      .header .logo {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 4px;
      }
      .header h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      .notice {
        margin: 16px;
        background: #f6f2ea;
        border: 1px solid #ede5d3;
        border-radius: 12px;
        padding: 16px;
        font-size: 13px;
        color: #454340;
        line-height: 1.8;
      }
      .notice .title {
        font-weight: 700;
        color: #2b2a28;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .form-card {
        margin: 0 16px 16px;
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .form-card h3 {
        font-size: 15px;
        color: #2b2a28;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #ede5d3;
      }

      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-size: 13px;
        color: #454340;
        margin-bottom: 6px;
        font-weight: 500;
      }
      .field label .req {
        color: #e53935;
        margin-left: 2px;
      }
      .field label .hint {
        color: #8a8072;
        font-size: 11px;
        font-weight: 400;
        margin-left: 6px;
      }

      .field input,
      .field select,
      .field textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #e3dccc;
        border-radius: 8px;
        font-size: 15px;
        color: #2b2a28;
        background: #fffefb;
        outline: none;
        transition: border-color 0.2s;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: #b8935a;
      }
      .field textarea {
        resize: vertical;
        min-height: 80px;
      }

      .radio-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .radio-btn {
        flex: 1;
        min-width: 80px;
        padding: 10px;
        border: 1.5px solid #e3dccc;
        border-radius: 8px;
        text-align: center;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
        color: #666;
      }
      .radio-btn.selected {
        border-color: #b8935a;
        background: #f6f2ea;
        color: #2b2a28;
        font-weight: 700;
      }

      /* 個性／病史 多選標籤 */
      .tag-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tag-btn {
        padding: 7px 12px;
        border: 1.5px solid #e3dccc;
        border-radius: 16px;
        text-align: center;
        font-size: 12.5px;
        cursor: pointer;
        transition: all 0.2s;
        color: #666;
      }
      .tag-btn.selected {
        border-color: #b8935a;
        background: #f6f2ea;
        color: #2b2a28;
        font-weight: 700;
      }

      /* 體型自動判斷顯示區 */
      .auto-result {
        margin-top: 12px;
        padding: 12px;
        background: #f0f9f0;
        border: 1px solid #c8e6c9;
        border-radius: 8px;
        font-size: 13px;
        color: #2e7d32;
        display: none;
      }
      .auto-result.show {
        display: block;
      }
      .auto-result .label {
        font-weight: 700;
        margin-bottom: 4px;
      }
      .auto-result .items {
        color: #555;
      }

      .submit-btn {
        display: block;
        width: calc(100% - 32px);
        margin: 0 16px;
        padding: 14px;
        background: #2b2a28;
        color: #d9be8f;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .submit-btn:active {
        opacity: 0.8;
      }
      .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #2b2a28;
        color: white;
        padding: 12px 24px;
        border-radius: 24px;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        white-space: nowrap;
        z-index: 999;
      }
      .toast.show {
        opacity: 1;
      }
      .toast.success {
        background: #2e7d32;
      }
      .toast.error {
        background: #c62828;
      }

      /* 固定浮動的返回首頁按鈕：畫面中下方，捲動頁面時位置不變 */
      .fab-home {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #2b2a28;
        box-shadow: 0 4px 14px rgba(44, 24, 16, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 500;
      }
      .fab-home-icon {
        font-size: 22px;
        line-height: 1;
      }
      .fab-home:active {
        opacity: 0.8;
      }
    </style>
    <link rel="stylesheet" href="/liff/liff-warm.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">慕沐村 Mulage pet</div>
      <h1>新增毛孩資料</h1>
    </div>

    <a href="/liff/index.html" class="fab-home" aria-label="返回首頁">
      <span class="fab-home-icon">🏠</span>
    </a>

    <!-- 預約須知 -->
    <div class="notice">
      <div class="title">⚠️ 預約前請閱讀</div>
      請填寫以下基本資料，讓小編為您的毛孩預約六星級美容初體驗✰<br />
      填寫完成後，系統將自動判斷毛孩體型，預約時自動帶入適合的洗澡與吹毛項目。
    </div>

    <!-- 毛孩資料 -->
    <div class="form-card">
      <h3>𖥸 毛孩基本資料</h3>

      <div class="field">
        <label>毛孩類型 <span class="req">*</span></label>
        <div class="radio-group" id="petTypeGroup">
          <div
            class="radio-btn"
            data-value="DOG"
            onclick="selectRadio('petType', 'DOG', this)"
          >
            🐶 狗
          </div>
          <div
            class="radio-btn"
            data-value="CAT"
            onclick="selectRadio('petType', 'CAT', this)"
          >
            🐱 貓
          </div>
          <div
            class="radio-btn"
            data-value="OTHER"
            onclick="selectRadio('petType', 'OTHER', this)"
          >
            其他
          </div>
        </div>
      </div>

      <div class="field">
        <label>毛孩名字 <span class="req">*</span></label>
        <input type="text" id="petName" placeholder="請輸入毛孩的名字" />
      </div>

      <div class="field">
        <label>毛孩照片 <span class="hint">（選填，之後也可以到「我的毛孩」補傳）</span></label>
        <input type="file" id="petPhoto" accept="image/*" />
        <div
          id="petPhotoPreview"
          style="margin-top: 8px; display: none;"
        >
          <img
            id="petPhotoPreviewImg"
            style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 1px solid #e3dccc;"
          />
        </div>
      </div>

      <div class="field">
        <label>毛孩品種 <span class="req">*</span></label>
        <input type="text" id="breed" placeholder="例如：柴犬、貴賓、英短" />
      </div>

      <div class="field">
        <label
          >毛孩體重（kg）<span class="req">*</span>
          <span class="hint">狗 ≤ 15kg 為小型，貓 ≤ 5kg 為小貓</span>
        </label>
        <input
          type="number"
          id="weight"
          step="0.1"
          min="0.1"
          placeholder="例如：8.5"
          oninput="updateSizePreview()"
        />
      </div>

      <div class="field">
        <label>毛孩年齡 <span class="req">*</span></label>
        <input type="number" id="age" min="0" placeholder="例如：3（歲）" />
      </div>

      <!-- 需求 2：毛長改由店家於後台檢視實際毛況後定義，此處不再讓顧客選擇 -->

      <div class="field">
        <label>性別 <span class="req">*</span></label>
        <div class="radio-group" id="genderGroup">
          <div class="radio-btn" data-value="公" onclick="selectRadio('gender', '公', this)">公</div>
          <div class="radio-btn" data-value="母" onclick="selectRadio('gender', '母', this)">母</div>
        </div>
      </div>

      <div class="field">
        <label>是否絕育 <span class="req">*</span></label>
        <div class="radio-group" id="neuteredGroup">
          <div class="radio-btn" data-value="false" onclick="selectRadio('neutered', 'false', this)">未絕育</div>
          <div class="radio-btn" data-value="true" onclick="selectRadio('neutered', 'true', this)">已絕育</div>
        </div>
      </div>

      <div class="field">
        <label>晶片號碼 <span class="hint">（依農業部犬貓美容定型化契約規定，貓咪若未辦理寵物登記可留空）</span></label>
        <div class="radio-group" id="chipGroup">
          <div class="radio-btn" data-value="false" onclick="selectRadio('hasChip', 'false', this)">無</div>
          <div class="radio-btn" data-value="true" onclick="selectRadio('hasChip', 'true', this)">有</div>
        </div>
        <input type="text" id="chipNumber" placeholder="請輸入晶片號碼" style="margin-top:8px; display:none;" />
      </div>

      <div class="field">
        <label>個性 <span class="hint">（可複選）</span></label>
        <div class="tag-group" id="personalityGroup">
          <div class="tag-btn" data-value="親近人" onclick="toggleTag('personality', '親近人', this)">親近人</div>
          <div class="tag-btn" data-value="親近狗" onclick="toggleTag('personality', '親近狗', this)">親近狗</div>
          <div class="tag-btn" data-value="會咬人" onclick="toggleTag('personality', '會咬人', this)">會咬人</div>
          <div class="tag-btn" data-value="不會咬人" onclick="toggleTag('personality', '不會咬人', this)">不會咬人</div>
          <div class="tag-btn" data-value="會咬狗貓" onclick="toggleTag('personality', '會咬狗貓', this)">會咬狗貓</div>
          <div class="tag-btn" data-value="不會咬狗貓" onclick="toggleTag('personality', '不會咬狗貓', this)">不會咬狗貓</div>
          <div class="tag-btn" data-value="容易緊張" onclick="toggleTag('personality', '容易緊張', this)">容易緊張</div>
          <div class="tag-btn" data-value="有攻擊性" onclick="toggleTag('personality', '有攻擊性', this)">有攻擊性</div>
        </div>
      </div>

      <div class="field">
        <label>病史 <span class="hint">（可複選，無則不勾）</span></label>
        <div class="tag-group" id="healthGroup">
          <div class="tag-btn" data-value="心臟病" onclick="toggleTag('health', '心臟病', this)">心臟病</div>
          <div class="tag-btn" data-value="氣喘" onclick="toggleTag('health', '氣喘', this)">氣喘</div>
          <div class="tag-btn" data-value="氣管塌陷" onclick="toggleTag('health', '氣管塌陷', this)">氣管塌陷</div>
          <div class="tag-btn" data-value="白內障" onclick="toggleTag('health', '白內障', this)">白內障</div>
          <div class="tag-btn" data-value="癲癇" onclick="toggleTag('health', '癲癇', this)">癲癇</div>
          <div class="tag-btn" data-value="心絲蟲" onclick="toggleTag('health', '心絲蟲', this)">心絲蟲</div>
          <div class="tag-btn" data-value="艾利希體" onclick="toggleTag('health', '艾利希體', this)">艾利希體</div>
          <div class="tag-btn" data-value="腹膜炎" onclick="toggleTag('health', '腹膜炎', this)">腹膜炎</div>
          <div class="tag-btn" data-value="腹積水" onclick="toggleTag('health', '腹積水', this)">腹積水</div>
          <div class="tag-btn" data-value="手術外傷未癒合" onclick="toggleTag('health', '手術外傷未癒合', this)">手術外傷未癒合</div>
          <div class="tag-btn" data-value="髖關節問題" onclick="toggleTag('health', '髖關節問題', this)">髖關節問題</div>
          <div class="tag-btn" data-value="骨折" onclick="toggleTag('health', '骨折', this)">骨折</div>
          <div class="tag-btn" data-value="腸炎" onclick="toggleTag('health', '腸炎', this)">腸炎</div>
          <div class="tag-btn" data-value="血便" onclick="toggleTag('health', '血便', this)">血便</div>
          <div class="tag-btn" data-value="血尿" onclick="toggleTag('health', '血尿', this)">血尿</div>
          <div class="tag-btn" data-value="懷孕" onclick="toggleTag('health', '懷孕', this)">懷孕</div>
          <div class="tag-btn" data-value="傳染性疾病" onclick="toggleTag('health', '傳染性疾病', this)">傳染性疾病</div>
        </div>
        <input type="text" id="healthOther" placeholder="其他病史（選填）" style="margin-top:8px;" />
      </div>

      <div class="field">
        <label>是否有指定獸醫院 <span class="hint">（若未指定，緊急就醫時將送往本店合作動物醫院）</span></label>
        <div class="radio-group" id="vetGroup">
          <div class="radio-btn" data-value="false" onclick="selectRadio('hasVet', 'false', this)">無指定</div>
          <div class="radio-btn" data-value="true" onclick="selectRadio('hasVet', 'true', this)">有指定</div>
        </div>
        <div id="vetDetail" style="display:none; margin-top:8px;">
          <input type="text" id="vetName" placeholder="動物醫院名稱" style="margin-bottom:8px;" />
          <input type="text" id="vetAddress" placeholder="地址" style="margin-bottom:8px;" />
          <input type="tel" id="vetPhone" placeholder="連絡電話" />
        </div>
      </div>

      <!-- 自動判斷體型結果 -->
      <div class="auto-result" id="sizeResult">
        <div class="label">🤖 系統自動判斷</div>
        <div id="sizeLabel"></div>
        <div class="items" id="sizeItems"></div>
      </div>
    </div>

    <!-- 家長資料 -->
    <div class="form-card">
      <h3>𖥸 家長資料</h3>

      <div class="field">
        <label>家長手機 <span class="req">*</span></label>
        <input type="tel" id="ownerPhone" placeholder="例如：0912-345-678" />
      </div>

      <div class="field">
        <label>毛孩有無分離焦慮 <span class="req">*</span></label>
        <div class="radio-group" id="anxietyGroup">
          <div
            class="radio-btn"
            data-value="false"
            onclick="selectRadio('anxiety', 'false', this)"
          >
            無
          </div>
          <div
            class="radio-btn"
            data-value="true"
            onclick="selectRadio('anxiety', 'true', this)"
          >
            有
          </div>
        </div>
      </div>

      <div class="field">
        <label>注意事項 <span class="hint">（選填）</span></label>
        <textarea
          id="notes"
          placeholder="例如：不喜歡吹風機聲音、對特定洗劑過敏等..."
        ></textarea>
      </div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">
      確認新增毛孩
    </button>

    <div class="toast" id="toast"></div>

    <script>
      const LIFF_ID = "2010567973-ygHvpq7X";
      let jwtToken = null;
      const formData = {
        petType: null,
        anxiety: null,
        gender: null,
        neutered: null,
        hasChip: null,
        hasVet: null,
        personality: [],
        health: [],
      };

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const idToken = liff.getIDToken();
          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken }),
          });
          const data = await res.json();
          if (!res.ok) {
            showToast("登入失敗", "error");
            return;
          }
          jwtToken = data.token;
        } catch (e) {
          showToast("初始化失敗", "error");
        }
      }

      function selectRadio(field, value, el) {
        formData[field] = value;
        const group = el.parentElement;
        group
          .querySelectorAll(".radio-btn")
          .forEach((b) => b.classList.remove("selected"));
        el.classList.add("selected");
        if (field === "petType" || field === "anxiety") updateSizePreview();
        if (field === "hasChip") {
          document.getElementById("chipNumber").style.display =
            value === "true" ? "block" : "none";
        }
        if (field === "hasVet") {
          document.getElementById("vetDetail").style.display =
            value === "true" ? "block" : "none";
        }
      }

      function toggleTag(field, value, el) {
        const arr = formData[field];
        const idx = arr.indexOf(value);
        if (idx >= 0) {
          arr.splice(idx, 1);
          el.classList.remove("selected");
        } else {
          arr.push(value);
          el.classList.add("selected");
        }
      }

      function updateSizePreview() {
        const petType = formData.petType;
        const weight = parseFloat(document.getElementById("weight").value);
        const result = document.getElementById("sizeResult");

        if (!petType || !weight || petType === "OTHER") {
          result.classList.remove("show");
          return;
        }

        let sizeLabel, bathCode, blowCode;
        if (petType === "DOG") {
          if (weight <= 15) {
            sizeLabel = "小型犬";
            bathCode = "BATH_S";
            blowCode = "BLOW_S";
          } else {
            sizeLabel = "大型犬";
            bathCode = "BATH_L";
            blowCode = "BLOW_L";
          }
        } else {
          if (weight <= 5) {
            sizeLabel = "小貓";
            bathCode = "BATH_CS";
            blowCode = "BLOW_CS";
          } else {
            sizeLabel = "大貓";
            bathCode = "BATH_CL";
            blowCode = "BLOW_CL";
          }
        }

        document.getElementById("sizeLabel").textContent = `體型：${sizeLabel}`;
        document.getElementById("sizeItems").textContent =
          `預約時將自動帶入：洗澡（${bathCode}）＋ 吹毛（${blowCode}）`;
        result.classList.add("show");
      }

      async function submitForm() {
        if (!jwtToken) {
          showToast("請先登入", "error");
          return;
        }

        const name = document.getElementById("petName").value.trim();
        const breed = document.getElementById("breed").value.trim();
        const weight = parseFloat(document.getElementById("weight").value);
        const age = parseInt(document.getElementById("age").value);
        const phone = document.getElementById("ownerPhone").value.trim();
        const notes = document.getElementById("notes").value.trim();

        if (!formData.petType) {
          showToast("請選擇毛孩類型", "error");
          return;
        }
        if (!name) {
          showToast("請填寫毛孩名字", "error");
          return;
        }
        if (!breed) {
          showToast("請填寫品種", "error");
          return;
        }
        if (!weight || weight <= 0) {
          showToast("請填寫正確體重", "error");
          return;
        }
        if (age === null || isNaN(age)) {
          showToast("請填寫年齡", "error");
          return;
        }
        if (!phone) {
          showToast("請填寫家長手機", "error");
          return;
        }
        if (formData.anxiety === null) {
          showToast("請選擇是否有分離焦慮", "error");
          return;
        }

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "新增中...";

        try {
          const res = await fetch("/api/pets", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + jwtToken,
            },
            body: JSON.stringify({
              name,
              breed,
              weight,
              age,
              petType: formData.petType,
              hasSeparationAnxiety: formData.anxiety === "true",
              ownerPhone: phone,
              notes: notes || null,
              gender: formData.gender || null,
              isNeutered: formData.neutered === "true",
              hasChip: formData.hasChip === "true",
              chipNumber: document.getElementById("chipNumber").value.trim() || null,
              personalityTags: formData.personality.join(",") || null,
              healthHistory: formData.health.join(",") || null,
              healthHistoryOther: document.getElementById("healthOther").value.trim() || null,
              hasDesignatedVet: formData.hasVet === "true",
              designatedVetName: document.getElementById("vetName").value.trim() || null,
              designatedVetAddress: document.getElementById("vetAddress").value.trim() || null,
              designatedVetPhone: document.getElementById("vetPhone").value.trim() || null,
            }),
          });

          const data = await res.json();
          if (!res.ok) {
            showToast("新增失敗：" + (data.message || res.status), "error");
            return;
          }

          // 若有選照片，寵物建立成功後立即上傳（拿到 data.id 才能傳）
          const photoFile = document.getElementById("petPhoto").files[0];
          if (photoFile) {
            try {
              const photoFormData = new FormData();
              photoFormData.append("file", photoFile);
              const photoRes = await fetch("/api/pets/" + data.id + "/photo", {
                method: "POST",
                headers: { Authorization: "Bearer " + jwtToken },
                body: photoFormData,
              });
              if (!photoRes.ok) {
                // 寵物本身已經建立成功，照片上傳失敗不影響新增結果，只是提醒可以之後在「我的毛孩」補傳
                showToast(
                  "✅ " + data.name + " 已新增，但照片上傳失敗，可到「我的毛孩」重新上傳",
                  "error",
                );
              } else {
                showToast(
                  "✅ " + data.name + " 已成功新增！體型判斷：" + data.sizeCategoryLabel,
                  "success",
                );
              }
            } catch (photoErr) {
              showToast(
                "✅ " + data.name + " 已新增，但照片上傳失敗，可到「我的毛孩」重新上傳",
                "error",
              );
            }
          } else {
            showToast(
              "✅ " +
                data.name +
                " 已成功新增！體型判斷：" +
                data.sizeCategoryLabel,
              "success",
            );
          }
          setTimeout(() => {
            // 新增成功後清空表單
            document.getElementById("petName").value = "";
            document.getElementById("breed").value = "";
            document.getElementById("weight").value = "";
            document.getElementById("age").value = "";
            document.getElementById("petPhoto").value = "";
            document.getElementById("petPhotoPreview").style.display = "none";
            document.getElementById("ownerPhone").value = "";
            document.getElementById("notes").value = "";
            document
              .querySelectorAll(".radio-btn")
              .forEach((b) => b.classList.remove("selected"));
            Object.keys(formData).forEach((k) => (formData[k] = null));
            document.getElementById("sizeResult").classList.remove("show");
          }, 2000);
        } catch (e) {
          showToast("網路錯誤，請重試", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "確認新增毛孩";
        }
      }

      function showToast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast show " + type;
        setTimeout(() => el.classList.remove("show"), 3000);
      }

      // 選照片後立即預覽
      document.getElementById("petPhoto").addEventListener("change", function () {
        const file = this.files[0];
        const box = document.getElementById("petPhotoPreview");
        const img = document.getElementById("petPhotoPreviewImg");
        if (!file) {
          box.style.display = "none";
          return;
        }
        const reader = new FileReader();
        reader.onload = function (e) {
          img.src = e.target.result;
          box.style.display = "block";
        };
        reader.readAsDataURL(file);
      });

      init();
    </script>
  </body>
</html>
