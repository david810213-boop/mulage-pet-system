<!doctype html>
<html lang="zh-Hant">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>綁定LINE | 慕沐村Mulage pet</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <link rel="stylesheet" href="/liff/liff-theme.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
      }
      .card {
        background: linear-gradient(180deg, #fff, #fbf9f5);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        padding: 28px 22px 24px;
        box-shadow: var(--shadow-float);
        max-width: 380px;
        width: 100%;
        margin: 0 auto;
        text-align: center;
      }
      .card .mark {
        width: 40px;
        height: 40px;
        margin: 0 auto 14px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gold-light), var(--gold) 60%, var(--wood-deep));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: "Noto Serif TC", serif;
        font-size: 15px;
        font-weight: 600;
      }
      h1 {
        font-family: "Noto Serif TC", serif;
        font-size: 17px;
        font-weight: 600;
        color: var(--primary-deep);
        margin-bottom: 8px;
        letter-spacing: 0.5px;
      }
      .sub {
        font-size: 12.5px;
        color: var(--ink-soft);
        margin-bottom: 24px;
        line-height: 1.7;
        text-align: left;
      }
      label {
        display: block;
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 1px;
        color: var(--ink-faint);
        margin-bottom: 8px;
        text-transform: lowercase;
        text-align: left;
      }
      input {
        width: 100%;
        padding: 13px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-sm);
        font-family: "Noto Serif TC", serif;
        font-size: 22px;
        letter-spacing: 6px;
        text-align: center;
        margin-bottom: 16px;
        color: var(--ink);
        background: #fffefd;
        outline: none;
      }
      input:focus {
        border-color: var(--wood);
      }
      button {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        color: #3a2d16;
        border: none;
        border-radius: 999px;
        font-family: "Jost", sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(198, 160, 99, 0.4);
      }
      button:disabled {
        opacity: 0.5;
      }
      .msg {
        margin-top: 16px;
        text-align: center;
        font-size: 13px;
        padding: 10px;
        border-radius: var(--radius-sm);
        display: none;
      }
      .msg.success {
        background: var(--done-bg);
        color: var(--done-fg);
        display: block;
      }
      .msg.error {
        background: var(--cancel-bg);
        color: var(--cancel-fg);
        display: block;
      }
      .loading {
        text-align: center;
        color: var(--ink-faint);
        font-family: "Jost", sans-serif;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">慕</div>
      <h1>綁定 LINE 帳號</h1>
      <p class="sub">
        請輸入在後台「綁定LINE」頁面產生的 6 位數驗證碼，綁定成功後，系統通知（例如低庫存提醒）就會發到這支手機。
      </p>

      <div id="loadingBox" class="loading">LINE 登入中...</div>

      <div id="formBox" style="display: none;">
        <label>驗證碼</label>
        <input type="text" id="codeInput" inputmode="numeric" maxlength="6" placeholder="6 位數字" />
        <button id="submitBtn" onclick="submitBind()">綁定</button>
        <div id="msgBox" class="msg"></div>
      </div>
    </div>

    <script>
      const LIFF_ID = "2010567973-bNNfTiV9"; // 綁定用 LIFF App，Endpoint URL 指到本頁

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: window.location.href });
            return;
          }
          document.getElementById("loadingBox").style.display = "none";
          document.getElementById("formBox").style.display = "block";
        } catch (e) {
          document.getElementById("loadingBox").textContent = "初始化失敗：" + e.message;
        }
      }

      async function submitBind() {
        const code = document.getElementById("codeInput").value.trim();
        const msgBox = document.getElementById("msgBox");
        const btn = document.getElementById("submitBtn");

        if (!/^\d{6}$/.test(code)) {
          msgBox.textContent = "請輸入 6 位數字驗證碼";
          msgBox.className = "msg error";
          return;
        }

        btn.disabled = true;
        btn.textContent = "綁定中...";

        try {
          const idToken = liff.getIDToken();
          const res = await fetch("/api/line/bind", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idToken: idToken, code: code }),
          });

          // 需求（追加）：後端失敗時回傳的是純文字（不是 JSON），先讀成文字，
          // 能解析成 JSON 就當 JSON 用，不能解析就直接顯示原始文字——
          // 不要再吞掉真正的錯誤原因，永遠只顯示同一句備援文字。
          const rawText = await res.text();
          let data = null;
          try { data = JSON.parse(rawText); } catch (e) { data = null; }

          if (!res.ok) {
            msgBox.textContent = "綁定失敗：" + (data && data.message ? data.message : (rawText || "請確認驗證碼是否正確"));
            msgBox.className = "msg error";
            btn.disabled = false;
            btn.textContent = "綁定";
            return;
          }

          msgBox.textContent = "✅ 綁定成功！" + (data && data.name ? "（" + data.name + "）" : "") + " 可以關閉此頁面了。";
          msgBox.className = "msg success";
          btn.style.display = "none";
        } catch (e) {
          msgBox.textContent = "綁定失敗：" + e.message;
          msgBox.className = "msg error";
          btn.disabled = false;
          btn.textContent = "綁定";
        }
      }

      init();
    </script>
  </body>
</html>
