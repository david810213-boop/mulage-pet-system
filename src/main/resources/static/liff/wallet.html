<!doctype html>
<html lang="zh-Hant">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會員錢包 | 慕沐村Mulage pet</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <link rel="stylesheet" href="/liff/liff-theme.css" />
    <style>
      body {
        padding-bottom: 100px;
      }

      /* 會員卡區塊：延用票券卡質感，但這裡是唯讀顯示，不做成 <a> 票券樣式 */
      .card-section {
        margin: 0 20px;
        background: linear-gradient(180deg, #fff, #fbf9f5);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-float);
      }
      .card-tier {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .tier-badge {
        font-family: "Jost", sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.5px;
        padding: 5px 13px;
        border-radius: 999px;
        text-transform: lowercase;
        background: var(--paper-2);
        color: var(--ink-faint);
      }
      .tier-badge.none {
        background: var(--paper-2);
        color: var(--ink-faint);
      }
      .tier-badge.village {
        background: var(--done-bg);
        color: var(--done-fg);
      }
      .tier-badge.normal {
        background: #eef0ee;
        color: #4a5a52;
      }
      .tier-badge.gold {
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        color: #4a3416;
      }
      .tier-badge.diamond {
        background: #e8eaf6;
        color: #33396b;
      }
      .tier-badge.vip {
        background: var(--primary-deep);
        color: var(--gold-light);
      }

      .card-info {
        flex: 1;
      }
      .card-info .discount {
        font-family: "Noto Serif TC", serif;
        font-size: 18px;
        font-weight: 700;
        color: var(--wood-deep);
      }
      .card-info .expire {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        color: var(--ink-faint);
        margin-top: 3px;
        letter-spacing: 0.3px;
      }

      .balance-row {
        border-top: 1px solid var(--line-soft);
        padding-top: 16px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .balance-label {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        color: var(--ink-soft);
        letter-spacing: 0.5px;
      }
      .balance-amount {
        font-family: "Noto Serif TC", serif;
        font-size: 30px;
        font-weight: 700;
        color: var(--primary-deep);
      }
      .balance-unit {
        font-size: 13px;
        color: var(--ink-soft);
      }

      /* 會員等級進度 */
      .tier-progress {
        margin: 16px 20px 0;
        background: #fff;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        padding: 18px;
        box-shadow: var(--shadow-card);
      }
      .tier-progress h3 {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        color: var(--ink-faint);
        letter-spacing: 1px;
        text-transform: lowercase;
        margin-bottom: 12px;
      }
      .tier-item {
        display: flex;
        align-items: center;
        padding: 9px 0;
        border-bottom: 1px solid var(--line-soft);
        gap: 10px;
      }
      .tier-item:last-child {
        border-bottom: none;
      }
      .tier-item .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--line);
        flex-shrink: 0;
      }
      .tier-item.active .dot {
        background: var(--wood);
      }
      .tier-item .name {
        flex: 1;
        font-size: 13.5px;
        font-family: "Noto Sans TC", sans-serif;
        color: var(--ink-soft);
      }
      .tier-item.active .name {
        font-weight: 600;
        color: var(--ink);
      }
      .tier-item .amount {
        font-family: "Jost", sans-serif;
        font-size: 11px;
        color: var(--ink-faint);
      }
      .tier-item .perk {
        font-size: 11px;
        color: var(--wood-deep);
        font-weight: 700;
      }

      /* 交易紀錄 */
      .transactions {
        margin: 16px 20px 80px;
        background: #fff;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        padding: 18px;
        box-shadow: var(--shadow-card);
      }
      .transactions h3 {
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        color: var(--ink-faint);
        letter-spacing: 1px;
        text-transform: lowercase;
        margin-bottom: 12px;
      }
      .tx-item {
        display: flex;
        align-items: center;
        padding: 11px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      .tx-item:last-child {
        border-bottom: none;
      }
      .tx-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        margin-right: 11px;
        flex-shrink: 0;
      }
      .tx-icon.deposit {
        background: var(--done-bg);
      }
      .tx-icon.deduct {
        background: var(--cancel-bg);
      }
      .tx-body {
        flex: 1;
        min-width: 0;
      }
      .tx-note {
        font-size: 13.5px;
        color: var(--ink);
        font-family: "Noto Serif TC", serif;
        font-weight: 500;
      }
      .tx-date {
        font-family: "Jost", sans-serif;
        font-size: 10px;
        color: var(--ink-faint);
        margin-top: 3px;
      }
      .tx-amount {
        font-family: "Noto Serif TC", serif;
        font-size: 14.5px;
        font-weight: 700;
      }
      .tx-amount.plus {
        color: var(--done-fg);
      }
      .tx-amount.minus {
        color: var(--cancel-fg);
      }

      .empty {
        text-align: center;
        padding: 24px;
        color: var(--ink-faint);
        font-family: "Jost", sans-serif;
        font-size: 12px;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: var(--ink-faint);
        font-family: "Jost", sans-serif;
        font-size: 12px;
      }

      .toast {
        position: fixed;
        bottom: 92px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary-deep);
        color: #fff;
        padding: 10px 20px;
        border-radius: 999px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        white-space: nowrap;
        z-index: 999;
        box-shadow: 0 8px 20px rgba(38, 51, 43, 0.3);
      }
      .toast.show {
        opacity: 1;
      }

      .fab-home {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--primary-deep);
        box-shadow: 0 8px 20px rgba(38, 51, 43, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 500;
        border: 2px solid var(--gold);
      }
      .fab-home-icon {
        font-size: 20px;
        line-height: 1;
      }
      .fab-home:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="idband">
      <span><span class="dot"></span>mulage pet</span>
      <span>會員錢包</span>
    </div>

    <div class="page-head">
      <a class="back" href="/liff/index.html">‹</a>
      <div class="titles">
        <div class="cn">會員錢包</div>
        <div class="en">wallet</div>
      </div>
    </div>

    <a href="/liff/index.html" class="fab-home" aria-label="返回首頁">
      <span class="fab-home-icon">🏠</span>
    </a>

    <div id="app" style="margin-top: 18px">
      <div class="loading">載入中...</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const LIFF_ID = "2010567973-6CDDTk3W";
      let jwtToken = null;

      // --- 初始化流程 ---
      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: window.location.href });
            return;
          }

          const idToken = liff.getIDToken();
          if (!idToken) {
            showError("取得 idToken 失敗，請確認 LIFF 設定");
            return;
          }

          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true", // ← 加這行
            },
            body: JSON.stringify({ idToken }),
          });

          const data = await res.json().catch(() => null);
          if (!res.ok) {
            showError("登入失敗：" + (data?.message || res.status));
            return;
          }

          // 同時嘗試讀取 token 或 jwtToken，避免後端欄位沒對齊
          jwtToken = data?.token || data?.jwtToken || data?.accessToken;
          await loadWallet();
        } catch (e) {
          showError("初始化失敗：" + e.message);
        }
      }

      // --- API 請求助手 ---
      async function api(path) {
        const res = await fetch(path, {
          headers: {
            Authorization: "Bearer " + jwtToken,
            "ngrok-skip-browser-warning": "true", // ← 加這行
          },
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }

      async function loadWallet() {
        try {
          // 1. 檢查 Token 是否存在
          if (!jwtToken) {
            showError("載入失敗：未取得有效的登入憑證");
            return;
          }

          // 2. 真正向後端發送請求（循序呼叫，獲取錢包與交易紀錄）
          const wallet = await api("/api/wallet");
          const txList = await api("/api/wallet/transactions");

          // 3. 成功拿到資料後，渲染畫面
          render(wallet, txList);
          loadMyTopUps(); // 需求 1：載入儲值申請狀態
          loadBankAccountInfo(); // 需求 21：載入匯款帳號資訊 + 收款 QR Code（原本是寫死的假資料）
        } catch (e) {
          // 這裡保留 e.message，如果後端真的噴 401/500，畫面上會顯示具體的 HTTP 狀態碼
          showError("載入失敗：" + (e.message || "未知錯誤"));
        }
      }

      // --- UI 渲染邏輯 ---
      function tierClass(tier) {
        const map = {
          NONE: "none",
          VILLAGE: "village",
          NORMAL: "normal",
          GOLD: "gold",
          DIAMOND: "diamond",
          VIP: "vip",
        };
        return map[tier] || "none";
      }

      function discountLabel(discount) {
        if (discount >= 1.0) return "無折扣";
        return Math.round(discount * 100) + "折";
      }

      function render(wallet, txList) {
        const tiers = [
          {
            key: "VILLAGE",
            label: "村民優惠方案",
            amount: "$5,000",
            perk: "贈$200",
          },
          { key: "NORMAL", label: "普卡", amount: "$8,000", perk: "95折" },
          { key: "GOLD", label: "金卡", amount: "$15,000", perk: "9折" },
          { key: "DIAMOND", label: "鑽石卡", amount: "$30,000", perk: "88折" },
          { key: "VIP", label: "慕沐村VIP", amount: "$50,000", perk: "85折" },
        ];

        const tierOrder = [
          "NONE",
          "VILLAGE",
          "NORMAL",
          "GOLD",
          "DIAMOND",
          "VIP",
        ];
        const currentRank = tierOrder.indexOf(wallet.cardTier);

        const expireText = wallet.cardActive
          ? `有效期限至 ${wallet.cardExpiresAt}`
          : wallet.cardActivatedAt
            ? "會員資格已到期"
            : "尚未開卡";

        const discText = wallet.cardActive
          ? discountLabel(wallet.discount)
          : "—";

        // 等級進度 HTML
        const tierHTML = tiers
          .map((t) => {
            const rank = tierOrder.indexOf(t.key);
            const active = rank <= currentRank && currentRank > 0;
            return `
                <div class="tier-item ${active ? "active" : ""}">
                    <div class="dot"></div>
                    <div class="name">${t.label}</div>
                    <div class="amount">${t.amount}</div>
                    <div class="perk">${t.perk}</div>
                </div>`;
          })
          .join("");

        // 交易紀錄 HTML
        const txHTML =
          txList.length === 0
            ? '<div class="empty">暫無消費紀錄</div>'
            : txList
                .map((tx) => {
                  const isPlus = tx.amount > 0;
                  const icon = isPlus ? "💰" : "🛍️";
                  const date = new Date(tx.createdAt).toLocaleDateString(
                    "zh-TW",
                  );
                  return `
                    <div class="tx-item">
                        <div class="tx-icon ${isPlus ? "deposit" : "deduct"}">${icon}</div>
                        <div class="tx-body">
                            <div class="tx-note">${tx.note || tx.typeLabel}</div>
                            <div class="tx-date">${date} 餘額 $${tx.balanceAfter.toLocaleString()}</div>
                        </div>
                        <div class="tx-amount ${isPlus ? "plus" : "minus"}">
                            ${isPlus ? "+" : ""}$${Math.abs(tx.amount).toLocaleString()}
                        </div>
                    </div>`;
                })
                .join("");

        // 最終組合頁面
        document.getElementById("app").innerHTML = `
                <div class="card-section">
                    <div class="card-tier">
                        <div class="tier-badge ${tierClass(wallet.cardTier)}">${wallet.cardTierLabel}</div>
                        <div class="card-info">
                            <div class="discount">${discText}</div>
                            <div class="expire">${expireText}</div>
                        </div>
                    </div>
                    <div class="balance-row">
                        <div class="balance-label">儲值餘額</div>
                        <div class="balance-amount">$${wallet.balance.toLocaleString()}</div>
                        <div class="balance-unit">元</div>
                    </div>
                </div>

                <!-- 需求 1：線上儲值僅限轉帳 -->
                <div class="topup-card" style="margin:16px; background:#fff; border:1px solid var(--line-soft); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-card);">
                    <h3 style="font-family:'Noto Serif TC',serif; font-size:14px; font-weight:600; color:var(--primary-deep); letter-spacing:1px; margin-bottom:12px;">線上儲值（限轉帳）</h3>
                    <div id="bankAccountInfoBox" style="background:var(--paper-2); border-radius:var(--radius-sm); padding:12px; font-size:12.5px; color:var(--ink-soft); line-height:1.7; margin-bottom:14px; font-family:'Noto Sans TC',sans-serif;">
                        載入轉帳資訊中...
                    </div>
                    <div class="field" style="margin-bottom:10px;">
                        <select id="topupAmount"
                            style="width:100%; padding:11px 13px; border:1px solid var(--line-soft); border-radius:var(--radius-sm); font-size:14.5px; background:#fffefd; font-family:'Noto Sans TC',sans-serif;">
                            <option value="">請選擇儲值金額</option>
                            <option value="5000">$5,000（村民優惠方案）</option>
                            <option value="8000">$8,000（普卡）</option>
                            <option value="15000">$15,000（金卡）</option>
                            <option value="30000">$30,000（鑽石卡）</option>
                            <option value="50000">$50,000（慕沐村VIP）</option>
                        </select>
                    </div>
                    <div class="field" style="margin-bottom:10px;">
                        <input id="topupLast5" type="text" maxlength="5" placeholder="匯款帳號後五碼"
                            style="width:100%; padding:11px 13px; border:1px solid var(--line-soft); border-radius:var(--radius-sm); font-size:14.5px; font-family:'Noto Sans TC',sans-serif;" />
                    </div>
                    <div class="field" style="margin-bottom:12px;">
                        <input id="topupNote" type="text" placeholder="轉帳時間 / 備註（例：01/15 14:30）"
                            style="width:100%; padding:11px 13px; border:1px solid var(--line-soft); border-radius:var(--radius-sm); font-size:14.5px; font-family:'Noto Sans TC',sans-serif;" />
                    </div>
                    <button onclick="submitTopUp()"
                        style="width:100%; padding:13px; background:linear-gradient(135deg,var(--gold-light),var(--gold)); color:#3a2d16; border:none; border-radius:999px; font-size:14px; font-weight:600; font-family:'Jost',sans-serif; letter-spacing:0.3px; box-shadow:0 6px 14px rgba(198,160,99,0.4);">
                        送出儲值申請
                    </button>
                    <div id="topupList" style="margin-top:14px;"></div>
                </div>

                <div class="tier-progress">
                    <h3>會員等級說明</h3>
                    ${tierHTML}
                </div>

                <div class="transactions">
                    <h3>消費與儲值紀錄</h3>
                    ${txHTML}
                </div>

                <div style="display:flex; gap:8px; margin:16px 0 8px; justify-content:center;">
                    <a href="/liff/my-pets.html" style="flex:1; padding:12px; background:#fff; border:1px solid var(--line-soft); border-radius:var(--radius-md); text-align:center; font-size:12.5px; color:var(--primary-deep); text-decoration:none; font-family:'Jost',sans-serif;">我的毛孩</a>
                    <a href="/liff/my-appointments.html" style="flex:1; padding:12px; background:#fff; border:1px solid var(--line-soft); border-radius:var(--radius-md); text-align:center; font-size:12.5px; color:var(--primary-deep); text-decoration:none; font-family:'Jost',sans-serif;">我的預約</a>
                </div>`;
      }

      // 需求 1：送出線上轉帳儲值申請（餘額不會立即變動，待店家核帳）
      async function submitTopUp() {
        const amount = parseInt(
          document.getElementById("topupAmount").value,
          10,
        );
        const last5 = document.getElementById("topupLast5").value.trim();
        const note = document.getElementById("topupNote").value.trim();
        if (!amount || amount <= 0) {
          showToast("請選擇儲值金額");
          return;
        }
        try {
          const res = await fetch("/api/topup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + jwtToken,
            },
            body: JSON.stringify({
              amount,
              lastFiveDigits: last5,
              remitNote: note,
            }),
          });
          if (!res.ok) {
            showToast((await res.text()) || "送出失敗");
            return;
          }
          document.getElementById("topupAmount").value = "";
          document.getElementById("topupLast5").value = "";
          document.getElementById("topupNote").value = "";
          showToast("已送出，待店家核帳後入帳");
          loadMyTopUps();
        } catch (e) {
          showToast("送出失敗，請稍後再試");
        }
      }

      // 需求 21：載入匯款帳號資訊 + 收款 QR Code（原本是寫死在頁面上的假資料）
      async function loadBankAccountInfo() {
        const box = document.getElementById("bankAccountInfoBox");
        if (!box) return;
        try {
          const info = await api("/api/payments/bank-account");
          box.innerHTML =
            "轉帳資訊<br/>" +
            "銀行：" + (info.bankName || "尚未設定") + "<br/>" +
            "帳號：<b>" + (info.accountNumber || "尚未設定") + "</b><br/>" +
            "戶名：" + (info.accountHolder || "尚未設定") + "<br/>" +
            (info.qrCodeUrl
              ? '<img src="' + info.qrCodeUrl + '" style="width:140px;height:140px;object-fit:contain;border:1px solid #e3dccc;border-radius:8px;margin-top:8px;display:block;" />'
              : "") +
            '<span style="color:var(--ink-faint);">※ 轉帳後請填寫下方資訊送出，店家核帳後入帳。</span>';
        } catch (e) {
          box.innerHTML = '<span style="color:#8B0000;">轉帳資訊載入失敗，請稍後重試</span>';
        }
      }

      // 需求 1：載入自己的儲值申請狀態
      async function loadMyTopUps() {
        try {
          const res = await fetch("/api/topup/my", {
            headers: { Authorization: "Bearer " + jwtToken },
          });
          if (!res.ok) return;
          const list = await res.json();
          const box = document.getElementById("topupList");
          if (!box) return;
          if (!list.length) {
            box.innerHTML = "";
            return;
          }
          box.innerHTML =
            '<div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;">近期申請</div>' +
            list
              .slice(0, 5)
              .map(function (r) {
                var color =
                  r.status === "CONFIRMED"
                    ? "#2D5A27"
                    : r.status === "REJECTED"
                      ? "#8B0000"
                      : "#8A5A00";
                return (
                  '<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft);">' +
                  "<span>$" +
                  r.amount.toLocaleString() +
                  "</span>" +
                  '<span style="color:' +
                  color +
                  ';">' +
                  r.statusLabel +
                  "</span></div>"
                );
              })
              .join("");
        } catch (e) {
          /* 靜默 */
        }
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        if (!t) {
          return;
        }
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(function () {
          t.classList.remove("show");
        }, 2500);
      }

      function showError(msg) {
        document.getElementById("app").innerHTML =
          `<div class="loading" style="color:#8B0000">${msg}</div>`;
      }

      init();
    </script>
  </body>
</html>
