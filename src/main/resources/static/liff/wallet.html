<!doctype html>
<html lang="zh-Hant">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>慕沐村Mulage pet</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <style>
      /* 基本重置 */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Noto Serif TC",
          -apple-system,
          BlinkMacSystemFont,
          serif;
        background: #f6f2ea;
        min-height: 100vh;
        padding-bottom: 90px;
      }

      /* 頂部 Header */
      .header {
        background: #2b2a28;
        color: #d9be8f;
        padding: 20px 16px 28px;
        text-align: center;
      }
      .header .logo {
        font-size: 13px;
        opacity: 0.8;
        margin-bottom: 4px;
      }
      .header h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* 會員卡區塊 */
      .card-section {
        margin: -16px 16px 0;
        background: white;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      }
      .card-tier {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .tier-badge {
        background: linear-gradient(135deg, #b8935a, #d9be8f);
        color: #2b2a28;
        font-weight: 700;
        font-size: 13px;
        padding: 4px 12px;
        border-radius: 20px;
      }
      .tier-badge.none {
        background: #e0e0e0;
        color: #666;
      }
      .tier-badge.village {
        background: linear-gradient(135deg, #8bc34a, #c5e1a5);
        color: #33691e;
      }
      .tier-badge.normal {
        background: linear-gradient(135deg, #90a4ae, #cfd8dc);
        color: #37474f;
      }
      .tier-badge.gold {
        background: linear-gradient(135deg, #b8935a, #d9be8f);
        color: #5d4037;
      }
      .tier-badge.diamond {
        background: linear-gradient(135deg, #7986cb, #c5cae9);
        color: #1a237e;
      }
      .tier-badge.vip {
        background: #2b2a28;
        color: #d9be8f;
      }

      .card-info {
        flex: 1;
      }
      .card-info .discount {
        font-size: 18px;
        font-weight: 700;
        color: #b8935a;
      }
      .card-info .expire {
        font-size: 12px;
        color: #8a8072;
        margin-top: 2px;
      }

      .balance-row {
        border-top: 1px solid #ede5d3;
        padding-top: 16px;
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .balance-label {
        font-size: 13px;
        color: #666;
      }
      .balance-amount {
        font-size: 32px;
        font-weight: 700;
        color: #2b2a28;
      }
      .balance-unit {
        font-size: 14px;
        color: #666;
      }

      /* 會員等級進度 */
      .tier-progress {
        margin: 16px 16px 0;
        background: white;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .tier-progress h3 {
        font-size: 14px;
        color: #666;
        margin-bottom: 12px;
      }
      .tier-item {
        display: flex;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #f5f5f5;
        gap: 10px;
      }
      .tier-item:last-child {
        border-bottom: none;
      }
      .tier-item .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #e0e0e0;
        flex-shrink: 0;
      }
      .tier-item.active .dot {
        background: #b8935a;
      }
      .tier-item .name {
        flex: 1;
        font-size: 14px;
      }
      .tier-item.active .name {
        font-weight: 700;
        color: #2b2a28;
      }
      .tier-item .amount {
        font-size: 12px;
        color: #8a8072;
      }
      .tier-item .perk {
        font-size: 12px;
        color: #b8935a;
        font-weight: 600;
      }

      /* 交易紀錄 */
      .transactions {
        margin: 16px 16px 80px;
        background: white;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .transactions h3 {
        font-size: 14px;
        color: #666;
        margin-bottom: 12px;
      }
      .tx-item {
        display: flex;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #f5f5f5;
      }
      .tx-item:last-child {
        border-bottom: none;
      }
      .tx-icon {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        margin-right: 10px;
        flex-shrink: 0;
      }
      .tx-icon.deposit {
        background: #e8f5e9;
      }
      .tx-icon.deduct {
        background: #fce4ec;
      }
      .tx-body {
        flex: 1;
      }
      .tx-note {
        font-size: 14px;
        color: #2b2a28;
      }
      .tx-date {
        font-size: 11px;
        color: #bbb;
        margin-top: 2px;
      }
      .tx-amount {
        font-size: 15px;
        font-weight: 700;
      }
      .tx-amount.plus {
        color: #43a047;
      }
      .tx-amount.minus {
        color: #e53935;
      }

      .empty {
        text-align: center;
        padding: 24px;
        color: #bbb;
        font-size: 14px;
      }
      .loading {
        text-align: center;
        padding: 40px;
        color: #bbb;
      }

      /* 錯誤/提示訊息 */
      .toast {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: #2b2a28;
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        white-space: nowrap;
      }
      .toast.show {
        opacity: 1;
      }

      /* 固定浮動的返回首頁按鈕：畫面中下方，捲動頁面時位置不變 */
      .fab-home {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: #2b2a28;
        box-shadow: 0 4px 14px rgba(44, 24, 16, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 500;
      }
      .fab-home-icon {
        font-size: 22px;
        line-height: 1;
      }
      .fab-home:active {
        opacity: 0.8;
      }
    </style>
    <link rel="stylesheet" href="/liff/liff-warm.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">慕沐村 Mulage pet</div>
      <h1>會員錢包</h1>
    </div>

    <a href="/liff/index.html" class="fab-home" aria-label="返回首頁">
      <span class="fab-home-icon">🏠</span>
    </a>

    <div id="app">
      <div class="loading">載入中...</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const LIFF_ID = "2010567973-ygHvpq7X";
      let jwtToken = null;

      // --- 初始化流程 ---
      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }

          const idToken = liff.getIDToken();
          if (!idToken) {
            showError("取得 idToken 失敗，請確認 LIFF 設定");
            return;
          }

          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true", // ← 加這行
            },
            body: JSON.stringify({ idToken }),
          });

          const data = await res.json().catch(() => null);
          if (!res.ok) {
            showError("登入失敗：" + (data?.message || res.status));
            return;
          }

          // 同時嘗試讀取 token 或 jwtToken，避免後端欄位沒對齊
          jwtToken = data?.token || data?.jwtToken || data?.accessToken;
          await loadWallet();
        } catch (e) {
          showError("初始化失敗：" + e.message);
        }
      }

      // --- API 請求助手 ---
      async function api(path) {
        const res = await fetch(path, {
          headers: {
            Authorization: "Bearer " + jwtToken,
            "ngrok-skip-browser-warning": "true", // ← 加這行
          },
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }

      async function loadWallet() {
        try {
          // 1. 檢查 Token 是否存在
          if (!jwtToken) {
            showError("載入失敗：未取得有效的登入憑證");
            return;
          }

          // 2. 真正向後端發送請求（循序呼叫，獲取錢包與交易紀錄）
          const wallet = await api("/api/wallet");
          const txList = await api("/api/wallet/transactions");

          // 3. 成功拿到資料後，渲染畫面
          render(wallet, txList);
          loadMyTopUps(); // 需求 1：載入儲值申請狀態
          loadBankAccountInfo(); // 需求 21：載入匯款帳號資訊 + 收款 QR Code（原本是寫死的假資料）
        } catch (e) {
          // 這裡保留 e.message，如果後端真的噴 401/500，畫面上會顯示具體的 HTTP 狀態碼
          showError("載入失敗：" + (e.message || "未知錯誤"));
        }
      }

      // --- UI 渲染邏輯 ---
      function tierClass(tier) {
        const map = {
          NONE: "none",
          VILLAGE: "village",
          NORMAL: "normal",
          GOLD: "gold",
          DIAMOND: "diamond",
          VIP: "vip",
        };
        return map[tier] || "none";
      }

      function discountLabel(discount) {
        if (discount >= 1.0) return "無折扣";
        return Math.round(discount * 100) + "折";
      }

      function render(wallet, txList) {
        const tiers = [
          {
            key: "VILLAGE",
            label: "村民優惠方案",
            amount: "$5,000",
            perk: "贈$200",
          },
          { key: "NORMAL", label: "普卡", amount: "$8,000", perk: "95折" },
          { key: "GOLD", label: "金卡", amount: "$15,000", perk: "9折" },
          { key: "DIAMOND", label: "鑽石卡", amount: "$30,000", perk: "88折" },
          { key: "VIP", label: "慕沐村VIP", amount: "$50,000", perk: "85折" },
        ];

        const tierOrder = [
          "NONE",
          "VILLAGE",
          "NORMAL",
          "GOLD",
          "DIAMOND",
          "VIP",
        ];
        const currentRank = tierOrder.indexOf(wallet.cardTier);

        const expireText = wallet.cardActive
          ? `有效期限至 ${wallet.cardExpiresAt}`
          : wallet.cardActivatedAt
            ? "會員資格已到期"
            : "尚未開卡";

        const discText = wallet.cardActive
          ? discountLabel(wallet.discount)
          : "—";

        // 等級進度 HTML
        const tierHTML = tiers
          .map((t) => {
            const rank = tierOrder.indexOf(t.key);
            const active = rank <= currentRank && currentRank > 0;
            return `
                <div class="tier-item ${active ? "active" : ""}">
                    <div class="dot"></div>
                    <div class="name">${t.label}</div>
                    <div class="amount">${t.amount}</div>
                    <div class="perk">${t.perk}</div>
                </div>`;
          })
          .join("");

        // 交易紀錄 HTML
        const txHTML =
          txList.length === 0
            ? '<div class="empty">暫無消費紀錄</div>'
            : txList
                .map((tx) => {
                  const isPlus = tx.amount > 0;
                  const icon = isPlus ? "💰" : "🛍️";
                  const date = new Date(tx.createdAt).toLocaleDateString(
                    "zh-TW",
                  );
                  return `
                    <div class="tx-item">
                        <div class="tx-icon ${isPlus ? "deposit" : "deduct"}">${icon}</div>
                        <div class="tx-body">
                            <div class="tx-note">${tx.note || tx.typeLabel}</div>
                            <div class="tx-date">${date} 餘額 $${tx.balanceAfter.toLocaleString()}</div>
                        </div>
                        <div class="tx-amount ${isPlus ? "plus" : "minus"}">
                            ${isPlus ? "+" : ""}$${Math.abs(tx.amount).toLocaleString()}
                        </div>
                    </div>`;
                })
                .join("");

        // 最終組合頁面
        document.getElementById("app").innerHTML = `
                <div class="card-section">
                    <div class="card-tier">
                        <div class="tier-badge ${tierClass(wallet.cardTier)}">${wallet.cardTierLabel}</div>
                        <div class="card-info">
                            <div class="discount">${discText}</div>
                            <div class="expire">${expireText}</div>
                        </div>
                    </div>
                    <div class="balance-row">
                        <div class="balance-label">儲值餘額</div>
                        <div class="balance-amount">$${wallet.balance.toLocaleString()}</div>
                        <div class="balance-unit">元</div>
                    </div>
                </div>

                <!-- 需求 1：線上儲值僅限轉帳 -->
                <div class="topup-card" style="margin:16px; background:white; border-radius:12px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.06);">
                    <h3 style="font-size:15px; color:#2b2a28; margin-bottom:12px;">💳 線上儲值（限轉帳）</h3>
                    <div id="bankAccountInfoBox" style="background:#f6f2ea; border-radius:8px; padding:12px; font-size:13px; color:#454340; line-height:1.7; margin-bottom:14px;">
                        載入轉帳資訊中...
                    </div>
                    <div class="field" style="margin-bottom:10px;">
                        <input id="topupAmount" type="number" min="1" placeholder="儲值金額"
                            style="width:100%; padding:10px 12px; border:1px solid #e3dccc; border-radius:8px; font-size:15px;" />
                    </div>
                    <div class="field" style="margin-bottom:10px;">
                        <input id="topupLast5" type="text" maxlength="5" placeholder="匯款帳號後五碼"
                            style="width:100%; padding:10px 12px; border:1px solid #e3dccc; border-radius:8px; font-size:15px;" />
                    </div>
                    <div class="field" style="margin-bottom:12px;">
                        <input id="topupNote" type="text" placeholder="轉帳時間 / 備註（例：01/15 14:30）"
                            style="width:100%; padding:10px 12px; border:1px solid #e3dccc; border-radius:8px; font-size:15px;" />
                    </div>
                    <button onclick="submitTopUp()"
                        style="width:100%; padding:12px; background:linear-gradient(135deg,#454340,#2b2a28); color:#d9be8f; border:none; border-radius:8px; font-size:15px; font-weight:700;">
                        送出儲值申請
                    </button>
                    <div id="topupList" style="margin-top:14px;"></div>
                </div>

                <div class="tier-progress">
                    <h3>會員等級說明</h3>
                    ${tierHTML}
                </div>

                <div class="transactions">
                    <h3>消費與儲值紀錄</h3>
                    ${txHTML}
                </div>

                <div style="display:flex; gap:8px; margin:16px 0 8px; justify-content:center;">
                    <a href="/liff/my-pets.html" style="flex:1; padding:12px; background:#f6f2ea; border-radius:12px; text-align:center; font-size:13px; color:#454340; text-decoration:none;">🐾 我的毛孩</a>
                    <a href="/liff/my-appointments.html" style="flex:1; padding:12px; background:#f6f2ea; border-radius:12px; text-align:center; font-size:13px; color:#454340; text-decoration:none;">📋 我的預約</a>
                </div>`;
      }

      // 需求 1：送出線上轉帳儲值申請（餘額不會立即變動，待店家核帳）
      async function submitTopUp() {
        const amount = parseInt(
          document.getElementById("topupAmount").value,
          10,
        );
        const last5 = document.getElementById("topupLast5").value.trim();
        const note = document.getElementById("topupNote").value.trim();
        if (!amount || amount <= 0) {
          showToast("請輸入正確的儲值金額");
          return;
        }
        try {
          const res = await fetch("/api/topup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + jwtToken,
            },
            body: JSON.stringify({
              amount,
              lastFiveDigits: last5,
              remitNote: note,
            }),
          });
          if (!res.ok) {
            showToast((await res.text()) || "送出失敗");
            return;
          }
          document.getElementById("topupAmount").value = "";
          document.getElementById("topupLast5").value = "";
          document.getElementById("topupNote").value = "";
          showToast("已送出，待店家核帳後入帳");
          loadMyTopUps();
        } catch (e) {
          showToast("送出失敗，請稍後再試");
        }
      }

      // 需求 21：載入匯款帳號資訊 + 收款 QR Code（原本是寫死在頁面上的假資料）
      async function loadBankAccountInfo() {
        const box = document.getElementById("bankAccountInfoBox");
        if (!box) return;
        try {
          const info = await api("/api/payments/bank-account");
          box.innerHTML =
            "轉帳資訊<br/>" +
            "銀行：" + (info.bankName || "尚未設定") + "<br/>" +
            "帳號：<b>" + (info.accountNumber || "尚未設定") + "</b><br/>" +
            "戶名：" + (info.accountHolder || "尚未設定") + "<br/>" +
            (info.qrCodeUrl
              ? '<img src="' + info.qrCodeUrl + '" style="width:140px;height:140px;object-fit:contain;border:1px solid #e3dccc;border-radius:8px;margin-top:8px;display:block;" />'
              : "") +
            '<span style="color:#8a8072;">※ 轉帳後請填寫下方資訊送出，店家核帳後入帳。</span>';
        } catch (e) {
          box.innerHTML = '<span style="color:#c62828;">轉帳資訊載入失敗，請稍後重試</span>';
        }
      }

      // 需求 1：載入自己的儲值申請狀態
      async function loadMyTopUps() {
        try {
          const res = await fetch("/api/topup/my", {
            headers: { Authorization: "Bearer " + jwtToken },
          });
          if (!res.ok) return;
          const list = await res.json();
          const box = document.getElementById("topupList");
          if (!box) return;
          if (!list.length) {
            box.innerHTML = "";
            return;
          }
          box.innerHTML =
            '<div style="font-size:13px;color:#454340;margin-bottom:6px;">近期申請</div>' +
            list
              .slice(0, 5)
              .map(function (r) {
                var color =
                  r.status === "CONFIRMED"
                    ? "#2e7d32"
                    : r.status === "REJECTED"
                      ? "#e53935"
                      : "#b8860b";
                return (
                  '<div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #ede5d3;">' +
                  "<span>$" +
                  r.amount.toLocaleString() +
                  "</span>" +
                  '<span style="color:' +
                  color +
                  ';">' +
                  r.statusLabel +
                  "</span></div>"
                );
              })
              .join("");
        } catch (e) {
          /* 靜默 */
        }
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        if (!t) {
          return;
        }
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(function () {
          t.classList.remove("show");
        }, 2500);
      }

      function showError(msg) {
        document.getElementById("app").innerHTML =
          `<div class="loading" style="color:#e53935">${msg}</div>`;
      }

      init();
    </script>
  </body>
</html>
