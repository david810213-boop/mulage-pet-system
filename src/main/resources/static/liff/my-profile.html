<!doctype html>
<html lang="zh-Hant">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>編輯我的資料 | 慕沐村Mulage pet</title>
    <script
      charset="utf-8"
      src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <link rel="stylesheet" href="/liff/liff-theme.css" />
    <style>
      body {
        padding-bottom: 100px;
      }

      .notice {
        margin: 20px 20px 16px;
        background: var(--paper-2);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-md);
        padding: 15px 16px;
        font-size: 12.5px;
        color: var(--ink-soft);
        line-height: 1.8;
        font-family: "Noto Sans TC", sans-serif;
      }
      .notice .title {
        font-family: "Noto Serif TC", serif;
        font-weight: 600;
        color: var(--primary-deep);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
      }

      .form-card {
        margin: 0 20px 16px;
        background: #fff;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-lg);
        padding: 18px 18px 16px;
        box-shadow: var(--shadow-card);
      }
      .form-card h3 {
        font-family: "Noto Serif TC", serif;
        font-size: 14px;
        font-weight: 600;
        color: var(--primary-deep);
        letter-spacing: 1px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line-soft);
      }

      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-family: "Jost", sans-serif;
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.3px;
        color: var(--ink-soft);
        margin-bottom: 7px;
      }
      .field label .req {
        color: var(--cancel-fg);
        margin-left: 2px;
      }
      .field label .hint {
        color: var(--ink-faint);
        font-size: 10px;
        font-weight: 400;
        margin-left: 6px;
      }

      .field input,
      .field select {
        width: 100%;
        padding: 11px 13px;
        border: 1px solid var(--line-soft);
        border-radius: var(--radius-sm);
        font-size: 14.5px;
        color: var(--ink);
        background: #fffefd;
        outline: none;
        transition: border-color 0.15s;
        font-family: "Noto Sans TC", sans-serif;
      }
      .field input:focus,
      .field select:focus {
        border-color: var(--wood);
      }

      .submit-btn {
        display: block;
        width: calc(100% - 40px);
        margin: 0 20px;
        padding: 14px;
        background: linear-gradient(135deg, var(--gold-light), var(--gold));
        color: #3a2d16;
        border: none;
        border-radius: 999px;
        font-family: "Jost", sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(198, 160, 99, 0.4);
        transition: opacity 0.2s;
      }
      .submit-btn:active {
        opacity: 0.85;
      }
      .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary-deep);
        color: #fff;
        padding: 12px 22px;
        border-radius: 999px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
        white-space: nowrap;
        z-index: 999;
        box-shadow: 0 8px 20px rgba(38, 51, 43, 0.3);
      }
      .toast.show {
        opacity: 1;
      }
      .toast.success {
        background: var(--forest);
      }
      .toast.error {
        background: #8b3a3a;
      }

      .loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-faint);
        font-family: "Jost", sans-serif;
        font-size: 12px;
      }

      .fab-home {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--primary-deep);
        box-shadow: 0 8px 20px rgba(38, 51, 43, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        z-index: 500;
        border: 2px solid var(--gold);
      }
      .fab-home-icon {
        font-size: 20px;
        line-height: 1;
      }
      .fab-home:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="idband">
      <span><span class="dot"></span>mulage pet</span>
      <span>編輯我的資料</span>
    </div>

    <div class="page-head">
      <a class="back" href="/liff/index.html">‹</a>
      <div class="titles">
        <div class="cn">編輯我的資料</div>
        <div class="en">my profile</div>
      </div>
    </div>

    <a href="/liff/index.html" class="fab-home" aria-label="返回首頁">
      <span class="fab-home-icon">🏠</span>
    </a>

    <div class="notice">
      <div class="title">為什麼要填寫這些資料？</div>
      幫助我們更了解每一位毛孩家長，提供更貼心、更適合您的服務與活動資訊。標示 * 的欄位為必填（依犬貓美容服務定型化契約規定蒐集），其餘為選填，您可以隨時回來修改。
    </div>

    <div id="app"><div class="loading">載入中...</div></div>

    <div class="toast" id="toast"></div>

    <script>
      const LIFF_ID = "2010567973-oT7VRQnN";
      let jwtToken = null;

      const SOURCE_OPTIONS = [
        { value: "FRIEND_REFERRAL", label: "親友介紹" },
        { value: "SOCIAL_MEDIA", label: "社群媒體／廣告" },
        { value: "SEARCH_ENGINE", label: "Google／網路搜尋" },
        { value: "WALK_IN", label: "路過／店面招牌" },
        { value: "REPEAT_CUSTOMER", label: "舊客戶回訪" },
        { value: "OTHER", label: "其他" },
      ];

      async function init() {
        try {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login({ redirectUri: window.location.href });
            return;
          }

          const res = await fetch("/api/line/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true",
            },
            body: JSON.stringify({ idToken: liff.getIDToken() }),
          });
          const data = await res.json().catch(() => null);
          if (!res.ok) {
            document.getElementById("app").innerHTML =
              '<div class="loading" style="color:#8B0000">登入失敗</div>';
            return;
          }
          jwtToken = data?.token || data?.jwtToken || data?.accessToken;

          await loadProfile();
        } catch (e) {
          document.getElementById("app").innerHTML =
            '<div class="loading" style="color:#8B0000">初始化失敗：' +
            e.message +
            "</div>";
        }
      }

      async function loadProfile() {
        try {
          const res = await fetch("/api/users/me", {
            headers: {
              Authorization: "Bearer " + jwtToken,
              "ngrok-skip-browser-warning": "true",
            },
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const me = await res.json();
          renderForm(me);
        } catch (e) {
          document.getElementById("app").innerHTML =
            '<div class="loading" style="color:#8B0000">載入資料失敗：' +
            (e.name ? e.name + " - " : "") +
            e.message +
            "</div>";
        }
      }

      function renderForm(me) {
        document.getElementById("app").innerHTML = `
      <div class="form-card">
        <h3>𖥸 基本資料</h3>

        <div class="field">
          <label>姓名 <span class="req">*</span></label>
          <input type="text" id="name" value="${me.name ? escapeHtml(me.name) : ""}" placeholder="您的稱呼" required />
        </div>

        <div class="field">
          <label>手機號碼 <span class="req">*</span></label>
          <input type="tel" id="phone" value="${me.phone ? escapeHtml(me.phone) : ""}" placeholder="例如：0912345678" required />
        </div>

        <div class="field">
          <label>年齡 <span class="hint">（選填）</span></label>
          <input type="number" id="age" min="0" max="150" value="${me.age ?? ""}" placeholder="例如：30" />
        </div>

        <div class="field">
          <label>職業 <span class="hint">（選填）</span></label>
          <input type="text" id="occupation" value="${me.occupation ? escapeHtml(me.occupation) : ""}" placeholder="例如：上班族、自由業" />
        </div>

        <div class="field">
          <label>居住區域 <span class="hint">（選填）</span></label>
          <input type="text" id="residenceArea" value="${me.residenceArea ? escapeHtml(me.residenceArea) : ""}" placeholder="例如：板橋區" />
        </div>

        <div class="field">
          <label>通訊地址 <span class="req">*</span></label>
          <input type="text" id="mailingAddress" value="${me.mailingAddress ? escapeHtml(me.mailingAddress) : ""}" placeholder="請輸入完整通訊地址" required />
        </div>

        <div class="field">
          <label>緊急聯絡人姓名 <span class="req">*</span></label>
          <input type="text" id="emergencyContactName" value="${me.emergencyContactName ? escapeHtml(me.emergencyContactName) : ""}" placeholder="請輸入緊急聯絡人姓名" required />
        </div>

        <div class="field">
          <label>緊急聯絡人關係 <span class="req">*</span></label>
          <input type="text" id="emergencyContactRelation" value="${me.emergencyContactRelation ? escapeHtml(me.emergencyContactRelation) : ""}" placeholder="例如：父母、配偶、朋友" required />
        </div>

        <div class="field">
          <label>緊急聯絡人電話 <span class="req">*</span></label>
          <input type="tel" id="emergencyContactPhone" value="${me.emergencyContactPhone ? escapeHtml(me.emergencyContactPhone) : ""}" placeholder="例如：0912345678" required />
        </div>

        <div class="field">
          <label>您是從哪裡得知慕沐村的？ <span class="hint">（選填）</span></label>
          <select id="source">
            <option value="">請選擇</option>
            ${SOURCE_OPTIONS.map(
              (o) =>
                `<option value="${o.value}" ${me.source === o.value ? "selected" : ""}>${o.label}</option>`,
            ).join("")}
          </select>
        </div>
      </div>

      <button class="submit-btn" id="submitBtn" onclick="submitForm()">儲存資料</button>
    `;
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      async function submitForm() {
        if (!jwtToken) {
          showToast("請先登入", "error");
          return;
        }

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const ageRaw = document.getElementById("age").value;
        const occupation = document.getElementById("occupation").value.trim();
        const residenceArea = document
          .getElementById("residenceArea")
          .value.trim();
        const source = document.getElementById("source").value;
        const mailingAddress = document.getElementById("mailingAddress").value.trim();
        const emergencyContactName = document.getElementById("emergencyContactName").value.trim();
        const emergencyContactPhone = document.getElementById("emergencyContactPhone").value.trim();
        const emergencyContactRelation = document.getElementById("emergencyContactRelation").value.trim();

        // 需求（追加，配合定型化契約家長資料）：姓名、電話、通訊地址、
        // 緊急聯絡人姓名/電話改為必填；緊急聯絡人關係維持選填。
        if (!name) {
          showToast("請填寫姓名", "error");
          return;
        }
        if (!phone) {
          showToast("請填寫手機號碼", "error");
          return;
        }
        if (!mailingAddress) {
          showToast("請填寫通訊地址", "error");
          return;
        }
        if (!emergencyContactName) {
          showToast("請填寫緊急聯絡人姓名", "error");
          return;
        }
        if (!emergencyContactPhone) {
          showToast("請填寫緊急聯絡人電話", "error");
          return;
        }
        if (!emergencyContactRelation) {
          showToast("請填寫緊急聯絡人關係", "error");
          return;
        }

        const body = {
          name: name || null,
          phone: phone || null,
          age: ageRaw !== "" ? parseInt(ageRaw) : null,
          occupation: occupation || null,
          residenceArea: residenceArea || null,
          source: source || null,
          mailingAddress: mailingAddress,
          emergencyContactName: emergencyContactName || null,
          emergencyContactPhone: emergencyContactPhone || null,
          emergencyContactRelation: emergencyContactRelation,
        };

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "儲存中...";

        try {
          const res = await fetch("/api/users/me", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + jwtToken,
              "ngrok-skip-browser-warning": "true",
            },
            body: JSON.stringify(body),
          });

          const data = await res.json().catch(() => null);
          if (!res.ok) {
            showToast(
              "儲存失敗：" + (data?.message || data || res.status),
              "error",
            );
            return;
          }

          showToast("✅ 資料已更新", "success");
        } catch (e) {
          showToast("網路錯誤，請重試", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "儲存資料";
        }
      }

      function showToast(msg, type = "") {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.className = "toast show " + type;
        setTimeout(() => el.classList.remove("show"), 3000);
      }

      init();
    </script>
  </body>
</html>
