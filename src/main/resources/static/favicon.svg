<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- 背景：品牌炭黑圓角方塊 -->
  <rect width="32" height="32" rx="8" fill="#2B2A28"/>

  <g fill="none" stroke="#B8935A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- 屋簷：小屋屋頂弧線 -->
    <path d="M8.5 15.5 Q16 8.5 23.5 15.5"/>
    <!-- 屋頂紋理線 -->
    <path d="M13.5 10.8 L16.3 15.2"/>
    <path d="M15 10 L17.6 14.6"/>
    <path d="M16.6 9.6 L19 14.2"/>
    <path d="M18.2 9.8 L20.3 14"/>
    <!-- 屋身輪廓，左右延伸成牆面 -->
    <path d="M8.5 15.5 L8.5 20.5"/>
    <path d="M23.5 15.5 L23.5 20"/>
    <!-- 門（小方塊留白） -->
    <rect x="11.6" y="17.6" width="1.6" height="1.6" fill="#B8935A" stroke="none"/>

    <!-- 動物臉頰／耳朵漩渦，銜接屋簷右側 -->
    <path d="M18 15.6
             C 20.3 15.3 22.2 16.6 22.2 19
             C 22.2 20.9 20.7 21.9 19.3 21.5
             C 18.3 21.2 17.9 20.2 18.5 19.5
             C 19 18.9 19.9 19 20 19.7
             C 20.05 20.1 19.75 20.35 19.4 20.3"/>

    <!-- 下巴／臉部弧線，呼應下方剪影 -->
    <path d="M14.5 20.5
             C 13.6 22.8 14 25.3 16.2 26.3
             C 18.4 27.3 20.6 26 20.8 23.7"/>
  </g>

  <!-- 兩個小圓點氣泡，呼應原始 logo 的點綴 -->
  <circle cx="24.6" cy="22.6" r="0.75" fill="#B8935A"/>
  <circle cx="25.6" cy="24.7" r="0.5" fill="#B8935A"/>
</svg>
