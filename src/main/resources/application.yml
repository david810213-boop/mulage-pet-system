spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[hibernate.format_sql]": true
        "[hibernate.dialect]": org.hibernate.dialect.MySQLDialect

  # Flyway：只用來管理「資料種子/回填」，schema 仍由上面的 ddl-auto=update 負責。
  # enabled: false 是關掉 Spring Boot 內建那套「App 啟動最早期、搶在 Hibernate
  # 建表之前執行」的自動機制——如果讓它照預設跑，在全新資料庫（例如本機第一次
  # 建立、或未來換資料庫）上，INSERT 種子資料時 table 根本還不存在，會直接報錯。
  # 改成 DataSeedMigrationRunner（ApplicationRunner）手動呼叫 Flyway.migrate()，
  # 確保 Hibernate 已經把 table 建好之後才執行，兩邊順序才不會衝突。
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8

  # 需求 17/18：寵物照片上傳，預設 1MB 太小，放寬到 10MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 日誌配置（開發環境輸出較多細節）
logging:
  level:
    "[com.example.parking]": DEBUG
    "[org.springframework.web]": INFO
    "[org.hibernate]": INFO

server:
  port: 8081

# LINE Login 設定（在 LINE Developers Console 建立 LINE Login Channel 後取得）
line:
  channel-id: ${LINE_CHANNEL_ID:2010567973}
  # LINE 官方帳號推播用（跟上面的 Login channel 不同，需要另外在 Messaging API 分頁簽發）
  # 還沒申請好之前留空即可，LineMessagingService 會自動跳過發送、只記 log，不會讓系統出錯。
  messaging:
    channel-access-token: ${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:}

# 需求 17/18：Cloudinary 雲端圖床（免費額度）
# 到 https://cloudinary.com 註冊後，在 Dashboard 首頁可以看到這三個值，
# 或是直接複製它給的單一組 CLOUDINARY_URL（cloudinary://<api_key>:<api_secret>@<cloud_name>）
# 設成環境變數 CLOUDINARY_URL 也可以，兩種設定方式擇一即可，這裡採用分開三個值的寫法方便個別覆蓋。
# 還沒申請好之前留空即可，CloudinaryService 會自動跳過上傳、丟出清楚的錯誤訊息，不會讓系統啟動失敗。
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# 需求（追加）：Google 日曆串接——店家一個共用 Google 日曆帳號，所有預約自動同步。
# 用 Service Account（服務帳號）方式串接，不是走一般 OAuth 登入流程：
#   1. 到 Google Cloud Console 建一個專案，啟用 Google Calendar API
#   2. 建立一組 Service Account，下載它的 JSON 金鑰檔
#   3. 把整份 JSON 檔案內容轉成 Base64（一行指令：base64 -w0 credentials.json），
#      設成 GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON_BASE64 環境變數
#   4. 到 Google 日曆網頁版，打開店家要用的那個日曆設定 → 「與特定使用者共用」，
#      把 Service Account 的信箱（JSON 檔裡的 client_email 欄位）加進去，
#      權限選「代為管理活動」，才能讓它新增/刪除事件
#   5. 該日曆的「日曆 ID」（設定頁面裡可以找到，通常長得像一串英數字加
#      @group.calendar.google.com）設成 GOOGLE_CALENDAR_ID 環境變數
# 還沒申請好之前留空即可，GoogleCalendarService 會自動跳過同步、只記 log，
# 不會讓系統啟動失敗、也不會擋住預約流程本身。
google:
  calendar:
    service-account-json-base64: ${GOOGLE_CALENDAR_SERVICE_ACCOUNT_JSON_BASE64:}
    calendar-id: ${GOOGLE_CALENDAR_ID:}

