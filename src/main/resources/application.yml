spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[hibernate.format_sql]": true
        "[hibernate.dialect]": org.hibernate.dialect.MySQLDialect

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8

  # 需求 17/18：寵物照片上傳，預設 1MB 太小，放寬到 10MB
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 日誌配置（開發環境輸出較多細節）
logging:
  level:
    "[com.example.parking]": DEBUG
    "[org.springframework.web]": INFO
    "[org.hibernate]": INFO

server:
  port: 8081

# LINE Login 設定（在 LINE Developers Console 建立 LINE Login Channel 後取得）
line:
  channel-id: ${LINE_CHANNEL_ID:2010567973}
  # LINE 官方帳號推播用（跟上面的 Login channel 不同，需要另外在 Messaging API 分頁簽發）
  # 還沒申請好之前留空即可，LineMessagingService 會自動跳過發送、只記 log，不會讓系統出錯。
  messaging:
    channel-access-token: ${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:}

# 需求 17/18：Cloudinary 雲端圖床（免費額度）
# 到 https://cloudinary.com 註冊後，在 Dashboard 首頁可以看到這三個值，
# 或是直接複製它給的單一組 CLOUDINARY_URL（cloudinary://<api_key>:<api_secret>@<cloud_name>）
# 設成環境變數 CLOUDINARY_URL 也可以，兩種設定方式擇一即可，這裡採用分開三個值的寫法方便個別覆蓋。
# 還沒申請好之前留空即可，CloudinaryService 會自動跳過上傳、丟出清楚的錯誤訊息，不會讓系統啟動失敗。
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
